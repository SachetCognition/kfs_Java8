<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>travel Document2</title>
</head>
<body>
<div layout:fragment="content">
<!-- th:with="travelAttributes=${DataDictionary.TravelRequest.attributes}" -->
<!-- th:with="accountAttributes=${DataDictionary.TravelAccount.attributes}" -->
<!-- th:with="readOnly=${!KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}" -->

<div class="document-page" data-document-type="TravelRequest" data-form-action="travelDocument2" data-show-document-info="true">
<form th:action="@{travelDocument2}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">

 	<kul:hiddenDocumentFields />

	<kul:documentOverview editingMode="${KualiForm.editingMode}" />
	<div class="tab-container" th:data-tab-title="Travel Stuff">
    <h3 th:text="Travel Stuff">Travel Stuff</h3>
		<div class="tab-container" align="center">
		<div class="h2-container">
		    <h2>Travel Request</h2>
		</div>
		<table width="100%" border="0" cellpadding="0" cellspacing="0" class="datatable">
		    <tr>
        		<td colspan="4">
            		<table width="100%" border="0" cellpadding="0" cellspacing="0" class="datatable">
				 		<tr>
				 		<kul:htmlAttributeHeaderCell labelFor="document.traveler" attributeEntry="${travelAttributes.traveler}" align="left" />
				 		<td><input type="text" th:name="document.traveler" th:value="${KualiForm.document.traveler}" th:title="${travelAttributes.traveler.label}" readOnly="${readOnly}" /></td>
				 		</tr>
				 		<tr>
				 		<kul:htmlAttributeHeaderCell labelFor="document.origin" attributeEntry="${travelAttributes.origin}" align="left" />
				 		<td><input type="text" th:name="document.origin" th:value="${KualiForm.document.origin}" th:title="${travelAttributes.origin.label}" readOnly="${readOnly}" /></td>
				 		</tr>
				 		<tr>
				 		<kul:htmlAttributeHeaderCell labelFor="document.destination" attributeEntry="${travelAttributes.destination}" align="left" />
				 		<td><input type="text" th:name="document.destination" th:value="${KualiForm.document.destination}" th:title="${travelAttributes.destination.label}" readOnly="${readOnly}" /></td>
				 		</tr>
				 		<tr>
				 		<kul:htmlAttributeHeaderCell labelFor="document.requestType" attributeEntry="${travelAttributes.requestType}" align="left" />
				 		<td><input type="text" th:name="document.requestType" th:value="${KualiForm.document.requestType}" th:title="${travelAttributes.requestType.label}" readOnly="${readOnly}" /></td>
				 		</tr>
				 		<tr>
				 		<kul:htmlAttributeHeaderCell labelFor="document.accountType" attributeEntry="${travelAttributes.accountType}" align="left" />
				 		<td><input type="text" th:name="document.accountType" th:value="${KualiForm.document.accountType}" th:title="${travelAttributes.accountType.label}" readOnly="${readOnly}" /></td>
				 		</tr>
				 		<tr>
						<th align="left">
				 		&nbsp;&nbsp;* Travel Account
				 		</th>
				 		<td>
				 		<input type="text" th:name="travelAccount.number" th:value="${KualiForm.travelAccount.number}" th:title="${accountAttributes.number.label}" readOnly="${readOnly}" />
                        <kul:lookup boClassName="edu.sampleu.travel.bo.TravelAccount" fieldConversions="number:travelAccount.number" />
                        <kul:directInquiry boClassName="edu.sampleu.travel.bo.TravelAccount" inquiryParameters="travelAccount.number:number" />
						<html:image property="methodToCall.insertAccount" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-add1.gif" alt="Insert an Item" title="Insert an Item" styleClass="tinybutton"/>
                        </td>
				 		</tr>
				 		<logic:iterate id="travAcct" name="KualiForm" property="document.travelAccounts" indexId="ctr">
					 		<tr>
					 			<th>&nbsp;</th>
					 			<td class="datacell">
					 			<kul:htmlControlAttribute attributeEntry="${accountAttributes.number}" property="document.travelAccount[${ctr}].number" readOnly="true"/>
					 			&nbsp;&nbsp;-&nbsp;&nbsp;
					 			<kul:htmlControlAttribute attributeEntry="${accountAttributes.name}" property="document.travelAccount[${ctr}].name" readOnly="true"/>
				 				<html:image property="methodToCall.deleteAccount.(((${ctr})))" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-delete1.gif" alt="Delete an Item" title="Delete an Item" styleClass="tinybutton"/>
					 			</td>
					 		</tr>
				 		</logic:iterate>
			 		</table>
			 	</td>
			 </tr>
		</table>
		</div>
	</div>
	<div th:replace="~{fragments/notes :: notes}"></div>
	<div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>
	<div th:replace="~{fragments/routeLog :: routeLog}"></div>
	<div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
	<kul:documentControls transactionalDocument="false" />

</div>
</div>
</div>
</body>
</html>
