<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Cash Management Status</title>
</head>
<body>
<div layout:fragment="content">
<div class="kfs-page" data-header-title="Cash Management status" data-doc-title="Cash Management status">
<h1>Cash Management status</h1>
<form th:action="@{cashManagementStatus}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="page-body">

	<input type="hidden" th:field="*{verificationUnit}" />
	<input type="hidden" th:field="*{controllingDocumentId}" />
	<input type="hidden" th:field="*{currentDrawerStatus}" />
	<input type="hidden" th:field="*{desiredDrawerStatus}" />

	<br>
	<table width="100%" border=0 cellspacing=0 cellpadding=0>
		<html:messages id="msg" message="true">
			<tr>
				<td><bean:write filter="false" name="msg" /></td>
			</tr>
		</html:messages>
	</table>
	<br>

	<div id="globalbuttons" class="globalbuttons"><input type="image" th:src="@{${ConfigProperties.kr.externalizable.images.url}buttonsmall_returnToIndex.gif}" styleClass="globalbuttons"
		property="methodToCall.returnToIndex" alt="Return to Index" title="Return to Index" />
	&nbsp;&nbsp; <input type="image" th:src="@{${ConfigProperties.externalizable.images.url}buttonsmall_openExisting.gif}"
		styleClass="globalbuttons" property="methodToCall.openExisting"
		alt="Open Existing Cash Management Document" title="Open Existing Cash Management Document" /></div>

</div>
</div>
</div>
</body>
</html>
