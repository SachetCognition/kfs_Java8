<!-- Thymeleaf template converted from JSP: fp/DisbursementVoucherTravelPerDiemLinks.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">fp/DisbursementVoucherTravelPerDiemLinks</title>
</head>
<body>
<div class="kfs-page" data-header-title="Travel Per Diem Links" data-doc-title="Travel Per Diem Links">
  <form action="dvPerDiem.do" method="post">

	<center>

	<table border=0 cellspacing=0 cellpadding=0 width="75%">
		<tr>
			<td>${KualiForm.travelPerDiemLinkPageMessage}</td>
		<tr>
	</table>

	<br>
	<br>

	<div id="workarea">

	<table cellpadding="0">
		<tbody>
			<tr>
				<td colspan="2" class="tab-subhead">Per Diem Category Links</td>
			</tr>

			<tr>
				<th>
				<div align=left>Category Name</div>
				</th>
				<th>
				<div align=left>Category Link</div>
				</th>
			</tr>

			<logic:iterate indexId="ctr" name="KualiForm"
				property="travelPerDiemCategoryCodes" id="currentCategory">
				<tr>
					<th scope="row">
					<div align="right">${currentCategory.perDiemCountryName}</div>
					</th>
					<td valign="top"><a href="${currentCategory.perDiemCountryText}">${currentCategory.perDiemCountryText}</a></td>
				</tr>
			</tr>
		</tbody>
	</table>

	</div>

	</center>

	<br />
	<kul:inquiryControls />

  </form>
</div>
</body>
</html>
