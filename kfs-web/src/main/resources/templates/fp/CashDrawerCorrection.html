<!-- Thymeleaf template converted from JSP: fp/CashDrawerCorrection.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">fp/CashDrawerCorrection</title>
</head>
<body>
<div class="kfs-page" data-header-title="Cash Drawer Correction" data-doc-title="Cash Drawer Correction">
  <form action="cashDrawerCorrection.do" method="post">
    
    <input type="hidden" th:field="*{campusCode}" />
    
    <section class="kfs-tab" data-tab-title="Cash Drawer Corrections" data-default-open="true">
  <h3>Cash Drawer Corrections</h3>
      <div class="tab-container" align="center">
          <h3>Cash Drawer for ${KualiForm.cashDrawer.campusCode}</h3>
        <div th:replace="~{fragments/fp/cashDrawerCurrencyCoin :: content}" data-cash-drawer-property="cashDrawer" data-read-only="false" data-show-cash-drawer-summary="false"></div>
      </div>
    </section>
    
    <div class="kfs-panel-footer"></div>
    
    <div id="globalbuttons" class="globalbuttons">
      <input type="image" property="methodToCall.saveCashDrawer" src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_save.gif" alt="save cash drawer corrections" title="save corrections" styleClass="tinybutton" />
      <input type="image" property="methodToCall.cancelCorrections" src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_cancel.gif" alt="cancel" title="cancel" styleClass="tinybutton" />
    </div>
  </form>
</div>
</body>
</html>
