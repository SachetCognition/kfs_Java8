<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Auxiliary Voucher</title>
</head>
<body>
<div layout:fragment="content">
<div class="document-page" data-document-type="AuxiliaryVoucherDocument" data-form-action="financialAuxiliaryVoucher" data-show-document-info="true">
<form th:action="@{financialAuxiliaryVoucher}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">
		
		<!-- th:with="readOnly=${!KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}" -->

  	   	<SCRIPT type="text/javascript">
		<!--
		    function submitForChangedType() {
        		document.forms[0].submit();
		    }
		//-->
	    </SCRIPT>

		
        <div th:replace="~{fragments/documentOverview :: documentOverview(${{KualiForm.editingMode}})}"></div>
		<!-- AUXILIARY VOUCHER SPECIFIC FIELDS -->
		<div class="tab-container" th:data-tab-title="Auxiliary Voucher Details">
    <h3 th:text="Auxiliary Voucher Details">Auxiliary Voucher Details</h3>
	    	
	    	<div class="tab-container" align="center">
		<h3>Auxiliary Voucher Details</h3>
	    	<table cellpadding="0" class="datatable" summary="view/edit ad hoc recipients">
            <tbody>
              <tr>
                <th width="35%" class="bord-l-b">
                  <div align="right">
                    <kul:htmlAttributeLabel labelFor="selectedAccountingPeriod" attributeEntry="${DataDictionary.AuxiliaryVoucherDocument.attributes.accountingPeriod}" useShortLabel="false" />
                  </div>
                </th>
                <td class="datacell-nowrap">
               		<th:block th:if="${KualiForm.accountingPeriodReadOnly}">
                        ${KualiForm.accountingPeriod.universityFiscalPeriodName}
					</th:block>
                	<th:block th:if="${!KualiForm.accountingPeriodReadOnly}">
						<select th:field="*{selectedAccountingPeriod}"
						 onchange ="submitForChangedType()">
					 		<html:options property="accountingPeriodCompositeValueList" labelProperty="accountingPeriodLabelList"  />
                	 	</select>
               		</th:block>
                </td>
              </tr>
              <tr>
                  <th width="35%" class="bord-l-b">
                      <div align="right">
                          <label th:text="${DataDictionary.AuxiliaryVoucherDocument.attributes.typeCode.label}"></label>
                      </div>
                  </th>
                  <td class="datacell-nowrap">
         	          <kul:htmlControlAttribute
					    	attributeEntry="${DataDictionary.AuxiliaryVoucherDocument.attributes.typeCode}"
                            property="document.typeCode"
                            readOnly="${readOnly}" 
                            readOnlyAlternateDisplay="${fn:escapeXml(KualiForm.formattedAuxiliaryVoucherType)}" 
                            onchange="submitForChangedType()"/>          
						<NOSCRIPT>
    						<input type="submit" value="select" alt="press this button to refresh the page after changing the voucher type." />
						</NOSCRIPT>                
                  </td>
              </tr>
              <th:block th:switch="${true}">
                  <th:block th:case="${empty KualiForm.document.typeCode || KualiForm.document.typeCode == KFSConstants.AuxiliaryVoucher.ADJUSTMENT_DOC_TYPE}">
                  </th:block>                  
                  <th:block th:case="*">
                      <!-- th:with="reversalReadOnly=${readOnly}" -->
                      <th:block th:if="${!reversalReadOnly}">  <!--  if we're already readOnly b/c of authz permissions, then we want to stay that way -->
	                      <th:block th:if="${KualiForm.document.typeCode == KFSConstants.AuxiliaryVoucher.RECODE_DOC_TYPE}">
						      <!-- th:with="reversalReadOnly=true" -->
	                      </th:block>
	                  </th:block>
                      <tr>
                          <kul:htmlAttributeHeaderCell
                                  attributeEntry="${DataDictionary.AuxiliaryVoucherDocument.attributes.reversalDate}"
                                  horizontal="true"
                                  width="35%"
                                  />
                          <td class="datacell-nowrap">
                              <kul:htmlControlAttribute
                                      attributeEntry="${DataDictionary.AuxiliaryVoucherDocument.attributes.reversalDate}"
                                      datePicker="true"
                                      property="document.reversalDate"
                                      readOnly="${reversalReadOnly}"
                                      readOnlyAlternateDisplay="${fn:escapeXml(KualiForm.formattedReversalDate)}"
                                      />
                          </td>
                      </tr>
                  </th:block>
              </th:block>
            </tbody>
          </table>
	    	</div>
		</div>
        <div class="tab-container" th:data-tab-title="Accounting Lines">
    <h3 th:text="Accounting Lines">Accounting Lines</h3>
			<sys-java:accountingLines>
				<sys-java:accountingLineGroup newLinePropertyName="newSourceLine" collectionPropertyName="document.sourceAccountingLines" collectionItemPropertyName="document.sourceAccountingLine" attributeGroupName="source" />
			</sys-java:accountingLines>
		</div>
		<div th:replace="~{fragments/generalLedgerPendingEntries :: glpe}"></div>

		<div th:replace="~{fragments/notes :: notes}"></div>
						
		<div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>
			
		<div th:replace="~{fragments/routeLog :: routeLog}"></div>

		<div th:replace="~{fragments/superUserActions :: superUserActions}"></div>

		<div th:replace="~{fragments/panelFooter :: panelFooter}"></div>

		<div th:replace="~{fragments/documentControls :: documentControls(${documentEntry.transactionalDocument}, ${KualiForm.extraButtons})}"></div>

</div>
</div>
</div>
</body>
</html>
