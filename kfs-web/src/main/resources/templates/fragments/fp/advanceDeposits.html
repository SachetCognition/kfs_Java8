<!-- Thymeleaf fragment converted from tag: fp/advanceDeposits.tag -->
<!-- Fragment parameters: editingMode -->
<div th:fragment="content (editingMode)" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="readOnly=${!KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT] || KualiForm.document.errorCorrected}"> /*/-->

<section class="kfs-tab" data-tab-title="Advance Deposits" data-default-open="true">
  <h3>Advance Deposits</h3>
<!--/*/ <th:block th:with="adAttributes=${DataDictionary.AdvanceDepositDetail.attributes}"> /*/-->
 <div class="tab-container" align=center>
	<h3>Advance Deposits</h3>
	<table cellpadding=0 class="datatable" summary="Advance Deposits">
		<tr>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry=""></th>
            <div th:replace="~{fragments/sys/bankLabel :: content}" data-align="center"></div>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${adAttributes.financialDocumentAdvanceDepositDate}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${adAttributes.financialDocumentAdvanceDepositReferenceNumber}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${adAttributes.financialDocumentAdvanceDepositDescription}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${adAttributes.financialDocumentAdvanceDepositAmount}"></th>
            <th:block th:if="${not readOnly}">
                <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry=""></th>
            </th:block>
		</tr>
        <th:block th:if="${not readOnly}">
            <tr>
                <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry=""></th>
                <div th:replace="~{fragments/sys/bankControl :: content}" data-property="newAdvanceDeposit.financialDocumentBankCode" data-object-property="newAdvanceDeposit.bank" data-deposit-only="true" data-read-only="${readOnly}" data-style="infoline"></div>
                <td class="infoline">    
                    <kul:dateInput attributeEntry="${adAttributes.financialDocumentAdvanceDepositDate}" property="newAdvanceDeposit.financialDocumentAdvanceDepositDate"/>
                </td>
                <td class="infoline">
                	<input type="text" name="newAdvanceDeposit.financialDocumentAdvanceDepositReferenceNumber" th:field="*{newAdvanceDeposit.financialDocumentAdvanceDepositReferenceNumber}" data-attribute-entry="${adAttributes.financialDocumentAdvanceDepositReferenceNumber}" />
                </td>
                <td class="infoline">
                	<input type="text" name="newAdvanceDeposit.financialDocumentAdvanceDepositDescription" th:field="*{newAdvanceDeposit.financialDocumentAdvanceDepositDescription}" data-attribute-entry="${adAttributes.financialDocumentAdvanceDepositDescription}" />
                </td>
                <td class="infoline">
                	<input type="text" name="newAdvanceDeposit.financialDocumentAdvanceDepositAmount" th:field="*{newAdvanceDeposit.financialDocumentAdvanceDepositAmount}" data-attribute-entry="${adAttributes.financialDocumentAdvanceDepositAmount}" />
                </td>
                <td class="infoline">
                	<div align="center">
                		<input type="image" property="methodToCall.addAdvanceDeposit" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-add1.gif" alt="Add an Advance Deposit" title="Add an Advance Deposit" styleClass="tinybutton"/>
                	</div>
                </td>
            </tr>
        </th:block>
        <tr th:each="advanceDepositDetail : ${KualiForm.document.advanceDeposits}" indexId="ctr">
            <tr>
                <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry=""></th>
                </div><!-- /kul:htmlAttributeHeaderCell -->
                <div th:replace="~{fragments/sys/bankControl :: content}" data-property="document.advanceDepositDetail[${ctr}].financialDocumentBankCode" data-object-property="document.advanceDepositDetail[${ctr}].bank" data-deposit-only="true" data-read-only="${readOnly}"></div>
                <td class="datacell">
                	<th:block th:switch="${true}">
                        <th:block th:case="${readOnly}">
                            <input type="text" name="document.advanceDepositDetail[${ctr}].financialDocumentAdvanceDepositDate" th:field="*{document.advanceDepositDetail[${ctr}].financialDocumentAdvanceDepositDate}" data-attribute-entry="${adAttributes.financialDocumentAdvanceDepositDate}" readonly="readonly" />
                        </th:block>
                        <th:block th:case="*">
                            <kul:dateInput attributeEntry="${adAttributes.financialDocumentAdvanceDepositDate}" property="document.advanceDepositDetail[${ctr}].financialDocumentAdvanceDepositDate" />
                        </th:block>
                    </th:block>
                </td>
                <td class="datacell">
                	<input type="text" name="document.advanceDepositDetail[${ctr}].financialDocumentAdvanceDepositReferenceNumber" th:field="*{document.advanceDepositDetail[${ctr}].financialDocumentAdvanceDepositReferenceNumber}" data-attribute-entry="${adAttributes.financialDocumentAdvanceDepositReferenceNumber}" />
                </td>
                <td class="datacell">
                	<input type="text" name="document.advanceDepositDetail[${ctr}].financialDocumentAdvanceDepositDescription" th:field="*{document.advanceDepositDetail[${ctr}].financialDocumentAdvanceDepositDescription}" data-attribute-entry="${adAttributes.financialDocumentAdvanceDepositDescription}" />
                </td>
                <td class="datacell">
                	<input type="text" name="document.advanceDepositDetail[${ctr}].financialDocumentAdvanceDepositAmount" th:field="*{document.advanceDepositDetail[${ctr}].financialDocumentAdvanceDepositAmount}" data-attribute-entry="${adAttributes.financialDocumentAdvanceDepositAmount}" />
                </td>
                <th:block th:if="${not readOnly}">
                    <td class="datacell">
                    	<div align="center">
                    		<input type="image" property="methodToCall.deleteAdvanceDeposit.line${ctr}" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-delete1.gif" alt="Delete an Advance Deposit" title="Delete an Advance Deposit" styleClass="tinybutton"/>
                    	</div>
                    </td>
                </th:block>
            </tr>
        </tr>
		<tr>
			<!--/*/ <th:block th:with="leadingColSpan=${KualiForm.editingMode[Constants.BANK_ENTRY_VIEWABLE_EDITING_MODE] ? 6 : 5}"> /*/-->
	 		<td class="total-line" colspan="${leadingColSpan}">&nbsp;</td>
	  		<td class="total-line" ><strong>Total: ${KualiForm.document.currencyFormattedTotalAdvanceDepositAmount}</strong></td>
            <th:block th:if="${not readOnly}">
                <td class="total-line">&nbsp;</td>
            </th:block>
		</tr>
	</table>
  </div>
</section>
</div>
