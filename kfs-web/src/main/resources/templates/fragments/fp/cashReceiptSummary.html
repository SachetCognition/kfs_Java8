<!-- Thymeleaf fragment converted from tag: fp/cashReceiptSummary.tag -->
<!-- Fragment parameters: receipt, receiptIndex -->
<div th:fragment="content (receipt, receiptIndex)" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="checkBaseAttributes=${DataDictionary.CheckBase.attributes}"> /*/-->

<th:block th:if="${receipt.checkCount > 0}">
    <tr>
        <td class="infoline" rowspan="${receipt.checkCount + 1}" colspan="2">&nbsp;</td>
        <td class="infoline">
            <label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${checkBaseAttributes.checkNumber}"></label>
        </td>
        <td class="infoline">
            <label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${checkBaseAttributes.checkDate}"></label>
        </td>
        <td class="infoline">
            <label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${checkBaseAttributes.description}"></label>
        </td>
        <td class="infoline">
            <label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${checkBaseAttributes.amount}"></label>
        </td>
        <td class="infoline" rowspan="${receipt.checkCount + 1}">&nbsp;</td>
    </tr>

    <tr th:each=" : ${receipt.checks}" id="check" indexId="checkIndex">
        <tr>
            <td>${check.checkNumber}</td>
            <td>${check.checkDate}</td>
            <td>${check.description}</td>
            <td>${check.amount}</td>
        </tr>
    </tr>
</th:block>
</div>
