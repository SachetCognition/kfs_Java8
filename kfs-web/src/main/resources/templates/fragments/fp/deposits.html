<!-- Thymeleaf fragment converted from tag: fp/deposits.tag -->
<!-- Fragment parameters: editingMode -->
<div th:fragment="content (editingMode)" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="allowAdditionalDeposits=${editingMode['allowAdditionalDeposits']}"> /*/-->

<section class="kfs-tab" data-tab-title="Deposits" data-default-open="true">
  <h3>Deposits</h3>    
    <div class="tab-container" align=center>
        <th:block th:if="${allowAdditionalDeposits}">
            <div align=left style="padding-left: 10px">
                <input type="image" src="${ConfigProperties.externalizable.images.url}buttonsmall_addInterimDeposit.gif" style="border: none" property="methodToCall.addInterimDeposit" title="create interim" alt="create interim deposit"/>
                <input type="image" src="${ConfigProperties.externalizable.images.url}buttonsmall_addFinalDeposit.gif" style="border: none" property="methodToCall.addFinalDeposit" title="create final deposit" alt="create final deposit"/>
            </div>
            <br>
        </th:block>

        <logic:iterate indexId="ctr" name="KualiForm" property="document.deposits" id="currentDeposit">
            <th:block th:if="${ctr == 0}">
                <hr>
            </th:block>

            <div th:replace="~{fragments/fp/deposit :: content}" data-editing-mode="${editingMode}" data-deposit-index="${ctr}" data-deposit="${currentDeposit}"></div>
                    
            <hr>
        </tr>
        
        <th:block th:if="${KualiForm.lastInterimDepositFinalizable}">
          <div align="left" style="padding-left: 10px">
            <input type="image" src="${ConfigProperties.externalizable.images.url}buttonsmall_finalizedepos.gif" style="border: none" property="methodToCall.finalizeLastInterimDeposit" title="make last interim deposit final" alt="make last interim deposit final" />
          </div>
        </th:block>
    </div>
</section>
</div>
