<!-- Thymeleaf fragment converted from tag: fp/capitalAssetModifyTab.tag -->
<!-- Fragment parameters: readOnly -->
<div th:fragment="content (readOnly)" xmlns:th="http://www.thymeleaf.org">
<%@ tag description="render the capital modify tag that contains the given capital asset info"%>

<!--/*/ <th:block th:with="capitalAssetInfoSize=${#strings.length(KualiForm.document.capitalAssetInformation)}"> /*/-->	
<!--/*/ <th:block th:with="defaultOpen=false"> /*/-->
<!--/*/ <th:block th:with="modifiedCapitalAssets=0"> /*/-->

<c:forEach items="${KualiForm.document.capitalAssetInformation}" var="detailLine" varStatus="status">
	<th:block th:if="${detailLine.capitalAssetActionIndicator == KFSConstants.CapitalAssets.CAPITAL_ASSET_MODIFY_ACTION_INDICATOR}">
		<!--/*/ <th:block th:with="modifiedCapitalAssets=${modifiedCapitalAssets + 1}"> /*/-->
	</th:block>
</tr>	

<th:block th:if="${modifiedCapitalAssets > 0}">
	<!--/*/ <th:block th:with="defaultOpen=true"> /*/-->
</th:block>

<section class="kfs-tab" data-tab-title="${KFSConstants.CapitalAssets.MODIFY_CAPITAL_ASSETS_TAB_TITLE}" data-default-open="${defaultOpen}">
  <h3>${KFSConstants.CapitalAssets.MODIFY_CAPITAL_ASSETS_TAB_TITLE}</h3>
     <div class="tab-container" align="center" valign="middle">
		 <h3>Modify Capital Assets</h3>
		 <table class="datatable" cellpadding="0" cellspacing="0" summary="Capital Asset Information">
		     <th:block th:if="${modifiedCapitalAssets <= 0}">
				<tr>
					<td class="datacell" height="50" colspan="5"><div align="center">There are currently no Modify Capital Assets entries associated with this Transaction Processing document.</div></td>
				</tr>
			</th:block>
			<th:block th:if="${modifiedCapitalAssets > 0}">
				<tr>
					<td>
						<div th:replace="~{fragments/fp/capitalAssetModify :: content}" data-read-only="${readOnly}"></div>					
					</td>
				</tr>	 
	 		</th:block>
	     </table>
	 </div>	
</section>
</div>
