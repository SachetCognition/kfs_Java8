<!-- Thymeleaf fragment converted from tag: fp/recentlyClosedMiscAdvances.tag -->
<div th:fragment="content ()" xmlns:th="http://www.thymeleaf.org">
<section class="kfs-tab" data-tab-title="Recently Closed Miscellaneous Advances" data-default-open="false">
  <h3>Recently Closed Miscellaneous Advances</h3>
  <div class="tab-container" align="center">
    <table border="0" cellspacing="3" cellpadding="3" class="datatable">
      <tr>
        <th>Identifier</th>
        <th>Open Date</th>
        <th>Closed Date</th>
        <th>Total Amount</th>
      </tr>
      <tr th:each="itemInProcess : ${KualiForm.recentlyClosedItemsInProcess}">
        <tr>
          <td><div th:replace="~{fragments/fp/miscAdvanceInquiry :: content}" data-item-in-process="${itemInProcess}"></div></td>
          <td><fmt:formatDate value="${itemInProcess.itemOpenDate}" /></td>
          <td><fmt:formatDate value="${itemInProcess.itemClosedDate}" /></td>
          <td>$${itemInProcess.itemAmount}</td>
        </tr>
      </tr>
    </table>
  </div>
</section>
</div>
