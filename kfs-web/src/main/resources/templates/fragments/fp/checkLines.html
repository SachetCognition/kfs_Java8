<!-- Thymeleaf fragment converted from tag: fp/checkLines.tag -->
<!-- Fragment parameters: checkDetailMode, editingMode, totalAmount, displayHidden -->
<div th:fragment="content (checkDetailMode, editingMode, totalAmount, displayHidden)" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="checkBaseAttributes=${DataDictionary.CheckBase.attributes}"> /*/-->

<!--/*/ <th:block th:with="readOnly=${!KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}"> /*/-->
<!--/*/ <th:block th:with="columnCount=5"> /*/-->
<th:block th:if="${!readOnly}">
    <!--/*/ <th:block th:with="columnCount=${columnCount + 1}"> /*/-->
</th:block>

<th:block th:if="${checkDetailMode}">
        
            <table cellpadding=0 class="datatable" summary="check detail information">
                <tr>
                    <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry=""></th>
                    <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${checkBaseAttributes.checkNumber}"></th>
                    <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${checkBaseAttributes.checkDate}"></th>
                    <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${checkBaseAttributes.description}"></th>
                    <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${checkBaseAttributes.amount}"></th>
                                
                    <th:block th:if="${!readOnly}">
                        <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry=""></th>
                    </th:block>
                </tr>
    			<th:block th:if="${!readOnly}">
            <div th:replace="~{fragments/fp/checkLine :: content}" data-read-only="${readOnly}" data-row-heading="add" data-property-name="document.currentTransaction.newCheck" data-action-image="${ConfigProperties.kr.externalizable.images.url}tinybutton-add1.gif" data-action-alt="add" data-action-method="addCheck" data-css-class="infoline" data-display-hidden="${displayHidden}"></div>
          </th:block>            
                <tr th:each="check : ${KualiForm.document.currentTransaction.moneyInChecks}" indexId="ctr">
                    <div th:replace="~{fragments/fp/checkLine :: content}" data-read-only="${readOnly}" data-row-heading="${ctr + 1}" data-property-name="document.currentTransaction.moneyInCheck[${ctr}]" data-baseline-property-name="document.currentTransaction.baselineCheck[${ctr}]" data-action-image="${ConfigProperties.kr.externalizable.images.url}tinybutton-delete1.gif" data-action-alt="delete" data-action-method="deleteCheck.line${ctr}" data-css-class="datacell" data-display-hidden="${displayHidden}"></div>
                </tr>
    
                <th:block th:if="${!empty totalAmount}">
                    <tr>
                        <td class="total-line" colspan="4">&nbsp;</td>
                        <td class="total-line"><strong>Total: ${totalAmount}</strong></td>
                        <th:block th:if="${!readOnly}">
                            <td class="total-line">&nbsp;</td>
                        </th:block>
                    </tr>
                </th:block>
            </table>
</th:block>

<th:block th:if="${!checkDetailMode}">
    <kul:hiddenTab forceOpen="true">
        <%-- maintain state of hidden checkLines --%>
        <tr th:each="check : ${KualiForm.document.currentTransaction.moneyInChecks}" indexId="ctr">
            <div th:replace="~{fragments/fp/hiddenCheckLine :: content}" data-property-name="document.currentTransaction.moneyInCheck[${ctr}]" data-baseline-property-name="document.currentTransaction.baselineCheck[${ctr}]" data-display-hidden="${displayHidden}"></div>
        </tr>
    </div><!-- /kul:hiddenTab -->
</th:block>
</div>
