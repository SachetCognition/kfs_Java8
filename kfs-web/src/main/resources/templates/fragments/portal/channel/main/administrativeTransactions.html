<!-- Thymeleaf fragment converted from tag: portal/channel/main/administrativeTransactions.tag -->
<div th:fragment="content ()" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/channel/portalChannelTop :: content}" data-channel-title="Administrative Transactions"></div>
<div class="body">
	<th:block th:if="${ConfigProperties.module.accounts.receivable.enabled == 'true' && ConfigProperties.contracts.grants.billing.enabled == 'true'}">
  		<strong>Accounts Receivable</strong></br>
  		<ul class="chan">	
			<li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Generate Dunning Letters" data-url="${ConfigProperties.application.url}/arGenerateDunningLettersLookup.do?methodToCall=start&businessObjectClassName=org.kuali.kfs.module.ar.businessobject.GenerateDunningLettersLookupResult&docFormKey=88888888&returnLocation=${ConfigProperties.application.url}/portal.do&hideReturnLink=true"></div></li>
			<li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Transmit Contracts & Grants Invoices" data-url="${ConfigProperties.application.url}/arTransmitContractsAndGrantsInvoices.do?methodToCall=start&businessObjectClassName=org.kuali.kfs.module.ar.businessobject.TransmitContractsAndGrantsInvoicesLookupDataHolder&docFormKey=88888888&returnLocation=${ConfigProperties.application.url}/portal.do&hideReturnLink=true"></div></li>
  		</ul>
	</th:block>
	<th:block th:if="${ConfigProperties.module.capital.asset.enabled == 'true'}">
  		<strong>Capital Asset Builder</strong>
  		<ul class="chan">
	 		<li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Capital Asset Builder AP Transactions" data-url="${ConfigProperties.application.url}/kr/lookup.do?methodToCall=start&businessObjectClassName=org.kuali.kfs.module.cab.businessobject.PurchasingAccountsPayableProcessingReport&docFormKey=88888888&returnLocation=${ConfigProperties.application.url}/portal.do&hideReturnLink=true"></div></li>
  	 		<li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Capital Asset Builder GL Transactions" data-url="${ConfigProperties.application.url}/kr/lookup.do?methodToCall=start&businessObjectClassName=org.kuali.kfs.module.cab.businessobject.GeneralLedgerEntry&docFormKey=88888888&returnLocation=${ConfigProperties.application.url}/portal.do&hideReturnLink=true"></div></li>
  		</ul>

  		<strong>Capital Asset Management</strong>
  		<ul class="chan">
     		<li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Asset Manual Payment" data-url="${ConfigProperties.application.url}/camsAssetPayment.do?methodToCall=docHandler&command=initiate&docTypeName=MPAY"></div></li>
  	 		<li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Barcode Inventory Process" data-url="${ConfigProperties.application.url}/uploadBarcodeInventoryFile.do?methodToCall=start&batchUpload.batchInputTypeName=assetBarcodeInventoryInputFileType"></div></li>			 
  		</ul>
		</th:block>
	<th:block th:if="${ConfigProperties.module.labor.distribution.enabled == 'true'}">
  		<strong>Effort Certification</strong>
  		<ul class="chan">		
	 		<li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Effort Certification Recreate" data-url="${ConfigProperties.application.url}/effortCertificationRecreate.do?methodToCall=docHandler&command=initiate&docTypeName=ECD"></div></li>
  		</ul>
	</th:block>
	<strong>Financial Processing</strong><br />
    <ul class="chan">
        <li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Cash Management" data-url="${ConfigProperties.application.url}/financialCashManagement.do?methodToCall=docHandler&command=initiate&docTypeName=CMD"></div></li>
		<li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="General Ledger Correction Process" data-url="${ConfigProperties.application.url}/generalLedgerCorrection.do?methodToCall=docHandler&command=initiate&docTypeName=GLCP"></div></li>									
		<li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Journal Voucher" data-url="${ConfigProperties.application.url}/financialJournalVoucher.do?methodToCall=docHandler&command=initiate&docTypeName=JV"></div></li>
		<li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Non-Check Disbursement" data-url="${ConfigProperties.application.url}/financialNonCheckDisbursement.do?methodToCall=docHandler&command=initiate&docTypeName=ND"></div></li>
		<li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Service Billing" data-url="${ConfigProperties.application.url}/financialServiceBilling.do?methodToCall=docHandler&command=initiate&docTypeName=SB"></div></li>
    </ul>
	<th:block th:if="${ConfigProperties.module.labor.distribution.enabled == 'true'}">    
    	<strong>Labor Distribution</strong><br />
    	<ul class="chan">
    		<li>
				<div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Labor Journal Voucher" data-url="${ConfigProperties.application.url}/laborJournalVoucher.do?methodToCall=docHandler&command=initiate&docTypeName=LLJV"></div>
			</li>
			<li>
				<div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Labor Ledger Correction Process" data-url="${ConfigProperties.application.url}/laborLedgerCorrection.do?methodToCall=docHandler&command=initiate&docTypeName=LLCP"></div>
			</li>
    	</ul>    
	</th:block>    
	<strong>System</strong>
	<ul class="chan">
		<li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Electronic Payment Claim" data-url="${ConfigProperties.application.url}/electronicFundTransfer.do?methodToCall=start"></div></li>
	</ul>
	<th:block th:if="${ConfigProperties.module.travel.enabled == 'true'}">	   
    <strong>Travel</strong>
    <ul class="chan">
        <li><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Travel Agency Audit and Correction" data-url="${ConfigProperties.application.url}/kr/lookup.do?methodToCall=start&businessObjectClassName=org.kuali.kfs.module.tem.businessobject.AgencyStagingData&docFormKey=88888888&returnLocation=${ConfigProperties.application.url}/portal.do&hideReturnLink=true"></div></li>
    </ul>
    </th:block>
</div>
<div th:replace="~{fragments/channel/portalChannelBottom :: content}"></div>
</div>
