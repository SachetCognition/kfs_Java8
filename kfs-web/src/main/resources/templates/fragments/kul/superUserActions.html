<div th:fragment="content" class="kfs-super-user-section">
  <section class="kfs-tab" data-tab-title="Super User Actions" th:if="${KualiForm.documentActions['superUserApprove'] or KualiForm.documentActions['superUserDisapprove']}">
    <h3>Super User Actions</h3>
    <div class="kfs-super-user-controls">
      <label>Annotation:</label>
      <textarea name="superUserAnnotation"></textarea>
      <button type="submit" name="methodToCall.superUserApprove" th:if="${KualiForm.documentActions['superUserApprove']}">Super User Approve</button>
      <button type="submit" name="methodToCall.superUserDisapprove" th:if="${KualiForm.documentActions['superUserDisapprove']}">Super User Disapprove</button>
    </div>
  </section>
</div>
