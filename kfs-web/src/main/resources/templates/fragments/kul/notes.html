<div th:fragment="content" class="kfs-notes-section">
  <section class="kfs-tab" data-tab-title="Notes and Attachments">
    <h3>Notes and Attachments</h3>
    <table class="kfs-notes-table">
      <thead><tr><th>Posted Timestamp</th><th>Author</th><th>Note Text</th><th>Attached File</th></tr></thead>
      <tbody>
        <tr th:each="note : ${document.notes}">
          <td th:text="${note.notePostedTimestamp}"></td>
          <td th:text="${note.authorUniversalIdentifier}"></td>
          <td th:text="${note.noteText}"></td>
          <td th:if="${note.attachment != null}" th:text="${note.attachment.attachmentFileName}"></td>
        </tr>
      </tbody>
    </table>
  </section>
</div>
