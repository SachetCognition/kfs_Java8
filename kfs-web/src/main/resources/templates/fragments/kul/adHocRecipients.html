<div th:fragment="content" class="kfs-adhoc-section">
  <section class="kfs-tab" data-tab-title="Ad Hoc Recipients">
    <h3>Ad Hoc Recipients</h3>
    <table class="kfs-adhoc-table">
      <thead><tr><th>Action Requested</th><th>Person</th><th>Actions</th></tr></thead>
      <tbody>
        <tr th:each="recipient : ${KualiForm.adHocRoutePersons}">
          <td th:text="${recipient.actionRequested}"></td>
          <td th:text="${recipient.id}"></td>
          <td><button type="submit" name="methodToCall.deleteAdHocRoutePerson">Delete</button></td>
        </tr>
      </tbody>
    </table>
  </section>
</div>
