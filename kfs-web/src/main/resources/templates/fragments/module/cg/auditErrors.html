<!-- Thymeleaf fragment converted from tag: module/cg/auditErrors.tag -->
<!-- Fragment parameters: cluster, keyMatch, isLink, includesTitle -->
<div th:fragment="content (cluster, keyMatch, isLink, includesTitle)" xmlns:th="http://www.thymeleaf.org">
<th:block th:if="${!empty cluster}">
	<!--/*/ <th:block th:with="isFirstLocalError=true"> /*/-->
	<div class="error">
		<c:forEach items="${AuditErrors[cluster].auditErrorList}" var="audit" varStatus="status">
			<c:set var="errorText">
				<bean:message key="${audit.messageKey}" arg0="${audit.params[0]}" arg1="${audit.params[1]}" arg2="${audit.params[2]}" arg3="${audit.params[3]}" arg4="${audit.params[4]}"/>
			</c:set>
			<c:forEach items="${fn:split(keyMatch,',')}" var="prefix">
				<th:block th:if="${(empty prefix) || (audit.errorKey == prefix) || (fn:endsWith(prefix, '*') && fn:startsWith(audit.errorKey, fn:replace(prefix, '*', '')))}">
					<th:block th:if="${includesTitle && isFirstLocalError}">
						<!--/*/ <th:block th:with="isFirstLocalError=false"> /*/-->
						<strong>Audit Errors found in this Section:</strong><br/>
					</th:block>
					<th:block th:switch="${true}">
						<th:block th:case="${isLink}">
							<tr>
								<td>&nbsp;</td>
								<td width="94%">${errorText}</td>
								<td width="5%"><div align="center"><input type="image" src="${ConfigProperties.externalizable.images.url}tinybutton-fix.gif" property="methodToCall.${audit.link}.x"/></div></td>
							</tr>
						</th:block>
						<th:block th:case="*"><li>${errorText}</li></th:block>
					</th:block>
				</th:block>
			</tr>
		</tr>
	</div>
</th:block>
</div>
