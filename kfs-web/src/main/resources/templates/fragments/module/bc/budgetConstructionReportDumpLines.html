<!-- Thymeleaf fragment converted from tag: module/bc/budgetConstructionReportDumpLines.tag -->
<div th:fragment="content ()" xmlns:th="http://www.thymeleaf.org">
<section class="kfs-tab" data-tab-title="Report/Export" data-default-open="true">
  <h3>Report/Export</h3>
<div class="tab-container" align=center>
    <table width="100%" border="0" cellpadding="0" cellspacing="0" class="datatable">
    <tr>
        <td colspan="2" class="subhead">
		    <span class="subhead-left">Report/Export</span>
		</td>
    </tr>

    <c:forEach items="${KualiForm.budgetConstructionDocumentReportModes}" var="item" varStatus="status" >
        <tr>
            <td class="datacell" nowrap>
                <div align="center">
                  <input type="image" property="methodToCall.performReportDump.line${status.index}" src="${ConfigProperties.externalizable.images.url}tinybutton-view.gif" title="Run Report/Dump For Line ${status.index}" onclick="excludeSubmitRestriction=true" alt="Run Report/Dump Line ${status.index}" styleClass="tinybutton" />
                </div>
            </td>
            <td class="datacell" nowrap>
                <div align="left">
                    ${item.reportDesc}
                </div>
            </td>
        </tr>
    
    </tr>
    </table>
</div>
</section>
</div>
