<!-- Thymeleaf fragment converted from tag: module/bc/reasonCodePick.tag -->
<div th:fragment="content ()" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="objectCodeAttribute=${DataDictionary.BudgetConstructionObjectPick.attributes}"> /*/-->

<table align="center" cellpadding="0" cellspacing="0" class="datatable-100">
	<tr>
		<th class="grid" colspan="2" align="left">
			<br>
			<span th:text="#{${__MSG_KEY__}}"></span>
			<br><br>
		</th>
	</tr>

	<tr>
		<th class="grid">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${objectCodeAttribute.financialObjectCode}"></label>
		</th>
		<th class="grid">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${objectCodeAttribute.objectCodeDescription}"></label>
		</th>
	</tr>

	<logic:iterate name="KualiForm" id="objectCodePick"	property="objectCodePickList" indexId="ctr">
		<html-el:hidden name="KualiForm" property="objectCodePickList[${ctr}].principalId" />
		<html-el:hidden name="KualiForm" property="objectCodePickList[${ctr}].versionNumber" />
		<html-el:hidden name="KualiForm" property="objectCodePickList[${ctr}].selectFlag" />

		<th:block th:if="${objectCodePick.selectFlag == 1}">
			<tr align="center">
				<td class="grid" valign="center">
					<input type="text" name="objectCodePickList[${ctr}].financialObjectCode" th:field="*{objectCodePickList[${ctr}].financialObjectCode}" data-attribute-entry="${objectCodeAttribute.financialObjectCode}" readonly="readonly" />
				</td>
				<td class="grid" valign="center">
					<input type="text" name="objectCodePickList[${ctr}].objectCodeDescription" th:field="*{objectCodePickList[${ctr}].objectCodeDescription}" data-attribute-entry="${objectCodeAttribute.objectCodeDescription}" readonly="readonly" />
				</td>
			</tr>
		</th:block>
	</tr>

</table>
<br />
<table align="center" cellpadding="0" cellspacing="0"class="datatable-100">
	<tr>
		<th class="grid" colspan="6" align="left">
			<br>
			${KualiForm.operatingModeTitle}
			<br><br>
		</th>
	</tr>

	<th:block th:if="${empty KualiForm.reasonCodePickList}">
		<tr>
			<th class="grid" colspan="6" align="left">
				<span th:text="#{${__MSG_KEY__}}"></span>
			</th>
		</tr>
</table>

<div id="globalbuttons" class="globalbuttons">
	<input type="image" src="${ConfigProperties.externalizable.images.url}buttonsmall_back.gif"
		styleClass="globalbuttons" property="methodToCall.start" title="back"
		alt="back" />
	<input type="image" src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_close.gif"
		styleClass="globalbuttons" property="methodToCall.returnToCaller"
		title="close" alt="close" />
</div>
</th:block>

<th:block th:if="${!empty KualiForm.reasonCodePickList}">
	<!--/*/ <th:block th:with="reasonCodeAttribute=${DataDictionary.BudgetConstructionReasonCodePick.attributes}"> /*/-->

	<tr>
		<th class="grid">
			Select
		</th>
		<th class="grid">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${reasonCodeAttribute.appointmentFundingReasonCode}"></label>
		</th>
		<th class="grid">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${reasonCodeAttribute['appointmentFundingReason.appointmentFundingReasonDescription']}"></label>
		</th>
	</tr>

	<logic:iterate name="KualiForm" id="reasonCodePick"	property="reasonCodePickList" indexId="ctr">
		<html-el:hidden name="KualiForm" property="reasonCodePickList[${ctr}].principalId" />
		<html-el:hidden name="KualiForm" property="reasonCodePickList[${ctr}].versionNumber" />

		<tr align="center">
			<td class="grid" valign="center">
				<html:checkbox property="reasonCodePickList[${ctr}].selectFlag"
					value="1" />
			</td>
			<td class="grid" valign="center">
				<input type="text" name="reasonCodePickList[${ctr}].appointmentFundingReasonCode" th:field="*{reasonCodePickList[${ctr}].appointmentFundingReasonCode}" data-attribute-entry="${reasonCodeAttribute.appointmentFundingReasonCode}" readonly="readonly" />
			</td>
			<td class="grid" valign="center">
				<input type="text" name="reasonCodePickList[${ctr}].appointmentFundingReason.appointmentFundingReasonDescription" th:field="*{reasonCodePickList[${ctr}].appointmentFundingReason.appointmentFundingReasonDescription}" data-attribute-entry="${reasonCodeAttribute['appointmentFundingReason.appointmentFundingReasonDescription']}" readonly="readonly" />
			</td>
		</tr>
	</tr>

	</table>

	<div id="globalbuttons" class="globalbuttons">
		<input type="image" src="${ConfigProperties.externalizable.images.url}buttonsmall_back.gif"
			styleClass="globalbuttons" property="methodToCall.start" title="back"
			alt="back" />
		<input type="image" src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_selectall.gif"
			property="methodToCall.selectAllReasonCodes" title="Select"
			alt="Select All Codes" styleClass="smallbutton" />
		<input type="image" src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_unselall.gif"
			property="methodToCall.unselectAllReasonCodes" title="Unselect"
			alt="Unselect All Codes" styleClass="smallbutton" />
		<input type="image" src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_submit.gif"
			styleClass="globalbuttons" property="methodToCall.performReport"
			title="Perform Report" alt="submit"
			onclick="excludeSubmitRestriction=true" />
		<input type="image" src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_close.gif"
			styleClass="globalbuttons" property="methodToCall.returnToCaller"
			title="close" alt="close" />
	</div>

</th:block>
</div>
