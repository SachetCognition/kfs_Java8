<!-- Thymeleaf fragment converted from tag: module/bc/subheadingWithDetailToggleRow.tag -->
<!-- Fragment parameters: columnCount, subheading, usePercentAdj, readOnly -->
<div th:fragment="content (columnCount, subheading, usePercentAdj, readOnly)" xmlns:th="http://www.thymeleaf.org">
<th:block th:if="{empty usePercentAdj}">
  <c:set var="usePercentAdj" value='false'/>
</th:block>

<%-- default readOnly to true if the hide/show Percent button is wanted and readOnly is not defined --%>
<th:block th:if="{usePercentRevExp && empty readOnly}">
  <c:set var="readOnly" value='true'/>
</th:block>

<tr>
  <td colspan="${columnCount}" class="subhead">
    <span class="subhead-left">${subheading}</span>
    <span class="subhead-right">

      <th:block th:if="${usePercentAdj && !readOnly}">

	    <input type="hidden" th:field="*{hideAdjustmentMeasurement}" />
	    <!--/*/ <th:block th:with="hideOrShow=${KualiForm.hideAdjustmentMeasurement ? 'show' : 'hide'}"> /*/-->
	    <input type="image" property="methodToCall.toggleAdjustmentMeasurement" 
		  src="${ConfigProperties.externalizable.images.url}tinybutton-${hideOrShow}adjust.gif" 
		  alt="${hideOrShow} percent adjustment" title="${hideOrShow} percent adjustment"
		  styleClass="tinybutton" />	

      </th:block>

      <html:hidden name="KualiForm" property="hideDetails"/>
      <th:block th:if="${!empty KualiForm.hideDetails}">
        <!--/*/ <th:block th:with="toggle=${KualiForm.hideDetails ? 'show' : 'hide'}"> /*/-->
        <input type="image" property="methodToCall.${toggle}Details" src="${ConfigProperties.kr.externalizable.images.url}det-${toggle}.gif"
                    alt="${toggle} transaction details" title="${toggle} transaction details" styleClass="tinybutton"/>
      </th:block>
    </span>
  </td>
</tr>
</div>
