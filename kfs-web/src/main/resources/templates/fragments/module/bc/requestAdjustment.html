<!-- Thymeleaf fragment converted from tag: module/bc/requestAdjustment.tag -->
<!-- Fragment parameters: attributes, adjustmentAmountFieldName, methodToCall, lineIndex, anchor -->
<div th:fragment="content (attributes, adjustmentAmountFieldName, methodToCall, lineIndex, anchor)" xmlns:th="http://www.thymeleaf.org">
<div style="nowrap">
	<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${attributes.adjustmentAmount}"></label>
	
	<input type="text" name="${adjustmentAmountFieldName}" th:field="*{${adjustmentAmountFieldName}}" data-attribute-entry="${attributes.adjustmentAmount}" />			
	
    <!--/*/ <th:block th:with="anchorString="> /*/-->
	<th:block th:if="${!empty anchor}">
	    <!--/*/ <th:block th:with="anchorString=.${anchor}"> /*/-->
	</th:block>
	<input type="image" property="methodToCall.${methodToCall}.line${lineIndex}${anchorString}" 
		src="${ConfigProperties.externalizable.images.url}tinybutton-apply.gif" 
		title="Percent Adjustment For Line ${lineIndex}" alt="Percent Adjustment For Line ${lineIndex}" styleClass="tinybutton" />
</div>
</div>
