<!-- Thymeleaf fragment converted from tag: module/ld/laborLedgerPendingEntries.tag -->
<div th:fragment="content ()" xmlns:th="http://www.thymeleaf.org">
<section class="kfs-tab" data-tab-title="Labor Ledger Pending Entries" data-default-open="false">
  <h3>Labor Ledger Pending Entries</h3>
<div class="tab-container" align=center>
		<h3>Labor Ledger Pending Entries <span class="kfs-lookup" data-bo-class="org.kuali.kfs.module.ld.businessobject.LaborLedgerPendingEntry" th:replace="~{fragments/kul/lookup :: content}"></span></h3>
	 <table cellpadding="0" cellspacing="0" class="datatable" summary="view/edit pending entries">

	<th:block th:if="${empty KualiForm.document.laborLedgerPendingEntries}">
		<tr>
			<td class="datacell" height="50"colspan="12"><div align="center">There are currently no Labor Ledger Pending Entries associated with this Transaction Processing document.</div></td>
		</tr>
	</th:block>
	<th:block th:if="${!empty KualiForm.document.laborLedgerPendingEntries}">
        <!--/*/ <th:block th:with="entryAttributes=${DataDictionary.LaborLedgerPendingEntry.attributes}"> /*/-->
		<tr>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${entryAttributes.transactionLedgerEntrySequenceNumber}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${entryAttributes.universityFiscalYear}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${entryAttributes.chartOfAccountsCode}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${entryAttributes.accountNumber}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${entryAttributes.subAccountNumber}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${entryAttributes.financialObjectCode}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${entryAttributes.financialSubObjectCode}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${entryAttributes.projectCode}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${entryAttributes.universityFiscalPeriodCode}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${entryAttributes.financialBalanceTypeCode}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${entryAttributes.financialObjectTypeCode}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${entryAttributes.transactionLedgerEntryAmount}"></th>
            <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${entryAttributes.transactionDebitCreditCode}"></th>
		</tr>
		<tr th:each="laborLedgerPendingEntry : ${KualiForm.document.laborLedgerPendingEntries}" indexId="ctr">
			<tr>
				<th class="datacell center"><html:hidden property="document.laborLedgerPendingEntry[${ctr}].transactionLedgerEntrySequenceNumber" write="true"/></th>
				<td class="datacell center">
					<span class="kfs-inquiry" data-bo-class="org.kuali.kfs.sys.businessobject.SystemOptions" data-key-values="universityFiscalYear=${laborLedgerPendingEntry.universityFiscalYear}">
						<html:hidden property="document.laborLedgerPendingEntry[${ctr}].universityFiscalYear" write="true"/>
					</span>
				</td>
				<td class="datacell center">
					<span class="kfs-inquiry" data-bo-class="org.kuali.kfs.coa.businessobject.Chart" data-key-values="chartOfAccountsCode=${laborLedgerPendingEntry.chartOfAccountsCode}">
						<html:hidden property="document.laborLedgerPendingEntry[${ctr}].chartOfAccountsCode" write="true"/>
					</span>
				</td>
				<td class="datacell center">
					<span class="kfs-inquiry" data-bo-class="org.kuali.kfs.coa.businessobject.Account" data-key-values="chartOfAccountsCode=${laborLedgerPendingEntry.chartOfAccountsCode}&accountNumber=${laborLedgerPendingEntry.accountNumber}">
						<html:hidden property="document.laborLedgerPendingEntry[${ctr}].accountNumber" write="true"/>
					</span>
				</td>
				<td class="datacell center">
					<span class="kfs-inquiry" data-bo-class="org.kuali.kfs.coa.businessobject.SubAccount" data-key-values="chartOfAccountsCode=${laborLedgerPendingEntry.chartOfAccountsCode}&accountNumber=${laborLedgerPendingEntry.accountNumber}&subAccountNumber=${laborLedgerPendingEntry.subAccountNumber}">
						<html:hidden property="document.laborLedgerPendingEntry[${ctr}].subAccountNumber" write="true"/>
					</span>
				</td>
				<td class="datacell center">
					<span class="kfs-inquiry" data-bo-class="org.kuali.kfs.coa.businessobject.ObjectCode" data-key-values="financialObjectCode=${laborLedgerPendingEntry.financialObjectCode}&chartOfAccountsCode=${laborLedgerPendingEntry.chartOfAccountsCode}&universityFiscalYear=${laborLedgerPendingEntry.universityFiscalYear}">
						<html:hidden property="document.laborLedgerPendingEntry[${ctr}].financialObjectCode" write="true"/>
					</span>
				</td>
				<td class="datacell center">
					<span class="kfs-inquiry" data-bo-class="org.kuali.kfs.coa.businessobject.SubObjCd" data-key-values="financialSubObjectCode=${laborLedgerPendingEntry.financialSubObjectCode}&financialObjectCode=${laborLedgerPendingEntry.financialObjectCode}&chartOfAccountsCode=${laborLedgerPendingEntry.chartOfAccountsCode}&universityFiscalYear=${laborLedgerPendingEntry.universityFiscalYear}">
						<html:hidden property="document.laborLedgerPendingEntry[${ctr}].financialSubObjectCode" write="true"/>
					</span>
				</td>
				<td class="datacell center">
					<span class="kfs-inquiry" data-bo-class="org.kuali.kfs.coa.businessobject.ProjectCode" data-key-values="code=${laborLedgerPendingEntry.projectCode}">
						<html:hidden property="document.laborLedgerPendingEntry[${ctr}].projectCode" write="true"/>
					</span>
				</td>
				<td class="datacell center">
					<span class="kfs-inquiry" data-bo-class="org.kuali.kfs.coa.businessobject.AccountingPeriod" data-key-values="universityFiscalYear=${laborLedgerPendingEntry.universityFiscalYear}&universityFiscalPeriodCode=${laborLedgerPendingEntry.universityFiscalPeriodCode}">
						<html:hidden property="document.laborLedgerPendingEntry[${ctr}].universityFiscalPeriodCode" write="true"/>
					</span>
				</td>
				<td class="datacell center">
					<span class="kfs-inquiry" data-bo-class="org.kuali.kfs.coa.businessobject.BalanceType" data-key-values="code=${laborLedgerPendingEntry.financialBalanceTypeCode}">
						<html:hidden property="document.laborLedgerPendingEntry[${ctr}].financialBalanceTypeCode" write="true"/>
					</span>
				</td>
				<td class="datacell center">
					<span class="kfs-inquiry" data-bo-class="org.kuali.kfs.coa.businessobject.ObjectType" data-key-values="code=${laborLedgerPendingEntry.financialObjectTypeCode}">
						<html:hidden property="document.laborLedgerPendingEntry[${ctr}].financialObjectTypeCode" write="true"/>
					</span>
				</td>
				<td class="datacell center"><html:hidden property="document.laborLedgerPendingEntry[${ctr}].transactionLedgerEntryAmount" write="true"/></td>
				<td class="datacell center"><html:hidden property="document.laborLedgerPendingEntry[${ctr}].transactionDebitCreditCode" write="true"/>&nbsp;</td>
			</tr>
		</tr>
	</th:block>
	</table>
</div>
</section>
</div>
