<section class="kfs-tab" data-tab-title="View Related Documents" data-default-open="false">
  <h3>View Related Documents</h3>
    <div class="tab-container" align=center>

        <h3>Related Documents</h3>
		<br/>

		<div th:replace="~{fragments/purap/relatedDocumentsDetail :: content}" data-document-attributes="${documentAttributes}" data-view-list="document.relatedViews.relatedRequisitionViews"></div> 
		
		<div th:replace="~{fragments/purap/relatedPurchaseOrderDocumentsDetail :: content}" data-document-attributes="${documentAttributes}" data-group-list="document.relatedViews.groupedRelatedPurchaseOrderViews" data-limit-by-po-id="${limitByPoId}"></div>

		<div th:replace="~{fragments/purap/relatedReceivingDocumentsDetail :: content}" data-document-attributes="${documentAttributes}" data-group-list="document.relatedViews.groupedRelatedReceivingViews" data-limit-by-po-id="${limitByPoId}"></div> 
			 
		<div th:replace="~{fragments/purap/relatedDocumentsDetail :: content}" data-document-attributes="${documentAttributes}" data-view-list="document.relatedViews.relatedPaymentRequestViews" data-limit-by-po-id="${limitByPoId}"></div> 

		<div th:replace="~{fragments/purap/relatedDocumentsDetail :: content}" data-document-attributes="${documentAttributes}" data-view-list="document.relatedViews.relatedCreditMemoViews" data-limit-by-po-id="${limitByPoId}"></div>
