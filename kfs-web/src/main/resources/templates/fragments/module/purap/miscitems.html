<!-- Thymeleaf fragment converted from tag: module/purap/miscitems.tag -->
<!-- Fragment parameters: overrideTitle, documentAttributes, itemAttributes, accountingLineAttributes, showAmount, showInvoiced, specialItemTotalType, specialItemTotalOverride, descriptionFirst, mainColumnCount, colSpanItemType, colSpanExtendedPrice, colSpanDescription, colSpanAmountPaid -->
<div th:fragment="content (overrideTitle, documentAttributes, itemAttributes, accountingLineAttributes, showAmount, showInvoiced, specialItemTotalType, specialItemTotalOverride, descriptionFirst, mainColumnCount, colSpanItemType, colSpanExtendedPrice, colSpanDescription, colSpanAmountPaid)" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="fullEntryMode=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT] && (empty KualiForm.editingMode['restrictFiscalEntry'])}"> /*/-->
<!--/*/ <th:block th:with="lockTaxAmountEntry=${(not empty KualiForm.editingMode['lockTaxAmountEntry']) || !fullEntryMode}"> /*/-->
<!--/*/ <th:block th:with="tabindexOverrideBase=50"> /*/-->
<!--/*/ <th:block th:with="isATypeOfPODoc=${KualiForm.document.isATypeOfPODoc}"> /*/-->

<th:block th:if="${empty overrideTitle}">
	<!--/*/ <th:block th:with="overrideTitle=Additional Charges"> /*/-->
</th:block>

<!--/*/ <th:block th:with="amendmentEntry=${(!empty KualiForm.editingMode['amendmentEntry'])}"> /*/-->

<!--/*/ <th:block th:with="documentType=${KualiForm.document.documentHeader.workflowDocument.documentTypeName}"> /*/-->
<!--/*/ <th:block th:with="isATypeOfPODoc=${KualiForm.document.isATypeOfPODoc}"> /*/-->
  
<!--/*/ <th:block th:with="currentTabIndex=${KualiForm.currentTabIndex}"> /*/-->
<!--/*/ <th:block th:with="topLevelTabIndex=${KualiForm.currentTabIndex}"> /*/-->
<!--/*/ <th:block th:with="tabKey=${kfunc:generateTabKey(overrideTitle)}"> /*/-->
<!--  hit form method to increment tab index -->
<!--/*/ <th:block th:with="dummyIncrementer=${kfunc:incrementTabIndex(KualiForm, tabKey)}"> /*/-->
<!--/*/ <th:block th:with="currentTab=${kfunc:getTabState(KualiForm, tabKey)}"> /*/-->
<!--/*/ <th:block th:with="purapTaxEnabled=${(not empty KualiForm.editingMode['purapTaxEnabled'])}"> /*/-->

<%-- default to open --%>
<th:block th:switch="${true}">
	<th:block th:case="${empty currentTab}">
		<!--/*/ <th:block th:with="isOpen=true"> /*/-->
	</th:block>
	<th:block th:case="${!empty currentTab}">
		<!--/*/ <th:block th:with="isOpen=${currentTab == 'OPEN'}"> /*/-->
	</th:block>
</th:block>

<html:hidden property="tabStates(${tabKey})" value="${(isOpen ? 'OPEN' : 'CLOSE')}" />

<tr>
	<td colspan="${mainColumnCount}" class="subhead">
		<span class="subhead-left"><span th:text="${overrideTitle}"></span> &nbsp;</span>
		<th:block th:if="${isOpen == 'true' || isOpen == 'TRUE'}">
			<input type="image" property="methodToCall.toggleTab.tab${tabKey}" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-hide.gif" alt="hide" title="toggle" styleClass="tinybutton" styleId="tab-${tabKey}-imageToggle"
				onclick="javascript: return true; " />
		</th:block>
		<th:block th:if="${isOpen != 'true' && isOpen != 'TRUE'}">
			<input type="image" property="methodToCall.toggleTab.tab${tabKey}" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-show.gif" alt="show" title="toggle" styleClass="tinybutton" styleId="tab-${tabKey}-imageToggle"
				onclick="javascript: return true; " />
		</th:block>
	</td>
</tr>

<th:block th:if="${isOpen != 'true' && isOpen != 'TRUE'}">
	<tbody style="display: none;" id="tab-${tabKey}-div">
</th:block>

<tr>
	<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.itemTypeCode}"></th>
	
	<th:block th:if="${showInvoiced}">
		<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.originalAmountfromPO}"></th>
		<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.poOutstandingAmount}"></th>
	</th:block>					
	
	<th:block th:switch="${true}">
		<th:block th:case="${descriptionFirst}">
			<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.itemDescription}"></th>
			<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.extendedPrice}"></th>
			<!--/*/ <th:block th:with="colSpanBlank=${mainColumnCount - (colSpanItemType + colSpanDescription + colSpanExtendedPrice + colSpanAmountPaid)}"> /*/-->
			<th:block th:if="${purapTaxEnabled}">
			    <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.itemTaxAmount}"></th>				
			    <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.totalAmount}"></th>
			    <!--/*/ <th:block th:with="colSpanBlank=${colSpanBlank - 2}"> /*/-->
			</th:block>					
			<th:block th:if="${colSpanBlank > 0}">
				<th colspan="${colSpanBlank}">&nbsp;</th>
			</th:block>
			<th:block th:if="${isATypeOfPODoc}">
                <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry=""></th>
            </th:block>			
		</th:block>
	    <th:block th:case="*">
			<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.extendedPrice}"></th>
			<th:block th:if="${purapTaxEnabled}">
			    <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.itemTaxAmount}"></th>				
			    <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.totalAmount}"></th>
			</th:block>				
			<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.itemDescription}"></th>
		</th:block>
	</th:block>	
</tr>

<logic:iterate indexId="ctr" name="KualiForm" property="document.items" id="itemLine">
	<%-- to ensure order this should pull out items from APC instead of this--%>
	<th:block th:if="${itemLine.itemType.additionalChargeIndicator && !itemLine.itemType.isTaxCharge}">
		<th:block th:if="${not empty specialItemTotalType and itemLine.itemTypeCode == specialItemTotalType }">
			  <th:block th:if="${!empty specialItemTotalOverride}">
      			<jsp:invoke fragment="specialItemTotalOverride"/>
  			  </th:block>
		</th:block>
		<tr>
			<td colspan="${mainColumnCount}" class="tab-subhead" style="border-right: none;">
			<input type="text" name="document.item[${ctr}].itemType.itemTypeDescription" th:field="*{document.item[${ctr}].itemType.itemTypeDescription}" data-attribute-entry="${itemAttributes.itemTypeCode}" /> <!-- TODO need the show/hide? --></td>
		</tr>
		
		<tr>
			<td class="infoline" colspan="${colSpanItemType}">
			    <div align="right">
			        <input type="text" name="document.item[${ctr}].itemType.itemTypeDescription" th:field="*{document.item[${ctr}].itemType.itemTypeDescription}" data-attribute-entry="${itemAttributes.itemTypeCode}" />:&nbsp;
			    </div>
			</td>
			
			<th:block th:if="${showInvoiced}">
				<td class="infoline">
			    	<input type="text" name="document.item[${ctr}].purchaseOrderItemUnitPrice" th:field="*{document.item[${ctr}].purchaseOrderItemUnitPrice}" data-attribute-entry="${itemAttributes.purchaseOrderItemUnitPrice}" readonly="readonly" />
		    	</td>
		    	<td class="infoline">
			    	<input type="text" name="document.item[${ctr}].poOutstandingAmount" th:field="*{document.item[${ctr}].poOutstandingAmount}" data-attribute-entry="${itemAttributes.poOutstandingAmount}" readonly="readonly" />	
				</td>			
			</th:block> 					
			
			<th:block th:switch="${true}">
			<th:block th:case="${descriptionFirst}">
				<td class="infoline" colspan="${colSpanDescription}">
					<input type="text" name="document.item[${ctr}].itemDescription" th:field="*{document.item[${ctr}].itemDescription}" data-attribute-entry="${itemAttributes.itemDescription}" />
				</td>
				<td class="infoline" colspan="${colSpanExtendedPrice}">
					<div align="right">
						<input type="text" name="document.item[${ctr}].itemUnitPrice" th:field="*{document.item[${ctr}].itemUnitPrice}" data-attribute-entry="${itemAttributes.itemUnitPrice}" />
					</div>
				</td>
					
				<th:block th:if="${purapTaxEnabled and itemLine.itemType.taxableIndicator}">
					<td class="infoline">
	 				    <div align="right">	 				        
	 				        <input type="text" name="document.item[${ctr}].itemTaxAmount" th:field="*{document.item[${ctr}].itemTaxAmount}" data-attribute-entry="${itemAttributes.itemTaxAmount}" />	 				        
						</div>
					</td>				
					<td class="infoline">
	 				    <div align="right">
	 				        <input type="text" name="document.item[${ctr}].totalAmount" th:field="*{document.item[${ctr}].totalAmount}" data-attribute-entry="${itemAttributes.totalAmount}" readonly="readonly" />		 				        
						</div>
					</td>
				</th:block>
					
				<th:block th:if="${colSpanBlank > 0}">					
					<td class="infoline" colspan="${colSpanBlank}">
						&nbsp;
					</td>					
				</th:block>		
				
				<th:block th:if="${isATypeOfPODoc}">
			    	<td class="infoline">
			        	<div align="right">
					    	<input type="text" name="document.item[${ctr}].itemInvoicedTotalAmount" th:field="*{document.item[${ctr}].itemInvoicedTotalAmount}" data-attribute-entry="${itemAttributes.itemInvoicedTotalAmount}" />
			                </div>
		            </td>
	            </th:block>								
			</th:block>
				
    		<th:block th:case="*">
				<td class="infoline" colspan="${colSpanExtendedPrice}">
					<div align="right">
						<input type="text" name="document.item[${ctr}].itemUnitPrice" th:field="*{document.item[${ctr}].itemUnitPrice}" data-attribute-entry="${itemAttributes.itemUnitPrice}" />
					</div>
				</td>

				<th:block th:if="${purapTaxEnabled}">
					<th:block th:switch="${true}">
					<th:block th:case="${itemLine.itemType.taxableIndicator}">
						<td class="infoline">
	 				    	<div align="right">	 				        
	 				        	<input type="text" name="document.item[${ctr}].itemTaxAmount" th:field="*{document.item[${ctr}].itemTaxAmount}" data-attribute-entry="${itemAttributes.itemTaxAmount}" />	 				        
							</div>
						</td>				
						<td class="infoline">
	 				    	<div align="right">
	 				        	<input type="text" name="document.item[${ctr}].totalAmount" th:field="*{document.item[${ctr}].totalAmount}" data-attribute-entry="${itemAttributes.totalAmount}" readonly="readonly" />		 				        
							</div>
						</td>
					</th:block>
					<th:block th:case="*">
   						<td class="infoline">
	 						&nbsp;	 				        
						</td>				
						<td class="infoline">
	 						&nbsp;
						</td>
					</th:block>
					</th:block>
				</th:block>   					
					
				<td class="infoline" colspan="${colSpanDescription}">
					<input type="text" name="document.item[${ctr}].itemDescription" th:field="*{document.item[${ctr}].itemDescription}" data-attribute-entry="${itemAttributes.itemDescription}" />
				</td>
			</th:block>
			</th:block>
		</tr>

		<th:block th:if="${amendmentEntry}">
			<div th:replace="~{fragments/purap/purapGeneralAccounting :: content}" data-account-prefix="document.item[${ctr}]." data-item-col-span="${mainColumnCount}"></div>
		</th:block>
				
		<th:block th:if="${!empty KualiForm.editingMode['allowItemEntry'] && !empty itemLine.itemUnitPrice || empty KualiForm.editingMode['allowItemEntry']}">
		    <th:block th:if="${!amendmentEntry && KualiForm.document.applicationDocumentStatus!='Awaiting Fiscal Officer Approval' || KualiForm.document.applicationDocumentStatus =='Awaiting Fiscal Officer Approval' && !empty KualiForm.document.items[ctr].itemUnitPrice}">
			    <div th:replace="~{fragments/purap/purapGeneralAccounting :: content}" data-account-prefix="document.item[${ctr}]." data-item-col-span="${mainColumnCount}"></div>
		    </th:block>
		</th:block>
	</th:block>
</tr>

<th:block th:if="${isOpen != 'true' && isOpen != 'TRUE'}">
	</tbody>
</th:block>
</div>
