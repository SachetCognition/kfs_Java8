								</th:block>
							</th:block>

                </div>
			</td>
			<td valign="middle" class="datacell" colspan="${colSpanTotalBlank}">
				&nbsp;
			</td>
		</tr>

			        <b><label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${documentAttributes.grandTaxAmount}"></label></b>&nbsp;
			    </div>
			</td>
			<td valign=middle class="datacell" colspan="${colSpanTotalAmount}">
			    <div align="right"><b>
                    <input type="text" name="document.grandTaxAmount" th:field="*{document.grandTaxAmount}" data-attribute-entry="${documentAttributes.grandTaxAmount}" readonly="readonly" />&nbsp; </b>
                </div>
			</td>
			<td valign="middle" class="datacell" colspan="${colSpanTotalBlank}">
				&nbsp;
			</td>
		</tr>
		</th:block>

		<tr>
			<td align=right width='75%' scope="row" class="datacell" colspan="${colSpanTotalLabel}">

	              	<input type="text" name="document.closePurchaseOrderIndicator" th:field="*{document.closePurchaseOrderIndicator}" data-attribute-entry="${documentAttributes.closePurchaseOrderIndicator}" />

	              </th:block>

	              </th:block>
