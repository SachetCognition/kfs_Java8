<!-- Thymeleaf fragment converted from tag: module/purap/assignSensitiveData.tag -->
<!-- Fragment parameters: documentAttributes, itemAttributes, poSensitiveDataAttributes, sensitiveDataAssignAttributes -->
<div th:fragment="content (documentAttributes, itemAttributes, poSensitiveDataAttributes, sensitiveDataAssignAttributes)" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="lastSensitiveDataAssignment=${KualiForm.lastSensitiveDataAssignment}"> /*/-->
              
<section class="kfs-tab" data-tab-title="Assign Sensitive Data to Purchase Order" data-default-open="true">
  <h3>Assign Sensitive Data to Purchase Order</h3>
	
    <div class="tab-container" align=center>
    	<h3>General Information</h3>

        <table cellpadding="0" cellspacing="0" class="datatable" summary="Sensitive Data Assignment General Information">
        	<tr>
        		<th align=right valign=middle class="bord-l-b" width="25%">
            		<div align="right">Reason for Assignment:</div>
            	</th>
            	<td align=left valign=middle class="datacell" width="25%">
                	<input type="text" name="sensitiveDataAssignmentReason" th:field="*{sensitiveDataAssignmentReason}" data-attribute-entry="${sensitiveDataAssignAttributes.sensitiveDataAssignmentReasonText}" />
            	</td>
        		<th align=right valign=middle class="bord-l-b" width="25%">
            		<div align="right">Last Updated by Person:</div>
            	</th>
            	<td align=left valign=middle class="datacell" width="25%">&nbsp;
	            	<th:block th:if="${lastSensitiveDataAssignment != null}">
                	<input type="text" name="lastSensitiveDataAssignment.sensitiveDataAssignmentPersonIdentifier" th:field="*{lastSensitiveDataAssignment.sensitiveDataAssignmentPersonIdentifier}" data-attribute-entry="${sensitiveDataAssignAttributes.sensitiveDataAssignmentPersonIdentifier}" readonly="readonly" />
            		</th:block>
            	</td>
            </tr>
            <tr>
        		<th align=right valign=middle class="bord-l-b" width="25%">
            		<div align="right">Reason for Last Update:</div>
            	</th>
            	<td align=left valign=middle class="datacell" width="25%">&nbsp;
	            	<th:block th:if="${lastSensitiveDataAssignment != null}">
                	<input type="text" name="lastSensitiveDataAssignment.sensitiveDataAssignmentReasonText" th:field="*{lastSensitiveDataAssignment.sensitiveDataAssignmentReasonText}" data-attribute-entry="${sensitiveDataAssignAttributes.sensitiveDataAssignmentReasonText}" readonly="readonly" />
            		</th:block>
            	</td>
        		<th align=right valign=middle class="bord-l-b" width="25%">
            		<div align="right">Last Updated on Date:</div>
            	</th>
            	<td align=left valign=middle class="datacell" width="25%">&nbsp;
	            	<th:block th:if="${lastSensitiveDataAssignment != null}">
                	<input type="text" name="lastSensitiveDataAssignment.sensitiveDataAssignmentChangeDate" th:field="*{lastSensitiveDataAssignment.sensitiveDataAssignmentChangeDate}" data-attribute-entry="${sensitiveDataAssignAttributes.sensitiveDataAssignmentChangeDate}" readonly="readonly" />
            		</th:block>
            	</td>
            <tr>
            
        </table>
    
    	<h3>Vendor Information</h3>

        <table cellpadding="0" cellspacing="0" class="datatable" summary="Purchase Order Vendor Information">
        	<tr>
        		<th align=right valign=middle class="bord-l-b" width="50%">
            		<div align="right"><label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${documentAttributes.vendorName}"></label></div>
            	</th>
            	<td align=left valign=middle class="datacell" width="50%">
                	<input type="text" name="document.vendorName" th:field="*{document.vendorName}" data-attribute-entry="${documentAttributes.vendorName}" readonly="readonly" />
            	</td>
            </tr>
        </table>

        <h3>Items Information</h3>
        
        <table cellpadding="0" cellspacing="0" class="datatable" summary="Purchase Order Items Information">             
            <tr>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.itemLineNumber}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.itemTypeCode}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.itemQuantity}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.itemUnitOfMeasureCode}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.itemCatalogNumber}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.purchasingCommodityCode}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.itemDescription}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.itemUnitPrice}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.extendedPrice}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.itemAssignedToTradeInIndicator}"></th>
            </tr>
            <logic:iterate indexId="ctr" name="KualiForm" property="document.items" id="itemLine">
	        	<th:block th:if="${itemLine.itemType.lineItemIndicator == true}">
                	<tr>		
                    	<td class="datacell"><div align="center"><b>&nbsp;<span th:text="${KualiForm.document.item[${ctr}].itemLineNumber}"></span>&nbsp;</b></div></td>
                        <td class="datacell"><div align="center"><input type="text" name="document.item[${ctr}].itemTypeCode" th:field="*{document.item[${ctr}].itemTypeCode}" data-attribute-entry="${itemAttributes.itemTypeCode}" readonly="readonly" /></div></td>
                        <td class="datacell"><div align="center"><input type="text" name="document.item[${ctr}].itemQuantity" th:field="*{document.item[${ctr}].itemQuantity}" data-attribute-entry="${itemAttributes.itemQuantity}" readonly="readonly" /></div></td>			
 				        <td class="datacell"><div align="center"><input type="text" name="document.item[${ctr}].itemUnitOfMeasureCode" th:field="*{document.item[${ctr}].itemUnitOfMeasureCode}" data-attribute-entry="${itemAttributes.itemUnitOfMeasureCode}" readonly="readonly" /></div></td>
 				        <td class="datacell"><div align="center"><input type="text" name="document.item[${ctr}].itemCatalogNumber" th:field="*{document.item[${ctr}].itemCatalogNumber}" data-attribute-entry="${itemAttributes.itemCatalogNumber}" readonly="readonly" /></div></td>
 				        <td class="datacell"><div align="center"><input type="text" name="document.item[${ctr}].purchasingCommodityCode" th:field="*{document.item[${ctr}].purchasingCommodityCode}" data-attribute-entry="${itemAttributes.purchasingCommodityCode}" readonly="readonly" /></div></td>
 				        <td class="datacell"><div align="left"><input type="text" name="document.item[${ctr}].itemDescription" th:field="*{document.item[${ctr}].itemDescription}" data-attribute-entry="${itemAttributes.itemDescription}" readonly="readonly" /></div></td>
 				        <td class="datacell"><div align="right"><input type="text" name="document.item[${ctr}].itemUnitPrice" th:field="*{document.item[${ctr}].itemUnitPrice}" data-attribute-entry="${itemAttributes.itemUnitPrice}" readonly="readonly" /></div></td>
 				        <td class="datacell"><div align="right"><input type="text" name="document.item[${ctr}].extendedPrice" th:field="*{document.item[${ctr}].extendedPrice}" data-attribute-entry="${itemAttributes.extendedPrice}" readonly="readonly" /></div></td>
  				        <td class="datacell"><div align="center"><input type="text" name="document.item[${ctr}].itemAssignedToTradeInIndicator" th:field="*{document.item[${ctr}].itemAssignedToTradeInIndicator}" data-attribute-entry="${itemAttributes.itemAssignedToTradeInIndicator}" readonly="readonly" /></div></td>
                    </tr>
                </th:block>
            </tr>
        </table>
        
        <h3>New Sensitive Data Entry To Be Assigned</h3>
        
        <table cellpadding="0" cellspacing="0" class="datatable" summary="Assign New Sensitive Data Entry">             
            <tr>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${poSensitiveDataAttributes.sensitiveDataCode}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry=""></th>
        	</tr>
        	<tr>
        		<td class="datacell"><div align="center">
        			<input type="text" name="newSensitiveDataLine.sensitiveDataCode" th:field="*{newSensitiveDataLine.sensitiveDataCode}" data-attribute-entry="${poSensitiveDataAttributes.sensitiveDataCode}" />
        		</div></td>
        		<td class="datacell"><div align="center">
        			<input type="image" property="methodToCall.addSensitiveData" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-add1.gif" 
        				alt="Add New Sensitive Data Entry" title="Add New Sensitive Data Entry" styleClass="tinybutton" />
        		</div></td>
        	</tr>
        </table>
        
        <h3>Current Sensitive Data Entries Assigned</h3>
        
        <table cellpadding="0" cellspacing="0" class="datatable" summary="Delete/Update Current Sensitive Data Entries">             
            <tr>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${poSensitiveDataAttributes.sensitiveDataCode}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry=""></th>
        	</tr>
            <logic:iterate indexId="ctr" name="KualiForm" property="sensitiveDatasAssigned" id="sd">
        	<tr>        	
        		<td class="datacell"><div align="center">
        			<input type="text" name="sensitiveDatasAssigned[${ctr}].sensitiveDataCode" th:field="*{sensitiveDatasAssigned[${ctr}].sensitiveDataCode}" data-attribute-entry="${poSensitiveDataAttributes.sensitiveDataCode}" />
        		</div></td>
        		<td class="datacell"><div align="center">
        			<input type="image" property="methodToCall.deleteSensitiveData.line${ctr}" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-delete1.gif"
						alt="Delete Sensitive Data Entry ${ctr+1}" title="Delete Sensitive Data Entry ${ctr+1}" styleClass="tinybutton" />
        		</div></td>
        	</tr>
        	</tr>
        </table>

    </div>    
</section>
</div>
