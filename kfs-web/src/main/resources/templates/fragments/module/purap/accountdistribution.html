<!-- Thymeleaf fragment converted from tag: module/purap/accountdistribution.tag -->
<!-- Fragment parameters: accountingLineAttributes, itemAttributes, displayCommodityCodeFields -->
<div th:fragment="content (accountingLineAttributes, itemAttributes, displayCommodityCodeFields)" xmlns:th="http://www.thymeleaf.org">
<script language="JavaScript" type="text/javascript" src="scripts/vnd/objectInfo.js"></script>

<!--/*/ <th:block th:with="fullEntryMode=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}"> /*/-->
<!--/*/ <th:block th:with="amendmentEntry=${(not empty KualiForm.editingMode['amendmentEntry'])}"> /*/-->
<!--/*/ <th:block th:with="clearAllTaxes=${(not empty KualiForm.editingMode['clearAllTaxes'])}"> /*/-->
<!--/*/ <th:block th:with="tabindexOverrideBase=50"> /*/-->

<br />
<th:block th:if="${(fullEntryMode or amendmentEntry)}">
	<div align="center">
	<th:block th:if="${KualiForm.hideDistributeAccounts and !KualiForm.editingMode['disableSetupAccountDistribution']}">
		<input type="image" property="methodToCall.setupAccountDistribution"
		src="${ConfigProperties.externalizable.images.url}tinybutton-setdist.gif"
		alt="setup distribution" title="setup distribution"
		styleClass="tinybutton" />
	</th:block>
	<th:block th:if="${!KualiForm.hideDistributeAccounts and !KualiForm.editingMode['disableSetupAccountDistribution']}">
		<img src="${ConfigProperties.externalizable.images.url}tinybutton-setdist1.gif"
		alt="setup account distribution" border="0"
		styleClass="tinybutton" />
	</th:block>
	<th:block th:if="${!KualiForm.editingMode['disableRemoveAccounts']}">
	<input type="image" property="methodToCall.removeAccounts"
	src="${ConfigProperties.externalizable.images.url}tinybutton-remaccitems.gif"
	alt="remove accounts from all items"
	title="remove accounts from all items" styleClass="tinybutton" />
	</th:block>
	
	<th:block th:if="${displayCommodityCodeFields}">	
        <input type="image" property="methodToCall.clearItemsCommodityCodes"
        src="${ConfigProperties.externalizable.images.url}tinybutton-remcomcod.gif"
        alt="remove commodity codes from all items"
        title="remove commodity codes from all items" styleClass="tinybutton" />
    </th:block>
    
	<input type="image" property="methodToCall.showAllAccounts" 
	src="${ConfigProperties.externalizable.images.url}tinybutton-expandallacc.gif" 
	alt="expand all accounts" 
	title="expand all accounts" 
	styleClass="tinybutton"  />

	<input type="image" property="methodToCall.hideAllAccounts" 
	src="${ConfigProperties.externalizable.images.url}tinybutton-collallacc.gif" 
	alt="collapse all accounts" 
	title="collapse all accounts" 
	styleClass="tinybutton"  />
</th:block>

<th:block th:if="${(fullEntryMode or amendmentEntry) and (clearAllTaxes)}">
	<input type="image" property="methodToCall.clearAllTaxes" 
	    src="${ConfigProperties.externalizable.images.url}tinybutton-clearalltax.gif" 
	    alt="Clear all tax" 
	    title="Clear all tax" styleClass="tinybutton" />
    </div>
</th:block>
	
<th:block th:if="${!KualiForm.hideDistributeAccounts}">

    <th:block th:switch="${true}">
        <th:block th:case="${(not empty KualiForm.editingMode['amendmentEntry'])}">
            <!--/*/ <th:block th:with="fullEntry=true"> /*/-->
            <c:set var="accountingLineEditingMode" value = "${KualiForm.accountingLineEditingMode}"/>
        </th:block>
        <th:block th:case="*">
            <c:set var="accountingLineEditingMode" value = "${KualiForm.editingMode}"/>
        </th:block>
    </th:block>
    
    <table width="100%" border="0" cellpadding="0" cellspacing="0"
        class="datatable">
        <th:block th:if="${displayCommodityCodeFields}">	
	    <tr>
	        <td colspan="2" class="subhead">
	            <span class="subhead-left">Commodity Code</span>
	        </td>
	    </tr>
	    <tr>
	        <th align=right valign=middle class="bord-l-b">
	            <div align="right"><label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${itemAttributes.purchasingCommodityCode}"></label></div>
	        </th>
	        <td align=left valign=middle class="datacell">
                <!--/*/ <th:block th:with="commodityCodeField=distributePurchasingCommodityCode"> /*/-->
                <!--/*/ <th:block th:with="commodityDescriptionField=distributePurchasingCommodityDescription"> /*/-->
	            <input type="text" name="distributePurchasingCommodityCode" th:field="*{distributePurchasingCommodityCode}" data-attribute-entry="${itemAttributes.purchasingCommodityCode}" />
                <th:block th:if="${fullEntryMode}">   
                	<span class="kfs-lookup" data-bo-class="org.kuali.kfs.vnd.businessobject.CommodityCode" th:replace="~{fragments/kul/lookup :: content}"></span>    
                </th:block>
                <div id="distributePurchasingCommodityDescription.div" class="fineprint">
                    <html:hidden write="true" property="${commodityDescriptionField}"/>&nbsp;        
                </div>    
	        </td>
	    </tr>
	    </th:block>
        <tr>
            <th colspan="2">&nbsp;</td>
        </tr>
    </table>


    <div class="kfs-sys-java-accountingLines" th:include="~{fragments/sys/java/accountingLines :: content}">
        <div th:replace="~{fragments/sys/java/accountingLineGroup :: content}" data-new-line-property-name="accountDistributionnewSourceLine" data-collection-property-name="accountDistributionsourceAccountingLines" data-collection-item-property-name="accountDistributionsourceAccountingLine" data-attribute-group-name="distributeSource"></div>
    </div><!-- /kfs-sys-java-accountingLines -->
		        
	<div align="center">
		<input type="image" property="methodToCall.doDistribution"
		src="${ConfigProperties.externalizable.images.url}tinybutton-disttoitems.gif"
		alt="do account distribution"
		title="do account distribution" styleClass="tinybutton" />
		<input type="image" property="methodToCall.cancelAccountDistribution"
		src="${ConfigProperties.kr.externalizable.images.url}tinybutton-cancel.gif"
		alt="cancel account distribution"
		title="cancel account distribution" styleClass="tinybutton" />
	</div>
</th:block>
<br />
</div>
