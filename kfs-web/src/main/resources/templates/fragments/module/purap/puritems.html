						</th:block>

					    <div align="right">

					</td>
					<td class="infoline">
					    <div align="right">
					        <input type="text" name="document.item[${ctr}].extendedPrice" th:field="*{document.item[${ctr}].extendedPrice}" data-attribute-entry="${itemAttributes.extendedPrice}" />
					    </div>
					</td>
					
					<th:block th:if="${purapTaxEnabled}">

					    	<div align="right">
					        <input type="text" name="document.item[${ctr}].itemTaxAmount" th:field="*{document.item[${ctr}].itemTaxAmount}" data-attribute-entry="${itemAttributes.itemTaxAmount}" />

						</td>

					    	</div>
						</td>
					</th:block>				
						
					<th:block th:if="${!lockB2BEntry}">
				    	<td class="infoline">
                            <div align="center">
						    <input type="text" name="document.item[${ctr}].itemAssignedToTradeInIndicator" th:field="*{document.item[${ctr}].itemAssignedToTradeInIndicator}" data-attribute-entry="${itemAttributes.itemAssignedToTradeInIndicator}" />
                            </div>
						</td>
					</th:block>
					
					<td class="infoline" rowspan="2" colspan="${colSpanAction}">
					    <div align="center">

					    						        	<input type="image" property="methodToCall.deleteItem.line${ctr}"
						        	src="${ConfigProperties.kr.externalizable.images.url}tinybutton-delete1.gif"
						        	alt="Delete Item ${ctr+1}" title="Delete Item ${ctr+1}"
						        	styleClass="tinybutton" /><br><br>
						    </th:block>
						    <th:block th:case="${amendmentEntry and itemLine.canInactivateItem and itemLine.itemInvoicedTotalAmount != null}">
						        <input type="image" property="methodToCall.inactivateItem.line${ctr}"
						        	src="${ConfigProperties.externalizable.images.url}tinybutton-inactivate.gif"
						        	alt="Inactivate Item ${ctr+1}" title="Inactivate Item ${ctr+1}"
						        	styleClass="tinybutton" /><br><br>
					    	</th:block>
						    <th:block th:case="${isATypeOfPODoc and !itemLine.itemActiveIndicator}">
					    		<div align="center">Inactive</div><br><br>						    
						    </th:block>							    
						    <th:block th:case="*">							    	
					    		<div align="center">&nbsp;</div>
						    </th:block>
						    </th:block>						    
						</div>
					</td>
					
					<th:block th:if="${isATypeOfPODoc}">
					    <td class="infoline" rowspan="2">
					        <div align="right">
					        <input type="text" name="document.item[${ctr}].itemInvoicedTotalAmount" th:field="*{document.item[${ctr}].itemInvoicedTotalAmount}" data-attribute-entry="${itemAttributes.itemInvoicedTotalAmount}" />
					        </div>
					    </td>
					    
					</th:block>

				</th:block>
								
				<th:block th:switch="${true}">
                <th:block th:case="${amendmentEntry}">                
                    <th:block th:switch="${true}">
	    			<th:block th:case="${itemLine.itemActiveIndicator and (!amendmentEntryWithUnpaidPreqOrCM or itemLine.itemInvoicedTotalAmount == null or itemLine.newItemForAmendment)}">
				    	<!--/*/ <th:block th:with="fullEntry=true"> /*/-->
						<div th:replace="~{fragments/purap/purapGeneralAccounting :: content}" data-account-prefix="document.item[${ctr}]." data-item-col-span="${accountColumnCount}"></div>
    				</th:block>
	        		<th:block th:case="*">
				    	<!--/*/ <th:block th:with="viewOnly=true"> /*/-->
						<div th:replace="~{fragments/purap/purapGeneralAccounting :: content}" data-account-prefix="document.item[${ctr}]." data-item-col-span="${accountColumnCount}"></div>
				    </th:block>
				    </th:block>
				</th:block>
				<th:block th:case="${unorderedItemAccountEntry and itemLine.newUnorderedItem}">
				    <!--/*/ <th:block th:with="fullEntry=true"> /*/-->
					<div th:replace="~{fragments/purap/purapGeneralAccounting :: content}" data-account-prefix="document.item[${ctr}]." data-item-col-span="${accountColumnCount}"></div>				
				</th:block>
				<th:block th:case="${(!amendmentEntry)}">
					<th:block th:if="${!empty KualiForm.editingMode['allowItemEntry'] && (KualiForm.editingMode['allowItemEntry'] == itemLine.itemIdentifier)}">
					    <!--/*/ <th:block th:with="expenseEntry=true"> /*/-->
					</th:block>					
					<div th:replace="~{fragments/purap/purapGeneralAccounting :: content}" data-account-prefix="document.item[${ctr}]." data-item-col-span="${accountColumnCount}"></div>
				</th:block>
				</th:block>
				
				<th:block th:if="${isOpen != 'true' && isOpen != 'TRUE'}">
					</tbody>
				</th:block>
			</th:block>

		</th:block>

		<tr>
			<th height=30 colspan="${mainColumnCount}">&nbsp;</th>

			<td colspan="${mainColumnCount}" class="subhead">

                <span class="subhead-right">&nbsp;</span>
            </td>
		</tr>

		<!--/*/ <th:block th:with="colSpanTotalAmount=${colSpanExtendedPrice}"> /*/-->

		<th:block th:if="${purapTaxEnabled}">

			    </div>
			</th>
			<td valign=middle class="datacell" colspan="${colSpanTotalAmount}">
			    <div align="right"><b>
                    <input type="text" name="document.totalPreTaxDollarAmount" th:field="*{document.totalPreTaxDollarAmount}" data-attribute-entry="${DataDictionary.RequisitionDocument.attributes.totalPreTaxDollarAmount}" readonly="readonly" />&nbsp; </b>
                </div>
			</td>
			<td class="datacell" colspan="${colSpanTotalBlank}">&nbsp;</td>
		</tr>

		<tr>
			<th align=right width='75%' colspan="${colSpanTotalLabel}" scope="row">
			    <div align="right">
			        <label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${DataDictionary.RequisitionDocument.attributes.totalTaxAmount}"></label>
			    </div>
			</th>
			<td valign=middle class="datacell" colspan="${colSpanTotalAmount}">
			    <div align="right"><b>
                    <input type="text" name="document.totalTaxAmount" th:field="*{document.totalTaxAmount}" data-attribute-entry="${DataDictionary.RequisitionDocument.attributes.totalTaxAmount}" readonly="readonly" />&nbsp; </b>
                </div>
			</td>
			<td class="datacell" colspan="${colSpanTotalBlank}">&nbsp;</td>
		</tr>
		</th:block>

			        <label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${DataDictionary.RequisitionDocument.attributes.totalDollarAmount}"></label>
			    </div>
			</th>
			<td valign=middle class="datacell"  colspan="${colSpanTotalAmount}">
			    <div align="right"><b>
                    <input type="text" name="document.totalDollarAmount" th:field="*{document.totalDollarAmount}" data-attribute-entry="${DataDictionary.RequisitionDocument.attributes.totalDollarAmount}" readonly="readonly" />&nbsp; </b>
                </div>
			</td>
			<td class="datacell" colspan="${colSpanTotalBlank}">&nbsp;</td>
		</tr>

		<tr>
			<th align=right width='75%' colspan="${colSpanTotalLabel}" scope="row">
			    <th:block th:if="${displayRequisitionFields}">
				    <div align="right">
				        <label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${DataDictionary.RequisitionDocument.attributes.organizationAutomaticPurchaseOrderLimit}"></label>
					</div>
			    </th:block> 
			    <th:block th:if="${!displayRequisitionFields}"> 
                    <div align="right">
                        <label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${DataDictionary.PurchaseOrderDocument.attributes.internalPurchasingLimit}"></label>
                    </div>
                </th:block>
            </th>
			<td align=right valign=middle class="datacell" colspan="${colSpanTotalAmount}">
			    <th:block th:if="${displayRequisitionFields}">
				    <div align="right">
				        <input type="text" name="document.organizationAutomaticPurchaseOrderLimit" th:field="*{document.organizationAutomaticPurchaseOrderLimit}" data-attribute-entry="${DataDictionary.RequisitionDocument.attributes.organizationAutomaticPurchaseOrderLimit}" readonly="readonly" />&nbsp;
					</div>
			    </th:block> 
			    <th:block th:if="${!displayRequisitionFields}">
                    <div align="right">
                        <input type="text" name="document.internalPurchasingLimit" th:field="*{document.internalPurchasingLimit}" data-attribute-entry="${DataDictionary.PurchaseOrderDocument.attributes.internalPurchasingLimit}" readonly="readonly" />&nbsp;
                    </div>
