<!-- Thymeleaf fragment converted from tag: module/tem/agencyLinks.tag -->
<div th:fragment="content ()" xmlns:th="http://www.thymeleaf.org">
<th:block th:if="${KualiForm.shouldDisplayAgencyLinks}">
	<section class="kfs-tab" data-tab-title="Agency Links" data-default-open="false">
  <h3>Agency Links</h3>
		<div class="tab-container" align="center">
			<h3><span th:text="#{${__MSG_KEY__}}"></span></h3>
			<table cellpadding="0" cellspacing="0" class="datatable" summary="Agency Links Section">
				<tr th:each="agencyLink : ${KualiForm.agencyLinks}">
					<tr>
						<td width="100%">
							<a href="<span th:text="${agencyLink.hrefText}"></span>" target="<span th:text="${agencyLink.target}"></span>"><span th:text="${agencyLink.linkLabel}"></span></a>
						</td>
					<tr>
				</tr>
			</table>
		</div>
	</section>
</th:block>
</div>
