<!-- Thymeleaf fragment converted from tag: module/tem/expenses/actualExpenseDetailLine.tag -->
<!-- Fragment parameters: detail, lineNumber, detailLineNumber, detailObject, parentObject -->
<div th:fragment="content (detail, lineNumber, detailLineNumber, detailObject, parentObject)" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="otherExpenseAttributes=${DataDictionary.ActualExpense.attributes}"> /*/-->
<jsp:useBean id="paramMap" class="java.util.HashMap" />
<!--/*/ <th:block th:with="tripType=${KualiForm.document.tripTypeCode}"> /*/-->
<!--/*/ <th:block th:with="travelerType=${KualiForm.document.traveler.travelerTypeCode}"> /*/-->
<!--/*/ <th:block th:with="documentType=${KualiForm.docTypeName}"> /*/-->
<!--/*/ <th:block th:with="calcColspan=6"> /*/-->

<tr>
	<th:block th:switch="${true}">
		<th:block th:case="${detailLineNumber == null }">
			<th scope="row" class="infoline" rowspan="2">
				<div align="right">add:</div>
			</th>
		</th:block>
		<th:block th:case="*">
			<th scope="row" class="infoline" rowspan="2">
				<div align="center">${detailLineNumber+1}</div>
			</th>
		</th:block>
	</th:block>
	<td valign="top" class="infoline"><input type="text" name="${detail}.expenseDate" th:field="*{${detail}.expenseDate}" data-attribute-entry="${otherExpenseAttributes.expenseDate}" />
	</td>
	<td valign="top" class="infoline">
		<span th:text="${detailObject.expenseType.name}"></span>
		<!--/*/ <th:block th:with="strKey=${detail}.expenseTypeCode"> /*/--> 
		<c:forEach items="${ErrorPropertyList}" var="key">
			<th:block th:if="${key == strKey}">
				<kul:fieldShowErrorIcon />
			</th:block>
		</tr>
	</td>
	<%-- Show Mileage --%>
	<th:block th:if="${parentObject.mileageIndicator}">
		<!--/*/ <th:block th:with="calcColspan=${calcColspan+2 }"> /*/-->
		<td valign="top" class="infoline" align="center"><input type="text" name="${detail}.miles" th:field="*{${detail}.miles}" data-attribute-entry="${otherExpenseAttributes.miles}" onchange="updateMileage(this.id)" /></td>
		<td valign="top" class="infoline" align="center">
			<span th:text="${detailObject.contextlessMileageRate.rate}"></span>
		</td>
	</th:block>
	<td valign="top" nowrap class="infoline">
		<div align="center" id="div_${detail}.expenseAmount">
			<input type="text" name="${detail}.expenseAmount" th:field="*{${detail}.expenseAmount}" data-attribute-entry="${otherExpenseAttributes.expenseAmount}" />
		</div></td>
	<td valign="top" class="infoline">
		<div align="center" id="div_${detail}.convertedAmount">
			<input type="text" name="${detail}.convertedAmount" th:field="*{${detail}.convertedAmount}" data-attribute-entry="${otherExpenseAttributes.convertedAmount}" readonly="readonly" />
		</div>
	</td>
	<td valign="top" nowrap class="infoline">
		<div align="center">
			<input type="text" name="${detail}.nonReimbursable" th:field="*{${detail}.nonReimbursable}" data-attribute-entry="${otherExpenseAttributes.nonReimbursable}" />
		</div>
	</td>
	<td valign="top" nowrap class="infoline">
		<div align="center">
			<input type="text" name="${detail}.taxable" th:field="*{${detail}.taxable}" data-attribute-entry="${otherExpenseAttributes.taxable}" />
    	</div>
    </td>
	<th:block th:if="${!empty detailObject.expenseTypeObjectCode && detailObject.expenseTypeObjectCode.receiptRequired}">
		<td valign="top" nowrap class="infoline">
            <div align="center">
				<input type="text" name="${detail}.expenseTypeObjectCode.receiptRequired" th:field="*{${detail}.expenseTypeObjectCode.receiptRequired}" data-attribute-entry="${DataDictionary.ExpenseTypeObjectCode.attributes.receiptRequired}" readonly="readonly" />
			</div>
		</td>
	</th:block>
	<td valign="top" class="infoline">
		<div align="center">
			<th:block th:if="${!empty detailObject.expenseTypeObjectCode && detailObject.expenseTypeObjectCode.receiptRequired}">
				<input type="text" name="${detail}.missingReceipt" th:field="*{${detail}.missingReceipt}" data-attribute-entry="${otherExpenseAttributes.missingReceipt}" />
			</th:block>
			<th:block th:if="${empty detailObject.expenseTypeObjectCode || !detailObject.expenseTypeObjectCode.receiptRequired}">
				N/A
			</th:block>
		</div>
	</td>
	<%-- Show Airfare --%>
	<th:block th:if="${parentObject.airfareIndicator}">
		<!--/*/ <th:block th:with="calcColspan=${calcColspan+2 }"> /*/-->
		<td valign="top" class="infoline">
			<input type="text" name="${detail}.airfareSourceCode" th:field="*{${detail}.airfareSourceCode}" data-attribute-entry="${otherExpenseAttributes.airfareSourceCode}" />
		</td>
		<td valign="top" class="infoline">
			<th:block th:switch="${true}">
				<th:block th:case="${fullEntryMode}">
					<!--/*/ <th:block th:with="expenseTypeMetaCategoryCode=${parentObject.expenseType.expenseTypeMetaCategoryCode}"> /*/-->
					<select th:field="*{${detail}.classOfServiceCode}" disabled="${!fullEntryMode}" tabindex="${KualiForm.currentTabIndex}">
						<c:forEach items="${temfunc:getOptionList('org.kuali.kfs.module.tem.businessobject.options.ClassOfServiceValuesFinder', paramMap)}" var="option">
							<!--/*/ <th:block th:with="isSelected=${detailObject.classOfServiceCode == option.key}"> /*/-->
							<option value="${option.key}" ${isSelected?'selected=true':'' }>${option.value}</option>
						</tr>
					</select>
				</th:block>
				<th:block th:case="*">
					<span th:text="${detailObject.classOfService.classOfServiceName}"></span>
				</th:block>
			</th:block>				
		</td>
	</th:block>
	<th:block th:if="${parentObject.rentalCarIndicator}">
	<!--/*/ <th:block th:with="calcColspan=${calcColspan+2 }"> /*/-->
		<td valign="top" class="infoline">
			<th:block th:switch="${true}">
				<th:block th:case="${fullEntryMode}">
					<!--/*/ <th:block th:with="expenseTypeMetaCategoryCode=${parentObject.expenseType.expenseTypeMetaCategoryCode}"> /*/-->
					<select th:field="*{${detail}.classOfServiceCode}" disabled="${!fullEntryMode}" tabindex="${KualiForm.currentTabIndex}">
						<c:forEach items="${temfunc:getOptionList('org.kuali.kfs.module.tem.businessobject.options.ClassOfServiceValuesFinder', paramMap)}" var="option">
							<!--/*/ <th:block th:with="isSelected=${detailObject.classOfServiceCode == option.key}"> /*/-->
							<option value="${option.key}" ${isSelected?'selected=true':'' }>${option.value}</option>
						</tr>
					</select>
				</th:block>
				<th:block th:case="*">
					<span th:text="${detailObject.classOfService.classOfServiceName}"></span>
				</th:block>
			</th:block>
		</td>
		<td valign="top" class="infoline">
			<div align="center">
				<input type="text" name="${detail}.rentalCarInsurance" th:field="*{${detail}.rentalCarInsurance}" data-attribute-entry="${otherExpenseAttributes.rentalCarInsurance}" />
			</div>		
		</td>
	</th:block>
	<!--/*/ <th:block th:with="notesTabIndex=${KualiForm.currentTabIndex}"> /*/-->
	<!--/*/ <th:block th:with="dummyIncrementVar=${kfunc:incrementTabIndex(KualiForm, tabKey)}"> /*/-->
	<td class="infoline" rowspan="2">
		<th:block th:switch="${true}">
			<th:block th:case="${detailLineNumber != null}">
				<th:block th:if="${fullEntryMode}">
					<div align="center">
						<input type="image" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-delete1.gif"
							styleClass="tinybutton"
							property="methodToCall.deleteActualExpenseDetailLine.line${lineNumber}-${detailLineNumber}"
							alt="Delete Actual Expense Line"
							title="Delete Actual Expense Detail Line" />
					</div>
				</th:block>
				<th:block th:if="${!fullEntryMode}"> &nbsp; </th:block>
			</th:block>
			<th:block th:case="*">
				<!--/*/ <th:block th:with="tabindex=${KualiForm.currentTabIndex}"> /*/-->
				<!--/*/ <th:block th:with="dummyIncrementVar=${kfunc:incrementTabIndex(KualiForm, tabKey)}"> /*/-->
				<div align="center">
					<input type="image" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-add1.gif"
						styleClass="tinybutton" tabindex="${tabindex}"
						property="methodToCall.addActualExpenseDetailLine.line${lineNumber}"
						alt="Add Actual Expense Detail Line"
						title="Add Actual Expense Detail Line" />
				</div>
			</th:block>
		</th:block>
	</td>
</tr>
<tr>
	<th>
		<div align="left">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${otherExpenseAttributes.description}"></label>
		</div>
	</th>
	<td valign="top" class="infoline" colspan="${calcColspan}">
		<input type="text" name="${detail}.description" th:field="*{${detail}.description}" data-attribute-entry="${otherExpenseAttributes.description}" />
	</td>
</tr>
</div>
