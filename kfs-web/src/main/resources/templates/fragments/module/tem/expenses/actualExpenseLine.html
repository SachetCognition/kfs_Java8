<!-- Thymeleaf fragment converted from tag: module/tem/expenses/actualExpenseLine.tag -->
<!-- Fragment parameters: lineNumber, expense, detailObject -->
<div th:fragment="content (lineNumber, expense, detailObject)" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="otherExpenseAttributes=${DataDictionary.ActualExpense.attributes}"> /*/-->
<jsp:useBean id="paramMap" class="java.util.HashMap" />
<!--/*/ <th:block th:with="tripType=${KualiForm.document.tripTypeCode}"> /*/-->
<!--/*/ <th:block th:with="travelerType=${KualiForm.document.traveler.travelerTypeCode}"> /*/-->
<!--/*/ <th:block th:with="documentType=${KualiForm.docTypeName}"> /*/-->

		<tr>
			<th:block th:if="${lineNumber == null}">
				<th scope="row" class="infoline" rowspan="2">
					<div align="right">add:</div>
				</th>
			</th:block>
			<td valign="top" class="infoline">
				<input type="text" name="${expense}.expenseDate" th:field="*{${expense}.expenseDate}" data-attribute-entry="${otherExpenseAttributes.expenseDate}" />
			</td>
			<td valign="top" class="infoline">
				<th:block th:switch="${true}">
					<th:block th:case="${empty lineNumber }">
						<!--/*/ <th:block th:with="groupTravelCount=${#strings.length(KualiForm.document.groupTravelers)}"> /*/-->
						<select th:field="*{${expense}.expenseTypeCode}" 
							styleId="${expense}.expenseTypeCode"
							onchange="checkDirectBilled('${expense}');loadExpenseTypeObjectCode(this, '${KualiForm.docTypeName}', '${KualiForm.document.traveler.travelerTypeCode}', '${KualiForm.document.tripTypeCode}');disableExpenseAmount(this)"
							tabindex="${KualiForm.currentTabIndex}">
							<c:forEach items="${temfunc:getOptionList('org.kuali.kfs.module.tem.businessobject.options.TravelExpenseTypeValuesFinder', paramMap)}" var="option">						
								<!--/*/ <th:block th:with="isSelected=${detailObject.expenseTypeCode == option.key}"> /*/-->
								<%-- Populate the value that was previously selected before error occurred --%>
								<option value="${option.key}" ${isSelected?'selected=true':'' }>${option.value}</option>
							</tr>
						</select>
						<c:forEach items="${ErrorPropertyList}" var="key">
							<th:block th:if="${key == 'newActualExpenseLine.expenseTypeCode'}">
								<kul:fieldShowErrorIcon />
							</th:block>
						</tr>
					</th:block>
					<th:block th:case="*">
						<span th:text="${detailObject.expenseType.name}"></span>
					</th:block>
				</th:block>	
			</td>
			<td valign="top" class="infoline">
				<th:block th:switch="${true}">
					<th:block th:case="${lineNumber == null }">
						<input type="text" name="${expense}.travelCompanyCodeName" th:field="*{${expense}.travelCompanyCodeName}" data-attribute-entry="${otherExpenseAttributes.travelCompanyCodeName}" />
                		<span class="kfs-lookup" data-bo-class="org.kuali.kfs.fp.businessobject.TravelCompanyCode" th:replace="~{fragments/kul/lookup :: content}"></span>
					</th:block>
					<th:block th:case="*">
						<span th:text="${detailObject.travelCompanyCodeName}"></span>&nbsp;
					</th:block>
				</th:block>
			</td>
			<td valign="top" nowrap class="infoline">
				<div align="center" id="div_${expense}.expenseAmount">
					<input type="text" name="${expense}.expenseAmount" th:field="*{${expense}.expenseAmount}" data-attribute-entry="${otherExpenseAttributes.expenseAmount}" />
				</div>
			</td>
			<td valign="top" nowrap class="infoline">
				<div align="center" id="div_${expense}.currencyRate">
					<!--/*/ <th:block th:with="currencyRateReadOnly=${!conversionRateEntryMode}"> /*/-->
					<th:block th:if="${!conversionRateEntryMode}">
						<!--/*/ <th:block th:with="currencyRateReadOnly=${lineNumber != null || !fullEntryMode || !empty detailObject.expenseDetails || detailObject.expenseTypeObjectCode.expenseType.expenseDetailRequired}"> /*/-->
					</th:block>
					<input type="text" name="${expense}.currencyRate" th:field="*{${expense}.currencyRate}" data-attribute-entry="${otherExpenseAttributes.currencyRate}" />
					<br/>
					<th:block th:if="${lineNumber == null}">
						<a href="${KualiForm.foreignCurrencyUrl}" target="currency_conversion_window" tabindex="${KualiForm.currentTabIndex}">Rate Conversion Site</a>
					</th:block>
	            </div>
            </td>
            <td valign="top" nowrap class="infoline">
				<div align="center">
					<input type="text" name="${expense}.nonReimbursable" th:field="*{${expense}.nonReimbursable}" data-attribute-entry="${otherExpenseAttributes.nonReimbursable}" />
            	</div>
            </td>
            <td valign="top" nowrap class="infoline">
				<div align="center">
					<input type="text" name="${expense}.taxable" th:field="*{${expense}.taxable}" data-attribute-entry="${otherExpenseAttributes.taxable}" />
            	</div>
            </td>
            <td valign="top" nowrap class="infoline">
            	<div align="center">
            		<th:block th:if="${! empty detailObject.expenseTypeObjectCode}">
					<input type="text" name="${expense}.expenseTypeObjectCode.receiptRequired" th:field="*{${expense}.expenseTypeObjectCode.receiptRequired}" data-attribute-entry="${DataDictionary.ExpenseTypeObjectCode.attributes.receiptRequired}" readonly="readonly" />
					</th:block>
				</div>
            </td>
			
			<td class="infoline" valign="top">
				<div align="center">
					<th:block th:if="${detailObject.expenseTypeObjectCode.receiptRequired}">
						<input type="text" name="${expense}.missingReceipt" th:field="*{${expense}.missingReceipt}" data-attribute-entry="${otherExpenseAttributes.missingReceipt}" />
					</th:block>
					<th:block th:if="${!detailObject.expenseTypeObjectCode.receiptRequired}">
						N/A
					</th:block>
				</div>
				</td>
			<td valign="top" nowrap class="infoline">
				<div align="center" id="div_${expense}.convertedAmount">
					<input type="text" name="${expense}.convertedAmount" th:field="*{${expense}.convertedAmount}" data-attribute-entry="${otherExpenseAttributes.convertedAmount}" readonly="readonly" />
				</div>
			</td>
			<td class="infoline" rowspan="2">
				<!--/*/ <th:block th:with="notesTabIndex=${KualiForm.currentTabIndex}"> /*/-->
				<!--/*/ <th:block th:with="dummyIncrementVar=${kfunc:incrementTabIndex(KualiForm, tabKey)}"> /*/-->
				<!--/*/ <th:block th:with="tabindex=${KualiForm.currentTabIndex}"> /*/-->
				<!--/*/ <th:block th:with="dummyIncrementVar=${kfunc:incrementTabIndex(KualiForm, tabKey)}"> /*/-->
				<div align="center">
					<th:block th:switch="${true}">
						<th:block th:case="${fullEntryMode}">
							<th:block th:switch="${true}">
								<th:block th:case="${lineNumber == null }">
									<input type="image" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-add1.gif"
										styleClass="tinybutton" 
										tabindex="${ tabindex}" 
										property="methodToCall.addActualExpenseLine.line${lineNumber-1}"
										alt="Add Actual Expense Line" title="Add Actual Expense Line" />
								</th:block>
								<th:block th:case="*">
									<input type="image" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-delete1.gif"
										styleClass="tinybutton"
										property="methodToCall.deleteActualExpenseLine.line${lineNumber-1}"
										alt="Delete Actual Expense Line"
										title="Delete Actual Expense Line" />
								</th:block>
							</th:block>
						</th:block>
						<th:block th:case="*">
							&nbsp;
						</th:block>
					</th:block>
				</div>
			</td>
		</tr>
		<tr>
			<th>
				<div align="left">
					<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${otherExpenseAttributes.description}"></label>
				</div>
			</th>
			<td valign="top" class="infoline" colspan="9">
				<input type="text" name="${expense}.description" th:field="*{${expense}.description}" data-attribute-entry="${otherExpenseAttributes.description}" />
			</td>
		</tr>
</div>
