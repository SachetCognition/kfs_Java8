<!-- Thymeleaf fragment converted from tag: module/tem/expenses/importedExpenseLine.tag -->
<!-- Fragment parameters: expense, lineNumber, detailObject -->
<div th:fragment="content (expense, lineNumber, detailObject)" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="importedExpenseAttributes=${DataDictionary.ImportedExpense.attributes}"> /*/-->
<jsp:useBean id="paramMap" class="java.util.HashMap" />
<!--/*/ <th:block th:with="tripType=${KualiForm.document.tripTypeCode}"> /*/-->
<!--/*/ <th:block th:with="travelerType=${KualiForm.document.traveler.travelerTypeCode}"> /*/-->
<!--/*/ <th:block th:with="documentType=${KualiForm.docTypeName}"> /*/-->
		<tr>
				<th:block th:if="${lineNumber == null}">
					<th scope="row" class="infoline" rowspan="2">
						<div align="right">add:</div>
					</th>
				</th:block>
				<td class="infoline">
					<div align="center">
					<input type="text" name="${expense}.cardType" th:field="*{${expense}.cardType}" data-attribute-entry="${importedExpenseAttributes.cardType}" readonly="readonly" />
					</div>
				</td>
				<td class="infoline">
					<div align="center">
					<input type="text" name="${expense}.expenseDate" th:field="*{${expense}.expenseDate}" data-attribute-entry="${importedExpenseAttributes.expenseDate}" readonly="readonly" />
					</div>
				</td>
				<td valign="top" class="infoline">
					<th:block th:switch="${true}">
						<th:block th:case="${fullEntryMode}">
							<!--/*/ <th:block th:with="groupTravelCount=${#strings.length(KualiForm.document.groupTravelers)}"> /*/-->
							<select th:field="*{${expense}.expenseTypeCode}" 
								styleId="${expense}.expenseTypeCode"
								onchange="checkDirectBilled('${expense}');loadExpenseTypeObjectCode(this, '${KualiForm.docTypeName}', '${KualiForm.document.traveler.travelerTypeCode}', '${KualiForm.document.tripTypeCode}')">
								<c:forEach items="${temfunc:getOptionList('org.kuali.kfs.module.tem.businessobject.options.TravelExpenseTypeValuesFinder', paramMap)}" var="option">						
									<!--/*/ <th:block th:with="isSelected=${detailObject.expenseTypeCode == option.key}"> /*/-->
									<%-- Populate the value that was previously selected before error occurred --%>
									<option value="${option.key}" ${isSelected?'selected=true':'' }>${option.value}</option>
								</tr>
							</select>
							<c:forEach items="${ErrorPropertyList}" var="key">
								<th:block th:if="${key == 'newImportedExpenseLine.expenseTypeCode'}">
									<kul:fieldShowErrorIcon />
								</th:block>
							</tr>
						</th:block>
						<th:block th:case="*">
							<span th:text="${detailObject.expenseTypeObjectCode.expenseType.name}"></span>
						</th:block>
					</th:block>	
				</td>
				<td valign="top" class="infoline">
					<input type="text" name="${expense}.travelCompanyCodeName" th:field="*{${expense}.travelCompanyCodeName}" data-attribute-entry="${importedExpenseAttributes.travelCompanyCodeName}" />
					<th:block th:if="${fullEntryMode }">
			            <span class="kfs-lookup" data-bo-class="org.kuali.kfs.fp.businessobject.TravelCompanyCode" th:replace="~{fragments/kul/lookup :: content}"></span> 	
			    	</th:block>
				</td>
				<td valign="top" nowrap class="infoline">
					<div align="center">
						<input type="text" name="${expense}.expenseAmount" th:field="*{${expense}.expenseAmount}" data-attribute-entry="${importedExpenseAttributes.expenseAmount}" readonly="readonly" />
						<!--/*/ <th:block th:with="fullPath=document.importedExpenses[${lineNumber-1}].expenseAmount"> /*/-->
						<c:forEach items="${ErrorPropertyList}" var="key">
							<th:block th:if="${key == fullPath}">
								<kul:fieldShowErrorIcon />
							</th:block>
						</tr>
					</div>
				</td>
				<td valign="top" nowrap class="infoline">
					<div align="center">
						<input type="text" name="${expense}.currencyRate" th:field="*{${expense}.currencyRate}" data-attribute-entry="${importedExpenseAttributes.currencyRate}" />
						<br/>
		            	<a href="${KualiForm.foreignCurrencyUrl}" target="currency_conversion_window">Rate Conversion Site</a>
		            </div>
				</td>
		        <td valign="top" nowrap class="infoline">
					<div align="center">
						<input type="text" name="${expense}.convertedAmount" th:field="*{${expense}.convertedAmount}" data-attribute-entry="${importedExpenseAttributes.convertedAmount}" readonly="readonly" />
					</div>
				</td>
		        <td valign="top" nowrap class="infoline">
					<div align="center">
						<input type="text" name="${expense}.nonReimbursable" th:field="*{${expense}.nonReimbursable}" data-attribute-entry="${importedExpenseAttributes.nonReimbursable}" />
		            </div>
				</td>
		        <td valign="top" nowrap class="infoline">
					<div align="center">
						<input type="text" name="${expense}.receiptRequired" th:field="*{${expense}.receiptRequired}" data-attribute-entry="${importedExpenseAttributes.receiptRequired}" />
		            </div>
		        </td>
		        <td valign="top" nowrap class="infoline">
					<div align="center">
						<input type="text" name="${expense}.taxable" th:field="*{${expense}.taxable}" data-attribute-entry="${importedExpenseAttributes.taxable}" />
		            </div>
				</td>
				<td class="infoline" rowspan="2">
					<th:block th:switch="${true}">
						<th:block th:case="${lineNumber != null}">
							<th:block th:if="${fullEntryMode}">
								<div align="center">
									<input type="image" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-delete1.gif"
										styleClass="tinybutton"
										property="methodToCall.deleteImportedExpenseLine.line${(lineNumber-1)}"
										alt="Delete Imported Expense Line"
										title="Delete Imported Expense Line" />
								</div>
							</th:block>
							<th:block th:if="${!fullEntryMode}">
								&nbsp;
							</th:block>
						</th:block>
						<th:block th:case="*">
							<!--/*/ <th:block th:with="tabindex=${KualiForm.currentTabIndex}"> /*/-->
							<!--/*/ <th:block th:with="dummyIncrementVar=${kfunc:incrementTabIndex(KualiForm, tabKey)}"> /*/-->
							<div align="center">
								<input type="image" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-add1.gif"
									styleClass="tinybutton" 
									tabindex="${tabindex}" 
									property="methodToCall.addImportedExpenseLine"
									alt="Add Imported Expense Line" 
									title="Add Imported Expense Line" />
							</div>
						</th:block>
					</th:block>
				</td>
			</tr>
			<tr>
				<th>
					<div align="right">
						<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${importedExpenseAttributes.description}"></label>
					</div>
				</th>
				<td valign="top" class="infoline" colspan="9">
					<input type="text" name="${expense}.description" th:field="*{${expense}.description}" data-attribute-entry="${importedExpenseAttributes.description}" />
				</td>
			</tr>
</div>
