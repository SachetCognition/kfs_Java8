<!-- Thymeleaf fragment converted from tag: module/tem/agreementTab.tag -->
<!-- Fragment parameters: documentAttribute, text, title, property, enable, open -->
<div th:fragment="content (documentAttribute, text, title, property, enable, open)" xmlns:th="http://www.thymeleaf.org">
<section class="kfs-tab" data-tab-title="${title}" data-default-open="${open}">
  <h3>${title}</h3>
<div class="tab-container" align=center >
<table cellpadding=2 class="datatable" summary="${title}">
	<tr>
    	<td colspan=2 align=left valign=middle class="datacell">${text}</td>
    </tr>
    <tr>
    	<th scope=row class="bord-l-b">
    		<div align="right">
    			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${documentAttribute}"></label>
			</div>
		</th>
		<td class="datacell" width="25%">
        	<input type="text" name="document.${property}" th:field="*{document.${property}}" data-attribute-entry="${documentAttribute}" />
        </td>
    </tr>
</table>
</div>
</section>
</div>
