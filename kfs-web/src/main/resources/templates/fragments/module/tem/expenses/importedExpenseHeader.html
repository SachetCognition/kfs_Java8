<!-- Thymeleaf fragment converted from tag: module/tem/expenses/importedExpenseHeader.tag -->
<!-- Fragment parameters: lineNumber, isCTS -->
<div th:fragment="content (lineNumber, isCTS)" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="importedExpenseAttributes=${DataDictionary.ImportedExpense.attributes}"> /*/-->
			<tr>
				<th:block th:switch="${true}">
					<th:block th:case="${lineNumber == null }">
						<th>&nbsp;</th>
					</th:block>
					<th:block th:case="*">
						<th scope="row" class="infoline" rowspan="${isCTS?3:4}">
							<div align="center"> 
								${lineNumber}
							</div>
						</th>
					</th:block>
				</th:block>
	            <th>
	            	<div align="left">
	            		<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${importedExpenseAttributes.cardType}"></label>
	            	</div>
				</th>
				<th>
					<div align="left">
						<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${importedExpenseAttributes.expenseDate}"></label>
					</div>
				</th>
				<th>
					<div align="left">
						<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${importedExpenseAttributes.expenseTypeObjectCodeId}"></label>
					</div>
				</th>
				<th>
					<div align="left">
						<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${importedExpenseAttributes.travelCompanyCodeName}"></label>
					</div>
				</th>
				<th>
					<div align="left">
						<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${importedExpenseAttributes.expenseAmount}"></label>
					</div>
				</th>
				<th>
					<div align="left">
						<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${importedExpenseAttributes.currencyRate}"></label>
					</div>
				</th>
				<th>
					<div align="left">$US</div>
				</th>
				<th>
					<div align="left">
						<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${importedExpenseAttributes.nonReimbursable}"></label>
					</div>
				</th>
				<th>
					<div align="left">
						<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${importedExpenseAttributes.receiptRequired}"></label>
					</div>
				</th>
				<th>
					<div align="left">
						<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${importedExpenseAttributes.taxable}"></label>
					</div>
				</th>
	            <th>
	            	<div align="center">Actions</div>
	            </th>
			</tr>
</div>
