<!-- Thymeleaf fragment converted from tag: module/tem/expenses/actualExpenseHeader.tag -->
<!-- Fragment parameters: lineNumber, detailObject -->
<div th:fragment="content (lineNumber, detailObject)" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="otherExpenseAttributes=${DataDictionary.ActualExpense.attributes}"> /*/-->
<!--/*/ <th:block th:with="temExtension=${DataDictionary.ExpenseTypeObjectCode.attributes}"> /*/-->


<tr>
	<th:block th:switch="${true}">
		<th:block th:case="${lineNumber == null }">
			<th>&nbsp;</th>
		</th:block>
		<th:block th:case="*">
			<th scope="row" class="infoline" rowspan="4">
				<div align="center">${lineNumber}</div></th>
		</th:block>
	</th:block>
	<th>
		<div align="left">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${otherExpenseAttributes.expenseDate}"></label>
		</div>
	</th>
	<th>
		<div align="left">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${otherExpenseAttributes.expenseTypeCode}"></label>
		</div>
	</th>
	<th>
		<div align="left">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${otherExpenseAttributes.travelCompanyCodeName}"></label>
		</div>
	</th>
	<th>
		<div align="left">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${otherExpenseAttributes.expenseAmount}"></label>
		</div>
	</th>
	<th>
		<div align="left">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${otherExpenseAttributes.currencyRate}"></label>
		</div>
	</th>
	<th>
		<div align="left">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${otherExpenseAttributes.nonReimbursable}"></label>
		</div>
	</th>
	<th>
		<div align="left">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${otherExpenseAttributes.taxable}"></label>
		</div>
	</th>
	<th>
		<div align="left">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${temExtension.receiptRequired}"></label>
		</div>
	</th>
	<th>
		<div align="left">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${otherExpenseAttributes.missingReceipt}"></label>
		</div>
	</th>
	<th>
		<div align="left">$US</div>
	</th>
	<th>
		<div align="center">Actions</div>
	</th>
</tr>
</div>
