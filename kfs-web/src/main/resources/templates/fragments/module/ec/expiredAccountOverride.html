<!-- Thymeleaf fragment converted from tag: module/ec/expiredAccountOverride.tag -->
<!-- Fragment parameters: detailLineFormName, attributes, readOnly -->
<div th:fragment="content (detailLineFormName, attributes, readOnly)" xmlns:th="http://www.thymeleaf.org">
<%@ tag description="render the override widget for the expired account" %>

<!--/*/ <th:block th:with="accountExpiredOverride=accountExpiredOverride"> /*/-->
<!--/*/ <th:block th:with="accountExpiredOverrideNeeded=accountExpiredOverrideNeeded"> /*/-->
			  
<span class="nowrap" style="font-weight: normal">
	<th:block th:switch="${true}">
		<th:block th:case="${readOnly}">
			<input type="hidden" th:field="*{${detailLineFormName}.${accountExpiredOverride}}" />
		</th:block>
		<th:block th:case="*">
			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${attributes[accountExpiredOverride]}"></label>
		            
		    <input type="text" name="${detailLineFormName}.${accountExpiredOverride}" th:field="*{${detailLineFormName}.${accountExpiredOverride}}" data-attribute-entry="${attributes[accountExpiredOverride]}" />
		</th:block>
	</th:block>
	
</span>
</div>
