<!-- Thymeleaf fragment converted from tag: module/cams/assetPaymentAllocation.tag -->
<div th:fragment="content ()" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="assetAllocationAttributes=${DataDictionary.AssetPaymentAllocationType.attributes}"> /*/-->
<!--/*/ <th:block th:with="viewOnly=${!KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}"> /*/-->

<%-- Tab to allow selection of the method to distribute asset payments. --%>
<section class="kfs-tab" data-tab-title="Asset Allocation" data-default-open="true">
  <h3>Asset Allocation</h3>
	<div class="tab-container" id="allocation" align="left">	
		<table class="datatable" width="100%" border="0" cellpadding="0" cellspacing="0" border="1">
			<tr>
				<td colspan="3" class="subhead">
			    	<span class="subhead-left">Asset Allocation</span>
			  	</td>
			</tr>
		    <tr>
			    <th width="10%">Asset Allocation</th>
			    
			    <th:block th:if="${KualiForm.document.allocationFromFPDocuments == true}">
			    	<!--/*/ <th:block th:with="viewOnly=true"> /*/-->	
			    </th:block>
			     
				<td class="infoline" valign="top" width="84%">														
					<input type="text" name="allocationCode" th:field="*{allocationCode}" data-attribute-entry="${assetAllocationAttributes.allocationCode}" />
					&nbsp;&nbsp;&nbsp;&nbsp;
					<th:block th:if="${!viewOnly}">
				    	<input type="image" property="methodToCall.selectAllocationType" src="${ConfigProperties.externalizable.images.url}tinybutton-select.gif" styleClass="tinybutton" alt="Select Allocation" title="Select Allocation"/>
				    </th:block>
				</td>
		    </tr>
		</table>
    </div>    
</section>
</div>
