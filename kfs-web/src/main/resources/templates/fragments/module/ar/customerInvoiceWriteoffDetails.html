<!-- Thymeleaf fragment converted from tag: module/ar/customerInvoiceWriteoffDetails.tag -->
<div th:fragment="content ()" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="customerInvoiceDetailAttributes=${DataDictionary.CustomerInvoiceDetail.attributes}"> /*/-->
<!--/*/ <th:block th:with="documentAttributes=${DataDictionary.CustomerInvoiceWriteoffDocument.attributes}"> /*/-->            
              
<section class="kfs-tab" data-tab-title="Invoice Items" data-default-open="true">
  <h3>Invoice Items</h3>
    <div class="tab-container" align=center>		
        <table cellpadding="0" cellspacing="0" class="datatable" summary="Invoice Items">
            <tr>
            	<td colspan="5" class="subhead">Invoice Items</td>
            </tr>
			<tr>
			    <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry=""></th>
			    <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${customerInvoiceDetailAttributes.invoiceItemQuantity}"></th>
			    <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${customerInvoiceDetailAttributes.invoiceItemDescription}"></th>
			    <th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${customerInvoiceDetailAttributes.amountOpen}"></th>				
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${customerInvoiceDetailAttributes.writeoffAmount}"></th>
			</tr>
			<tr th:each="customerInvoiceDetail : ${KualiForm.document.customerInvoiceDetailsForWriteoff}"
				indexId="ctr">
				<div th:replace="~{fragments/ar/customerInvoiceWriteoffDetail :: content}" data-row-header="${ctr+1}" data-inv-property-name="document.customerInvoiceDetailsForWriteoff[${ctr}]" data-css-class="datacell"></div>
			</tr>
			<tr>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${documentAttributes.invoiceWriteoffAmount}"></th>
				<!--  Customer Credit Memo Total Item Amount -->
				<td class="total-line" style="border-left: 0px;">
					<strong>${KualiForm.document.invoiceWriteoffAmount}</strong>
				</td>
			</tr> 
    	</table>
    </div>
</section>
</div>
