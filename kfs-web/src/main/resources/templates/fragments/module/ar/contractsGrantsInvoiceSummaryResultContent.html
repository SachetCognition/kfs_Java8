<div th:fragment="content ()" xmlns:th="http://www.thymeleaf.org">

<div class="tab-container" align="center">
	<h3>Awards to be Invoiced</h3>
	<table width="100%" border="0" cellpadding="0" cellspacing="0" class="datatable">
		<thead>
			<tr>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${awardAttributes.proposalNumber}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${awardAttributes.awardBeginningDate}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${awardAttributes.awardEndingDate}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${awardAttributes.billingFrequencyCode}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${awardAttributes.instrumentTypeCode}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${awardAttributes.invoicingOptionCode}"></th>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${awardAttributes.awardTotalAmount}"></th>
			</tr>
		</thead>
		<tr th:each="awards : ${KualiForm.${requestScope.propertyName}.awards}" indexId="ctr">
			<div th:replace="~{fragments/ar/contractsGrantsInvoiceSummarySubResult :: content}" data-award-attributes="${awardAttributes}" data-property-name="${requestScope.propertyName}.awards[${ctr}]"></div>
		</tr>
	</table>
</div>
</div>
