<!-- Thymeleaf fragment converted from tag: module/ar/invoiceMilestones.tag -->
<!-- Fragment parameters: readOnly -->
<div th:fragment="content (readOnly)" xmlns:th="http://www.thymeleaf.org">
<th:block th:if="${!empty KualiForm.document.invoiceGeneralDetail.proposalNumber}">

	<!-- If there are no invoiceMilestones, this section should not be displayed -->
	<section class="kfs-tab" data-tab-title="Milestones" data-default-open="true">
  <h3>Milestones</h3>
		<!--/*/ <th:block th:with="invoiceMilestoneAttributes=${DataDictionary.Milestone.attributes}"> /*/-->
		<!--/*/ <th:block th:with="milestoneAttributes=${DataDictionary.Milestone.attributes}"> /*/-->

		<div class="tab-container" align="center">
			<h3>Milestones</h3>
			<table cellpadding=0 class="datatable" summary="Milestonessection">
				<tr>
					<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${milestoneAttributes.milestoneNumber}"></th>
					<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${milestoneAttributes.milestoneDescription}"></th>
					<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${milestoneAttributes.milestoneActualCompletionDate}"></th>
					<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${milestoneAttributes.milestoneAmount}"></th>
				</tr>

				<logic:iterate indexId="ctr" name="KualiForm" property="document.invoiceMilestones" id="milestone">
					<tr>
						<td class="datacell"><a
							href="${ConfigProperties.application.url}/kr/inquiry.do?businessObjectClassName=org.kuali.kfs.module.ar.businessobject.Milestone&proposalNumber=${KualiForm.document.invoiceGeneralDetail.proposalNumber}&milestoneIdentifier=${KualiForm.document.invoiceMilestones[ctr].milestoneIdentifier}&methodToCall=start"
							target="_blank"> <input type="text" name="document.invoiceMilestones[${ctr}].milestoneNumber" th:field="*{document.invoiceMilestones[${ctr}].milestoneNumber}" data-attribute-entry="${invoiceMilestoneAttributes.milestoneNumber}" readonly="readonly" />
						</a></td>
						<td class="datacell"><input type="text" name="document.invoiceMilestones[${ctr}].milestoneDescription" th:field="*{document.invoiceMilestones[${ctr}].milestoneDescription}" data-attribute-entry="${invoiceMilestoneAttributes.milestoneDescription}" readonly="readonly" /></td>
						<td class="datacell"><input type="text" name="document.invoiceMilestones[${ctr}].milestoneActualCompletionDate" th:field="*{document.invoiceMilestones[${ctr}].milestoneActualCompletionDate}" data-attribute-entry="${milestoneAttributes.milestoneActualCompletionDate}" readonly="readonly" /></td>
						<td class="datacell"><input type="text" name="document.invoiceMilestones[${ctr}].milestoneAmount" th:field="*{document.invoiceMilestones[${ctr}].milestoneAmount}" data-attribute-entry="${invoiceMilestoneAttributes.milestoneAmount}" readonly="readonly" /></td>
					</tr>

				</tr>

				<tr>

					<td colspan="3" style="text-align: right" class="datacell"><b>Total</b></td>
					<td class="datacell"><b>${KualiForm.currentTotal }</b></td>
				</tr>

			</table>
		</div>
	</section>

</th:block>
</div>
