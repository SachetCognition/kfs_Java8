<!-- Thymeleaf fragment converted from tag: module/ar/openInvoiceReportResults.tag -->
<!-- Fragment parameters: reportLookupActionName -->
<div th:fragment="content (reportLookupActionName)" xmlns:th="http://www.thymeleaf.org">
<display:table class="datatable-100"
	      		cellspacing="0"
			    cellpadding="0"
			    name="${reqSearchResults}"
			    id="row"
			    export="true"
				pagesize="100"
				defaultsort="4"
				defaultorder="descending"
				requestURI="${reportLookupAction}?methodToCall=viewResults&reqSearchResultsSize=${reqSearchResultsSize}&searchResultKey=${searchResultKey}">

	<c:forEach items="${row.columns}" var="column">
		<th:block th:switch="${true}">
			<th:block th:case="${column.formatter.implementationClass == 'org.kuali.rice.core.web.format.CurrencyFormatter'}">
				<display:column class="numbercell"
			sortable="true"
			decorator="org.kuali.rice.kns.web.ui.FormatAwareDecorator"
			title="${column.columnTitle}"
			comparator="${column.comparator}">
					<th:block th:switch="${true}">
						<th:block th:case="${column.propertyURL != \"\"}">
							<a href="<span th:text="${column.propertyURL}"></span>"
							   title="${column.propertyValue}"
							   target="blank">
							   <span th:text="${column.propertyValue}"></span>
							</a>	
						</th:block>
						<th:block th:case="*">
							<span th:text="${column.propertyValue}"></span>
						</th:block>
					</th:block>
				</display:column>
			</th:block>
			<th:block th:case="*">
				<display:column class="infocell"
					sortable="${column.sortable}"
					decorator="org.kuali.rice.kns.web.ui.FormatAwareDecorator"
					title="${column.columnTitle}"
					comparator="${column.comparator}">
					<th:block th:switch="${true}">
						<th:block th:case="${column.propertyURL != \"\"}">
							<a href="<span th:text="${column.propertyURL}"></span>"
							   title="${column.propertyValue}"
							   target="blank">
							   <span th:text="${column.propertyValue}"></span>
							</a>
						</th:block>
						<th:block th:case="*">
							<span th:text="${column.propertyValue}"></span>
						</th:block>
					</th:block>
				</display:column>
			</th:block>
		</th:block>	
	</tr>
</display:table>
</div>
