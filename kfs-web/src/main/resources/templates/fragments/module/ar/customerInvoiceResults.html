<!-- Thymeleaf fragment converted from tag: module/ar/customerInvoiceResults.tag -->
<!-- Fragment parameters: subResultRows -->
<div th:fragment="content (subResultRows)" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="documentAttributes=${DataDictionary.CustomerInvoiceDocument.attributes}"> /*/-->
<tr>
	<td colspan="5">
		<br />
			<center>
			<table class="datatable-80" cellspacing="0" cellpadding="0" width="100%">
				<thead>
					<tr>
						<th>
							Write Off
						</th>
			    		<c:forEach items="${subResultRows[0].columns}" var="column" begin="0" end="${#strings.length(subResultRows[0].columns)}" varStatus="columnLoopStatus">
							<th class="sortable">
								${column.columnTitle}
							</th>
						</tr>
					</tr>
				</thead>

				<c:forEach items="${subResultRows}" var="row" varStatus="rowLoopStatus" begin="0" end="${#strings.length(subResultRows)}">
					<tr>
					    <td>
							<!--/*/ <th:block th:with="objectId=${row.objectId}"> /*/-->
							<!--/*/ <th:block th:with="checked=${empty KualiForm.compositeObjectIdMap[objectId] ? '' : 'checked=checked'}"> /*/-->
							<!--/*/ <th:block th:with="disabled=${true ? '' : 'disabled=disabled'}"> /*/-->							
							<!--/*/ <th:block th:with="checkBoxName=${Constants.MULTIPLE_VALUE_LOOKUP_SELECTED_OBJ_ID_PARAM_PREFIX}${objectId}"> /*/-->
							<!--/*/ <th:block th:with="hiddenFieldName=${Constants.MULTIPLE_VALUE_LOOKUP_DISPLAYED_OBJ_ID_PARAM_PREFIX}${objectId}"> /*/-->
							<input type="checkbox" title="${column.columnTitle}" name="${checkBoxName}" value="checked" ${disabled} ${checked}/>
							${kfunc:registerEditableProperty(KualiForm, checkBoxName)}
							<input type="hidden" name="${hiddenFieldName}" value="onscreen"/>
							${kfunc:registerEditableProperty(KualiForm, hiddenFieldName)}
						</td>
						<c:forEach items="${row.columns}" var="column" begin="0" end="${#strings.length(row.columns)}">
							<td class="infocell" title="${column.propertyValue}">
								<th:block th:if="${!empty column.propertyURL}">
									<a href="<span th:text="${column.propertyURL}"></span>" target="blank">
								</th:block>
								
								<span th:text="${fn:substring(column.propertyValue, 0, column.maxLength)}"></span>
								<th:block th:if="${column.maxLength gt 0 && fn:length(column.propertyValue) gt column.maxLength}">...</th:block>
								
								<th:block th:if="${!empty column.propertyURL}"></a></th:block>
							</td>
						</tr>
					</tr>
				</tr>
			</table>
			</center>
		<br />
	</td>
</tr>
</div>
