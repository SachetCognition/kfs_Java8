<!-- Thymeleaf fragment converted from tag: module/ar/contractsGrantsCollectionActivityInvoiceDetail.tag -->
<!-- Fragment parameters: invPropertyName, ctr, readOnly -->
<div th:fragment="content (invPropertyName, ctr, readOnly)" xmlns:th="http://www.thymeleaf.org">
<!--/*/ <th:block th:with="ContractsGrantsCollectionActivityInvoiceDetail=${DataDictionary.ContractsGrantsCollectionActivityInvoiceDetail.attributes}"> /*/-->

<%-- generate unique tab key from invPropertyName --%>
<!--/*/ <th:block th:with="tabKey=${kfunc:generateTabKey(invPropertyName)}"> /*/-->
<!--/*/ <th:block th:with="currentTab=${kfunc:getTabState(KualiForm, tabKey)}"> /*/-->

<%-- default to open --%>
<th:block th:switch="${true}">
    <th:block th:case="${empty currentTab}">
        <!--/*/ <th:block th:with="isOpen=true"> /*/-->
    </th:block>
    <th:block th:case="${!empty currentTab}">
        <!--/*/ <th:block th:with="isOpen=${currentTab == 'OPEN'}"> /*/-->
    </th:block>
</th:block>

<html:hidden property="tabStates(${tabKey})" value="${(isOpen ? 'OPEN' : 'CLOSE')}" />

<tr>
    <td colspan="2" style="padding: 0px;">
        <table style="width: 100%;" cellpadding="0" cellspacing="0" class="datatable" >
            <tr>
                <td class="tab-subhead" style="border-right: none;">
                	<th:block th:if="${isOpen == 'true' || isOpen == 'TRUE'}"> 
                		<input type="image" property="methodToCall.toggleTab.tab${tabKey}" 
                        			src="${ConfigProperties.kr.externalizable.images.url}tinybutton-hide.gif" 
                                    alt="hide" title="toggle" styleClass="tinybutton"
                                    styleId="tab-${tabKey}-imageToggle"
                                    onclick="javascript: return toggleTab(document, '${tabKey}'); " />
                    </th:block>
                    <th:block th:if="${isOpen != 'true' && isOpen != 'TRUE'}">
                    	<input type="image" property="methodToCall.toggleTab.tab${tabKey}"
                    				src="${ConfigProperties.kr.externalizable.images.url}tinybutton-show.gif"
                    				alt="show" title="toggle" styleClass="tinybutton"
                    				styleId="tab-${tabKey}-imageToggle"
                    				onclick="javascript: return toggleTab(document, '${tabKey}'); " />
                 	</th:block>
                </td>
            </tr>
        </table>
        
        <th:block th:if="${isOpen == 'true' || isOpen == 'TRUE'}">
            <div style="display: block;" id="tab-${tabKey}-div" class="accountingInfo">
        </th:block>
        <th:block th:if="${isOpen != 'true' && isOpen != 'TRUE'}">
            <div style="display: none;" id="tab-${tabKey}-div" class="accountingInfo">
        </th:block>
        
        <table style="width: 100%;" cellpadding="0" cellspacing="0" class="datatable" >
			<tr>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${ContractsGrantsCollectionActivityInvoiceDetail.invoiceNumber}"></th>
				<td>
					<div id="document.invoices.invoiceDocumentNumber.div">
						<input type="text" name="${invPropertyName}.invoiceNumber" th:field="*{${invPropertyName}.invoiceNumber}" data-attribute-entry="${ContractsGrantsCollectionActivityInvoiceDetail.documentNumber}" readonly="readonly" />
					</div>
				</td>									
			</tr>
			<tr>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${ContractsGrantsCollectionActivityInvoiceDetail.billingDate}"></th>
				<td>
					<div id="document.invoices.billingPeriod.div">
						<input type="text" name="${invPropertyName}.billingDate" th:field="*{${invPropertyName}.billingDate}" data-attribute-entry="${ContractsGrantsCollectionActivityInvoiceDetail.billingDate}" readonly="readonly" />
					</div>
				</td>									
			</tr>
			<tr>
				<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${ContractsGrantsCollectionActivityInvoiceDetail.billingPeriod}"></th>
				<td>
					<div id="document.invoices.billingPeriod.div">
						<input type="text" name="${invPropertyName}.billingPeriod" th:field="*{${invPropertyName}.billingPeriod}" data-attribute-entry="${ContractsGrantsCollectionActivityInvoiceDetail.billingPeriod}" readonly="readonly" />
					</div>
				</td>									
			</tr>
			<th:block th:if="${not readOnly}">
				<tr>
					<th class="datacell" colspan="2">
						<div align="center">
							<input type="image" property="methodToCall.deleteInvoice.line${ctr}"
								src="${ConfigProperties.kr.externalizable.images.url}tinybutton-delete1.gif" 
								alt="Delete Invoice" 
								title="Delete Invoice"
								styleClass="tinybutton" />
						</div>
					</th>
				</tr>
			</th:block>
         </table>    
    </td>
</tr>
</div>
