<script language="JavaScript" type="text/javascript" src="scripts/module/ar/customerObjectInfo.js"></script>

<!--/*/ <th:block th:with="arDocHeaderAttributes=${DataDictionary.AccountsReceivableDocumentHeader.attributes}"> /*/-->

<th:block th:if="${!empty KualiForm.document.invoiceGeneralDetail.proposalNumber}">

	<section class="kfs-tab" data-tab-title="Customer Information" data-default-open="true">
  <h3>Customer Information</h3>
		<div class="tab-container" align=center>
			<table cellpadding="0" cellspacing="0" class="datatable" summary="Invoice Section">
				<tr>
					<td colspan="4" class="subhead">Customer Information</td>
				</tr>
				<tr>
					<th align=right valign=middle class="bord-l-b" style="width: 25%;">
						<div align="right">
							<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${arDocHeaderAttributes.customerNumber}"></label>
						</div>
					</th>
					<td align=left valign=middle class="datacell" style="width: 25%;">
						<input type="text" name="document.accountsReceivableDocumentHeader.customerNumber" th:field="*{document.accountsReceivableDocumentHeader.customerNumber}" data-attribute-entry="${arDocHeaderAttributes.customerNumber}" readonly="readonly" />
					</td>
					<th align=right valign=middle class="bord-l-b" style="width: 25%;">
						<div align="right">
							<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${documentAttributes.customerName}"></label>
						</div>
					</th>
					<td align=left valign=middle class="datacell" style="width: 25%;">
						<div id="document.accountsReceivableDocumentHeader.customer.customerName.div">
							<input type="text" name="document.accountsReceivableDocumentHeader.customer.customerName" th:field="*{document.accountsReceivableDocumentHeader.customer.customerName}" data-attribute-entry="${documentAttributes.customerName}" readonly="readonly" />
						</div>
					</td>
				</tr>
			</table>
		</div>
	</section>
</th:block>
</div>
