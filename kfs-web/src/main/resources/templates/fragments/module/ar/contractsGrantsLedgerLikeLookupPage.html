<!-- Thymeleaf fragment converted from tag: module/ar/contractsGrantsLedgerLikeLookupPage.tag -->
<!-- Fragment parameters: formActionName -->
<div th:fragment="content (formActionName)" xmlns:th="http://www.thymeleaf.org">
<div class="kfs-page" data-header-title="Lookup" data-doc-title="">
  <form action="${formActionName}.do" method="post">

    <div class="headerarea-small" id="headerarea-small">
        <h1><span th:text="${KualiForm.lookupable.title}"></span> <span class="kfs-help" th:replace="~{fragments/kul/help :: content}"></span></h1>
    </div>

    <kul:enterKey methodToCall="search"/>

    <html-el:hidden name="KualiForm" property="backLocation"/>
    <html-el:hidden name="KualiForm" property="formKey"/>
    <html-el:hidden name="KualiForm" property="lookupableImplServiceName"/>
    <html-el:hidden name="KualiForm" property="businessObjectClassName"/>
    <html-el:hidden name="KualiForm" property="conversionFields"/>
    <html-el:hidden name="KualiForm" property="hideReturnLink"/>
    
    <div class="kfs-errors" data-key-match="*" th:if="${#fields.hasErrors('*')}"><h4>Errors found in Search Criteria:</h4></div>

    <table width="100%" cellspacing="0" cellpadding="0">
        <tr>
            <td width="1%"><img src="${ConfigProperties.kr.externalizable.images.url}pixel_clear.gif" alt="" width="20"
                                height="20"/></td>
            <td>
                <div id="lookup" align="center"><br/>
                    <br/>
                    <table class="datatable-100" align="center" cellpadding="0"
                           cellspacing="0">
                        <!--/*/ <th:block th:with="FormName=KualiForm"> /*/-->
                        <!--/*/ <th:block th:with="FieldRows=${KualiForm.lookupable.rows}"> /*/-->
                        <!--/*/ <th:block th:with="ActionName=glModifiedInquiry.do"> /*/-->
                        <!--/*/ <th:block th:with="IsLookupDisplay=true"> /*/-->

                        <div class="kfs-row-display"></div> `
						
                        <tr align=center>
                            <td height="30" colspan=2 class="infoline">
                                <input type="image" property="methodToCall.search" value="search"
                                            src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_search.gif"
                                            styleClass="tinybutton" alt="search" title="search" border="0"/>
                                <input type="image" property="methodToCall.clearValues" value="clearValues"
                                            src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_clear.gif"
                                            styleClass="tinybutton" alt="clear" title="clear" border="0"/>


                                <input type="image" property="methodToCall.cancel" value="cancel"
                                            src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_cancel.gif"
                                            styleClass="tinybutton" alt="cancel" title="cancel" border="0"/>

                                <!-- Optional extra button -->
                               <!--/*/ <th:block th:with="extraButtons=${KualiForm.extraButtons}"> /*/-->
									<div id="globalbuttons" class="globalbuttons">
										<th:block th:if="${!empty extraButtons}">
											<c:forEach items="${extraButtons}" var="extraButton">
												<input type="image" src="${extraButton.extraButtonSource}"
													styleClass="globalbuttons"
													property="${extraButton.extraButtonProperty}"
													title="${extraButton.extraButtonAltText}"
													alt="${extraButton.extraButtonAltText}" />
											</tr>
										</th:block>
									</div>
								</td>
                        </tr>
                    </table>
                </div>
				<jsp:doBody/>
			</td>
            <td width="1%"><img src="${ConfigProperties.kr.externalizable.images.url}pixel_clear.gif" alt="" height="20" width="20"></td>
        </tr>
