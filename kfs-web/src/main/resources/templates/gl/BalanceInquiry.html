<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Balance Inquiry</title>
</head>
<body>
<div layout:fragment="content">
<div class="kfs-page" data-header-title="Lookup" data-doc-title="">
<h1>Lookup</h1>
<form th:action="@{glBalanceInquiry}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="page-body">

	<div class="headerarea-small" id="headerarea-small">
	<h1><span th:text="${KualiForm.lookupable.title}"></span> <kul:help
		resourceKey="lookupHelpText" altText="lookup help" /></h1>
	</div>

	<kul:enterKey methodToCall="search" />

	<html-el:hidden name="KualiForm" property="backLocation" />
	<html-el:hidden name="KualiForm" property="formKey" />
	<html-el:hidden name="KualiForm" property="lookupableImplServiceName" />
	<html-el:hidden name="KualiForm" property="businessObjectClassName" />
	<html-el:hidden name="KualiForm" property="conversionFields" />
	<html-el:hidden name="KualiForm" property="hideReturnLink" />

	<kul:errors errorTitle="Errors found in Search Criteria:" />

	<table width="100%">
		<tr>
			<td width="1%"><img src="${ConfigProperties.kr.externalizable.images.url}pixel_clear.gif" alt="" width="20"
				height="20"></td>

			<td><th:block th:if="${param.inquiryFlag != 'true'}">
				<div id="lookup" align="center"><br />
				<br />
				<table class="datatable-100" align="center" cellpadding="0"
					cellspacing="0">
					<c:set var="FormName" value="KualiForm" scope="request" />
					<c:set var="FieldRows" value="${KualiForm.lookupable.rows}"
						scope="request" />
					<c:set var="ActionName" value="glBalanceInquiry.do" scope="request" />
					<c:set var="IsLookupDisplay" value="true" scope="request" />

					<kul:rowDisplay rows="${FieldRows}" />

					<tr align=center>
						<td height="30" colspan=2 class="infoline"><html:image
							property="methodToCall.search" value="search"
							src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_search.gif" styleClass="tinybutton"
							alt="search" title="search" border="0" /> <html:image
							property="methodToCall.clearValues" value="clearValues"
							src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_clear.gif" styleClass="tinybutton"
							alt="clear" title="clear" border="0" /> <th:block th:if="${KualiForm.formKey!=''}">
							<a
								href='<c:out value="${KualiForm.backLocation}?methodToCall=refresh&docFormKey=${KualiForm.formKey}" />' title="cancel">
							<img src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_cancel.gif" class="tinybutton"
								border="0" alt="cancel" title="cancel" /></a>
						</th:block> <!-- Optional extra button --> <th:block th:if="${not empty KualiForm.lookupable.extraButtonSource}">
							<a
								href='<c:out value="${KualiForm.backLocation}?methodToCall=refresh&refreshCaller=org.kuali.rice.kns.lookup.KualiLookupableImpl&docFormKey=${KualiForm.formKey}" /><span th:text="${KualiForm.lookupable.extraButtonParams}"></span>'>
							<img
								src='<span th:text="${KualiForm.lookupable.extraButtonSource}"></span>'
								class="tinybutton" border="0" /></a>
						</th:block></td>
					</tr>
				</table>
				</div>

				<br />
				<br />
			</th:block> 
			<th:block th:if="${param.inquiryFlag == 'true'}">
				<c:set var="url" value="glBalanceInquiry.do" scope="request" />

				<c:url value="${url}" var="amountViewSwitch">
					<th:block th:each="params : ${param}">
						<th:block th:if="${params.key == 'dummyBusinessObject.amountViewOption'}">
							<th:block th:if="${params.value == 'Accumulate' }">
								<c:param name="${params.key}" value="Monthly" />
								<!-- th:with="amountViewLabel=View Monthly Amount" -->
							</th:block>
							<th:block th:if="${params.value != 'Accumulate' }">
								<c:param name="${params.key}" value="Accumulate" />
								<!-- th:with="amountViewLabel=View Accumulate Amount" -->
							</th:block>
						</th:block>

						<th:block th:if="${params.key != 'dummyBusinessObject.amountViewOption'}">
							<c:param name="${params.key}" value="${params.value}" />
						</th:block>
					</th:block>
				</c:url>

				<a href="<c:out value='${amountViewSwitch}'/>">
					<c:out value='${amountViewLabel}'/>
				</a>
			</th:block>
			
			<br />
			<br />

			<th:block th:if="${!empty reqSearchResultsSize }">
	        
	        <display:table class="datatable-100" cellspacing="0"
				cellpadding="0" name="${reqSearchResults}" id="row"
				export="true" pagesize="100" defaultsort="1" decorator="org.kuali.kfs.gl.businessobject.inquiry.BalanceInquiryTableDecorator"
				requestURI="glBalanceInquiry.do?methodToCall=viewResults&reqSearchResultsSize=${reqSearchResultsSize}&searchResultKey=${searchResultKey}">
				
				<!-- th:with="columnLength=${fn:length(row.columns)-13}" -->
				<th:block th:each="column,status : ${row.columns}">

					<th:block th:if="${!empty column.columnAnchor.title}">
						<!-- th:with="title=${column.columnAnchor.title}" -->
					</th:block>
					<th:block th:if="${empty column.columnAnchor.title}">
						<!-- th:with="title=${column.propertyValue}" -->
					</th:block>
					
							<th:block th:switch="${true}">
		
								<th:block th:case="${column.formatter.implementationClass == 'org.kuali.rice.core.web.format.CurrencyFormatter'}">
		
									<display:column class="numbercell" sortable="true" media="${(status.index < columnLength) ? 'all' : 'csv excel xml'}"
										decorator="org.kuali.rice.kns.web.ui.FormatAwareDecorator"
										title="${column.columnTitle}" comparator="${column.comparator}">
																				
										<th:block th:switch="${true}">
		
											<th:block th:case="${column.propertyURL != \"\"}">
													<a href="<span th:text="${column.propertyURL}"></span>" title="<span th:text="${column.columnAnchor.title}"></span>"
														target="blank"><span th:text="${column.propertyValue}"></span></a>	
											</th:block>
											
											<th:block th:case="*"><span th:text="${column.propertyValue}"></span></th:block>
											
										</th:block>
										
									</display:column>
		
								</th:block>
		
								<th:block th:case="*">
		
									<th:block th:switch="${true}">
		
										<th:block th:case="${column.propertyURL != \"\"}">
		
											<display:column class="infocell" sortable="${column.sortable}"
												decorator="org.kuali.rice.kns.web.ui.FormatAwareDecorator"
												title="${column.columnTitle}" media="${(status.index < columnLength) ? 'all' : 'csv excel xml'}"
												comparator="${column.comparator}">
		
												<a href="<span th:text="${column.propertyURL}"></span>" title="<span th:text="${column.columnAnchor.title}"></span>"
													target="blank"><span th:text="${column.propertyValue}"></span></a>
		
											</display:column>
										
										</th:block>
										
										<th:block th:case="*">
											
											<display:column class="infocell" sortable="${column.sortable}"
												decorator="org.kuali.rice.kns.web.ui.FormatAwareDecorator"
												title="${column.columnTitle}" media="${(status.index < columnLength) ? 'all' : 'csv excel xml'}"
												comparator="${column.comparator}">
												
												<th:block th:if="${column.columnTitle == 'Project Code'}">
													<div style="white-space: nowrap"><span th:text="${column.propertyValue}"></span></div>
												</th:block>
												
												<th:block th:if="${column.columnTitle != 'Project Code'}">
													<span th:text="${column.propertyValue}"></span>
												</th:block>
		
											</display:column>
		
										</th:block>
		
									</th:block>
		
								</th:block>
		
							</th:block>	
				</th:block>
				
			</display:table>
			</td>
			</th:block>
			<td width="1%"><img src="${ConfigProperties.kr.externalizable.images.url}pixel_clear.gif" alt="" height="20"
				width="20"></td>
		</tr>
	</table>
</div>
</div>
</div>
</body>
</html>
