<!-- Thymeleaf template converted from JSP: gl/BalanceInquiryLookup.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">gl/BalanceInquiryLookup</title>
</head>
<body>
<%--NOTE: DO NOT FORMAT THIS FILE, DISPLAY:COLUMN WILL NOT WORK CORRECTLY IF IT CONTAINS LINE BREAKS --%>

<div class="kfs-page" data-header-title="Lookup" data-doc-title="">
  <form action="glBalanceInquiryLookup.do" method="post">

  <SCRIPT type="text/javascript">
    var kualiForm = document.forms['KualiForm'];
    var kualiElements = kualiForm.elements;
  </SCRIPT>

	<div class="headerarea-small" id="headerarea-small">
	<h1><span th:text="${KualiForm.lookupable.title}"></span><span class="kfs-help" th:replace="~{fragments/kul/help :: content}"></span></h1>
	</div>
	<kul:enterKey methodToCall="search" />

	<html-el:hidden name="KualiForm" property="backLocation" />
	<html-el:hidden name="KualiForm" property="formKey" />
	<html-el:hidden name="KualiForm" property="lookupableImplServiceName" />
	<html-el:hidden name="KualiForm" property="businessObjectClassName" />
	<html-el:hidden name="KualiForm" property="conversionFields" />
	<html-el:hidden name="KualiForm" property="hideReturnLink" />
	<html-el:hidden name="KualiForm" property="suppressActions" />
	<html-el:hidden name="KualiForm" property="extraButtonSource" />
	<html-el:hidden name="KualiForm" property="extraButtonParams" />
	<html-el:hidden name="KualiForm" property="multipleValues" />
	<html-el:hidden name="KualiForm" property="lookupAnchor" />
	<html-el:hidden name="KualiForm" property="readOnlyFields" />
	<html-el:hidden name="KualiForm" property="lookupResultsSequenceNumber" />
	<html-el:hidden name="KualiForm" property="lookedUpCollectionName" />
	<html-el:hidden name="KualiForm" property="viewedPageNumber" />
	<html-el:hidden name="KualiForm" property="resultsActualSize" />
	<html-el:hidden name="KualiForm" property="resultsLimitedSize" />

	<div class="kfs-errors" data-key-match="*" th:if="${#fields.hasErrors('*')}"><h4>Errors found in Search Criteria:</h4></div>
	<div th:replace="~{fragments/kul/messages :: content}"></div>

	<table width="100%">
		<tr>
			<td width="1%"><img src="${ConfigProperties.kr.externalizable.images.url}pixel_clear.gif" alt="" width="20"
				height="20"></td>
			<td>

			<div id="lookup" align="center"><br />
			<br />
			<table align="center" cellpadding=0 cellspacing=0 class="datatable-100">
				<!--/*/ <th:block th:with="FormName=KualiForm"> /*/-->
				<!--/*/ <th:block th:with="FieldRows=${KualiForm.lookupable.rows}"> /*/-->
				<!--/*/ <th:block th:with="ActionName=Lookup.do"> /*/-->
				<!--/*/ <th:block th:with="IsLookupDisplay=true"> /*/-->
				<!--/*/ <th:block th:with="cellWidth=50%"> /*/-->

                <div class="kfs-row-display"></div>

				<tr align=center>
					<td height="30" colspan=2 class="infoline"><input type="image" property="methodToCall.search" value="search"
							src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_search.gif" styleClass="tinybutton"
						alt="search" title="search" border="0" /> <input type="image" property="methodToCall.clearValues" value="clearValues"
							src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_clear.gif" styleClass="tinybutton"
						alt="clear" title="clear" border="0" /> <th:block th:if="${KualiForm.formKey!=''}">
						<a
							href='<span th:text="${KualiForm.backLocation}?methodToCall=refresh&docFormKey=${KualiForm.formKey}&anchor=${KualiForm.lookupAnchor}"></span>'  title="cancel">
						<img src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_cancel.gif" class="tinybutton" alt="cancel" title="cancel" 
							border="0" /></a>
					</th:block> <!-- Optional extra button --> <th:block th:if="${! empty KualiForm.extraButtonSource && extraButtonSource != ''}">
						<a
							href='<span th:text="${KualiForm.backLocation}?methodToCall=refresh&refreshCaller=kualiLookupable&docFormKey=${KualiForm.formKey}&anchor=${KualiForm.lookupAnchor}"></span><span th:text="${KualiForm.extraButtonParams}"></span>'>
						<img src='<span th:text="${KualiForm.extraButtonSource}"></span>'
							class="tinybutton" border="0" /></a>
					</th:block>
				 	   <input type="image" tabindex="${tabindex}" property="methodToCall.prepareToReturnSelectedResults"
   						src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_retselected.gif" alt="Return selected results" title="Return selected results" border="0" styleClass="tinybutton"/>
					</td>
				</tr>
			</table>
			</div>

			<br>
			<br>
            <div th:replace="~{fragments/gl/balanceInquiryLookupResults :: content}" data-results-list="${requestScope.reqSearchResults}"></div>
			</td>
			<td width="1%"><img src="${ConfigProperties.kr.externalizable.images.url}pixel_clear.gif" alt="" width="20"
				height="20"></td>
		</tr>
	</table>
  </form>
</div>
</body>
</html>
