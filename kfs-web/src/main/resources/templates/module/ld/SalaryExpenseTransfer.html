<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Salary Expense Transfer</title>
</head>
<body>
<div layout:fragment="content">
<!-- th:with="balanceInquiryAttributes=${DataDictionary.LedgerBalanceForBenefitExpenseTransfer.attributes}" -->
	
<!-- th:with="readOnly=${!KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT] || !KualiForm.editingMode['ledgerBalanceImporting']}" -->

<!-- th:with="documentTypeName=SalaryExpenseTransferDocument" -->
<!-- th:with="htmlFormAction=laborSalaryExpenseTransfer" -->

<th:block th:if="${isYearEnd}">
  <!-- th:with="documentTypeName=YearEndSalaryExpenseTransferDocument" -->
  <!-- th:with="htmlFormAction=laborYearEndSalaryExpenseTransfer" -->
</th:block>

<div class="document-page" data-document-type="${documentTypeName}" data-form-action="${htmlFormAction}" data-show-document-info="true">
<form th:action="@{${htmlFormAction}}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">

    <input type="hidden" th:field="*{financialBalanceTypeCode}" />
    
    <div th:replace="~{fragments/documentOverview :: documentOverview(${{KualiForm.editingMode}})}"></div>
 
	<div class="tab-container" th:data-tab-title="Ledger Balance Importing">
    <h3 th:text="Ledger Balance Importing">Ledger Balance Importing</h3>
		<div class="tab-container" align=center>
		<h3>Ledger Balance Importing</h3>
		<table cellpadding="0" cellspacing="0" class="datatable"
			summary="Ledger Balance Importing">

			<tr>
				<kul:htmlAttributeHeaderCell
					attributeEntry="${balanceInquiryAttributes.universityFiscalYear}"
					horizontal="true" width="35%"  labelFor="universityFiscalYear" forceRequired="true"/>

				<td class="datacell-nowrap"><kul:htmlControlAttribute
					attributeEntry="${balanceInquiryAttributes.universityFiscalYear}"
					property="universityFiscalYear" forceRequired="true" readOnly="${readOnly}" /> 
					
					<th:block th:if="${!readOnly}">
					<!-- KULLAB-709 Force field conversions -->
						<kul:lookup	boClassName="org.kuali.kfs.sys.businessobject.SystemOptions"
						lookupParameters="universityFiscalYear:universityFiscalYear"
						fieldConversions="universityFiscalYear:universityFiscalYear"						
						fieldLabel="${balanceInquiryAttributes.universityFiscalYear.label}" />
					</th:block>
				</td>
			</tr>			

             <tr>
               <kul:htmlAttributeHeaderCell
                   attributeEntry="${DataDictionary.PersonImpl.attributes.employeeId}"
                   horizontal="true"
                   forceRequired="true" labelFor="document.emplid"
                   />
               <td>
                     <sys:employee userIdFieldName="document.emplid"
                                 userNameFieldName="document.user.name" 
                                 fieldConversions="employeeId:document.emplid"
                                 lookupParameters="document.emplid:employeeId,universityFiscalYear:universityFiscalYear"
                                 hasErrors="${hasErrors}"
                                 onblur="${onblur}"
                                 highlight="${addHighlighting}" readOnly="${readOnly}" >
                     </sys:employee>
               </td>
             </tr>
            
            <tr>
            	<td height="30" class="infoline">&nbsp;</td>
            	<td height="30" class="infoline">
            		<th:block th:if="${!readOnly}">
	                   <gl:balanceInquiryLookup
	                       boClassName="org.kuali.kfs.module.ld.businessobject.LedgerBalanceForSalaryExpenseTransfer"
	                       actionPath="glBalanceInquiryLookup.do"
	                       lookupParameters="universityFiscalYear:universityFiscalYear,document.emplid:emplid,financialBalanceTypeCode:financialBalanceTypeCode"
	                       tabindexOverride="KualiForm.currentTabIndex"
	                       hideReturnLink="false" image="buttonsmall_search.gif"/>
	                </th:block>
				</td>
			</tr>
		</table>
		</div>
	</div>
	
	<div class="tab-container" th:data-tab-title="Accounting Lines">
    <h3 th:text="Accounting Lines">Accounting Lines</h3>			
		<sys-java:accountingLines>
			<sys-java:accountingLineGroup collectionPropertyName="document.sourceAccountingLines" collectionItemPropertyName="document.sourceAccountingLine"	attributeGroupName="source" />
	       	<sys-java:accountingLineGroup collectionPropertyName="document.targetAccountingLines" collectionItemPropertyName="document.targetAccountingLine" attributeGroupName="target" />
		</sys-java:accountingLines>
	</div>
	
	<div th:replace="~{fragments/ld/errorCertification :: errorCertification}"></div>
	     
	<div th:replace="~{fragments/ld/laborLedgerPendingEntries :: laborLedgerPendingEntries}"></div>
    <div th:replace="~{fragments/notes :: notes}"></div>
    <div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>
    <div th:replace="~{fragments/routeLog :: routeLog}"></div>
    <div th:replace="~{fragments/superUserActions :: superUserActions}"></div>
    <div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
    <div th:replace="~{fragments/documentControls :: documentControls(${documentEntry.transactionalDocument}, ${KualiForm.extraButtons})}"></div>
</div>
</div>
</div>
</body>
</html>
