<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Fringe Benefit Inquiry</title>
</head>
<body>
<div layout:fragment="content">
<!-- th:with="benefitInq=${DataDictionary.BenefitInquiry.attributes}" -->

<div class="kfs-page" data-header-title="Fringe Benefit Inquiry" data-doc-title="Fringe Benefit Inquiry">
<h1>Fringe Benefit Inquiry</h1>
<form th:action="@{fringeBenefitInquiry}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="page-body">
	<kul:tabTop tabTitle="Fringe Benefit Detail" defaultOpen="true">
        <div id="workarea">
          <table cellpadding="0" cellspacing="0" class="datatable" summary="" width="50%">
            <tr>
              <kul:htmlAttributeHeaderCell literalLabel="Object Code" scope="col"/>
              <kul:htmlAttributeHeaderCell literalLabel="Amount" scope="col" />
            </tr>

            <logic:iterate name="KualiForm" id="benefitInquiry" property="benefitInquiry" indexId="ctr">
              <tr>
                 <td>
                 <bean:write name="benefitInquiry" property="fringeBenefitObjectCode" />
                </td>
                <td>
                  <bean:write name="benefitInquiry" property="benefitAmount" />
                </td>
              </tr>
            </logic:iterate>
          </table>
        </div>
        <div id="globalbuttons" class="globalbuttons">
	    <input type="image" th:src="@{${ConfigProperties.kr.externalizable.images.url}buttonsmall_close.gif}" styleClass="globalbuttons" 
	        onclick="window.close();return false;" title="close the window" alt="close the window"/>		
		</div>
      </kul:tabTop>
	    
</div>
</div>
</div>
</body>
</html>
