<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Journal Voucher</title>
</head>
<body>
<div layout:fragment="content">
<!-- th:with="journalVoucherAttributes=${DataDictionary.LaborJournalVoucherDocument.attributes}" -->	
<!-- th:with="readOnly=${empty KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}" -->

<div class="document-page" data-document-type="LaborJournalVoucherDocument" data-form-action="laborJournalVoucher" data-show-document-info="true">
<form th:action="@{laborJournalVoucher}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">

	<div th:replace="~{fragments/documentOverview :: documentOverview(${{KualiForm.editingMode}})}"></div>

	<!-- LABOR JOURNAL VOUCHER SPECIFIC FIELDS -->
	<div class="tab-container" th:data-tab-title="Labor Distribution Journal Voucher Details">
    <h3 th:text="Labor Distribution Journal Voucher Details">Labor Distribution Journal Voucher Details</h3>
		<div class="tab-container" align="center">
		<h3>Labor Distribution Journal Voucher Details</h3>
		
		<table cellpadding=0 class="datatable" summary="Labor Distribution Journal Voucher Details">
			<tbody>
				<tr>
					<th width="35%" class="bord-l-b">
					<div align="right"><kul:htmlAttributeLabel
						labelFor="selectedAccountingPeriod" attributeEntry="${journalVoucherAttributes.accountingPeriod}"
						useShortLabel="false" /></div>
					</th>
					<td class="datacell-nowrap">
						<th:block th:if="${readOnly}">
                        	${KualiForm.accountingPeriod.universityFiscalPeriodName}
						</th:block> 
					<th:block th:if="${!readOnly}">
						<SCRIPT type="text/javascript">
						<!--
						    function submitForChangedAccountingPeriod() {
					    		document.forms[0].submit();
						    }
						//-->
						</SCRIPT>
						<select th:field="*{selectedAccountingPeriod}" onchange="submitForChangedAccountingPeriod()">
							<th:block th:each="accountingPeriod : ${KualiForm.accountingPeriods}">
								<!-- th:with="accountingPeriodCompositeValue=${accountingPeriod.universityFiscalPeriodCode}${accountingPeriod.universityFiscalYear}" -->
								<option value="${accountingPeriodCompositeValue}" th:text="${accountingPeriod.universityFiscalPeriodName}">${accountingPeriod.universityFiscalPeriodName}</option>
							</th:block>
						</select>
						
						<NOSCRIPT><input type="submit" value="refresh"
							title="press this button to refresh the page after changing the accounting period" alt="press this button to refresh the page after changing the accounting period" />
						</NOSCRIPT>
					</th:block></td>
				</tr>
				<tr>
					<th width="35%" class="bord-l-b">
					<div align="right"><kul:htmlAttributeLabel
						labelFor="" attributeEntry="${journalVoucherAttributes.balanceTypeCode}"
						useShortLabel="false" /></div>
					</th>
					<td class="datacell-nowrap">
					<th:block th:if="${readOnly}">
                        ${KualiForm.selectedBalanceType.financialBalanceTypeName}
					</th:block> 
					
					<th:block th:if="${!readOnly}">
						<SCRIPT type="text/javascript">
						<!--
						    function submitForChangedBalanceType() {
					    		document.forms[0].submit();
						    }
						//-->
						</SCRIPT>
						<select th:field="*{selectedBalanceType.code}" onchange="submitForChangedBalanceType()">
							<th:block th:each="balanceType : ${KualiForm.balanceTypes}">
								<html:option value="${balanceType.code}" >
									<span th:text="${balanceType.codeAndDescription}"></span> 
								</html:option>
							</th:block>
						</select>
						<NOSCRIPT>
							<input type="submit" value="refresh"
								title="press this button to refresh the page after changing the balance type" 
								alt="press this button to refresh the page after changing the balance type" />
						</NOSCRIPT>
						<kul:lookup
							boClassName="org.kuali.kfs.coa.businessobject.BalanceType"
							fieldConversions="code:selectedBalanceType.code"
							lookupParameters="selectedBalanceType.code:code" 
							fieldLabel="${journalVoucherAttributes.balanceTypeCode.label}" />
					</th:block></td>
				</tr>
				<tr>
					<kul:htmlAttributeHeaderCell
						attributeEntry="${journalVoucherAttributes.offsetTypeCode}"
						horizontal="true" width="35%" />
					<td class="datacell-nowrap"><kul:htmlControlAttribute
						attributeEntry="${journalVoucherAttributes.offsetTypeCode}"
						property="document.offsetTypeCode"
						readOnly="${readOnly}"/></td>
				</tr>
			</tbody>
		</table>
		</div>
	</div>
	
	<!-- th:with="isEncumbrance=${KualiForm.isEncumbranceBalanceType}" -->
	<!-- th:with="isDebitCreditAmount=${KualiForm.selectedBalanceType.financialOffsetGenerationIndicator}" -->

	<th:block th:switch="${true}">
		<th:block th:case="${isEncumbrance && isDebitCreditAmount}">
			<!-- th:with="attributeGroupName=source-withDebitCreditEncumbrance" -->
		</th:block>
		<th:block th:case="${!isEncumbrance && isDebitCreditAmount}">
			<!-- th:with="attributeGroupName=source-withDebitCredit" -->
		</th:block>		
		<th:block th:case="${isEncumbrance && !isDebitCreditAmount}">
			<!-- th:with="attributeGroupName=source-withEncumbrance" -->
		</th:block>
		<th:block th:case="*">
			<!-- th:with="attributeGroupName=source" -->
		</th:block>
	</th:block>

	<div class="tab-container" th:data-tab-title="Accounting Lines">
    <h3 th:text="Accounting Lines">Accounting Lines</h3>
		<sys-java:accountingLines>
			<sys-java:accountingLineGroup newLinePropertyName="newSourceLine" collectionPropertyName="document.sourceAccountingLines" collectionItemPropertyName="document.sourceAccountingLine" attributeGroupName="${attributeGroupName}" />
		</sys-java:accountingLines>
	</div>
        		
	<div th:replace="~{fragments/ld/laborLedgerPendingEntries :: laborLedgerPendingEntries}"></div>
	<div th:replace="~{fragments/notes :: notes}"></div>
	<div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>
	<div th:replace="~{fragments/routeLog :: routeLog}"></div>
	<div th:replace="~{fragments/superUserActions :: superUserActions}"></div>
	<div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
	<div th:replace="~{fragments/documentControls :: documentControls(${documentEntry.transactionalDocument}, ${KualiForm.extraButtons})}"></div>
</div>
</div>
</div>
</body>
</html>
