<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />

<body>
<!--/*/ <th:block th:with="journalVoucherAttributes=${DataDictionary.LaborJournalVoucherDocument.attributes}"> /*/-->

<div class="kfs-document-page" data-document-type="LaborJournalVoucherDocument">
  <form action="laborJournalVoucher.do" method="post" enctype="multipart/form-data">

	<div th:replace="~{fragments/sys/documentOverview :: content}" data-editing-mode="${KualiForm.editingMode}"></div>

	<!-- LABOR JOURNAL VOUCHER SPECIFIC FIELDS -->
	<section class="kfs-tab" data-tab-title="Labor Distribution Journal Voucher Details" data-default-open="true">
  <h3>Labor Distribution Journal Voucher Details</h3>
		<div class="tab-container" align="center">
		<h3>Labor Distribution Journal Voucher Details</h3>
		
		<table cellpadding=0 class="datatable" summary="Labor Distribution Journal Voucher Details">
			<tbody>
				<tr>
					<th width="35%" class="bord-l-b">
					<div align="right"><label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${journalVoucherAttributes.accountingPeriod}"></label></div>
					</th>
					<td class="datacell-nowrap">
						<th:block th:if="${readOnly}">
                        	${KualiForm.accountingPeriod.universityFiscalPeriodName}
						</th:block> 
					<th:block th:if="${!readOnly}">
						<script type="text/javascript">
						    function submitForChangedAccountingPeriod() {
					    		document.forms[0].submit();
						    }
						</script>
						<select th:field="*{selectedAccountingPeriod}" onchange="submitForChangedAccountingPeriod()">
							<c:forEach items="${KualiForm.accountingPeriods}" var="accountingPeriod">
								<!--/*/ <th:block th:with="accountingPeriodCompositeValue=${accountingPeriod.universityFiscalPeriodCode}${accountingPeriod.universityFiscalYear}"> /*/-->
								<html:option value="${accountingPeriodCompositeValue}">${accountingPeriod.universityFiscalPeriodName}</html:option>
							</tr>
						</select>
						
						<NOSCRIPT><html:submit value="refresh"
							title="press this button to refresh the page after changing the accounting period" alt="press this button to refresh the page after changing the accounting period" />
						</NOSCRIPT>
					</th:block></td>
				</tr>
				<tr>
					<th width="35%" class="bord-l-b">
					<div align="right"><label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${journalVoucherAttributes.balanceTypeCode}"></label></div>
					</th>
					<td class="datacell-nowrap">
					<th:block th:if="${readOnly}">
                        ${KualiForm.selectedBalanceType.financialBalanceTypeName}
					</th:block> 
					
					<th:block th:if="${!readOnly}">
						<script type="text/javascript">
						    function submitForChangedBalanceType() {
					    		document.forms[0].submit();
						    }
						</script>
						<select th:field="*{selectedBalanceType.code}" onchange="submitForChangedBalanceType()">
							<c:forEach items="${KualiForm.balanceTypes}" var="balanceType">
								<html:option value="${balanceType.code}" >
									<span th:text="${balanceType.codeAndDescription}"></span> 
								</html:option>
							</tr>
						</select>
						<NOSCRIPT>
							<html:submit value="refresh"
								title="press this button to refresh the page after changing the balance type" 
								alt="press this button to refresh the page after changing the balance type" />
						</NOSCRIPT>
						<span class="kfs-lookup" data-bo-class="org.kuali.kfs.coa.businessobject.BalanceType" th:replace="~{fragments/kul/lookup :: content}"></span>
					</th:block></td>
				</tr>
				<tr>
					<th class="kfs-header-cell" data-attribute-entry-name="" data-attribute-entry="${journalVoucherAttributes.offsetTypeCode}"></th>
					<td class="datacell-nowrap"><input type="text" name="document.offsetTypeCode" th:field="*{document.offsetTypeCode}" data-attribute-entry="${journalVoucherAttributes.offsetTypeCode}" /></td>
				</tr>
			</tbody>
		</table>
		</div>
	</section>
	
	<!--/*/ <th:block th:with="isEncumbrance=${KualiForm.isEncumbranceBalanceType}"> /*/-->
	<!--/*/ <th:block th:with="isDebitCreditAmount=${KualiForm.selectedBalanceType.financialOffsetGenerationIndicator}"> /*/-->

	<th:block th:switch="${true}">
		<th:block th:case="${isEncumbrance && isDebitCreditAmount}">
			<!--/*/ <th:block th:with="attributeGroupName=source-withDebitCreditEncumbrance"> /*/-->
		</th:block>
		<th:block th:case="${!isEncumbrance && isDebitCreditAmount}">
			<!--/*/ <th:block th:with="attributeGroupName=source-withDebitCredit"> /*/-->
		</th:block>		
		<th:block th:case="${isEncumbrance && !isDebitCreditAmount}">
			<!--/*/ <th:block th:with="attributeGroupName=source-withEncumbrance"> /*/-->
		</th:block>
		<th:block th:case="*">
			<!--/*/ <th:block th:with="attributeGroupName=source"> /*/-->
		</th:block>
	</th:block>

	<section class="kfs-tab" data-tab-title="Accounting Lines" data-default-open="true">
  <h3>Accounting Lines</h3>
		<div class="kfs-sys-java-accountingLines" th:include="~{fragments/sys/java/accountingLines :: content}">
			<div th:replace="~{fragments/sys/java/accountingLineGroup :: content}" data-new-line-property-name="newSourceLine" data-collection-property-name="document.sourceAccountingLines" data-collection-item-property-name="document.sourceAccountingLine" data-attribute-group-name="${attributeGroupName}"></div>
		</div><!-- /kfs-sys-java-accountingLines -->
	</section>
        		
	<div th:replace="~{fragments/ld/laborLedgerPendingEntries :: content}"></div>
	<div th:replace="~{fragments/kul/notes :: content}"></div>
	<div th:replace="~{fragments/kul/adHocRecipients :: content}"></div>
	<div th:replace="~{fragments/kul/routeLog :: content}"></div>
	<div th:replace="~{fragments/kul/superUserActions :: content}"></div>
	<div class="kfs-panel-footer"></div>
	<div th:replace="~{fragments/sys/documentControls :: content}" data-transactional-document="true" data-extra-buttons="${KualiForm.extraButtons}"></div>
  </form>
</div>
</body>
</html>
