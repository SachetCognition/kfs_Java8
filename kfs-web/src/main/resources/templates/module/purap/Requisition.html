<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Requisition</title>
</head>
<body>
<div layout:fragment="content">
<!-- th:with="camsFullEntryMode=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT] && not empty KualiForm.editingMode['allowCapitalAssetEdit']}" -->

<div class="document-page" data-document-type="RequisitionDocument" data-form-action="purapRequisition" data-show-document-info="true">
<form th:action="@{purapRequisition}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">

    <!-- th:with="fullEntryMode=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT] && (empty KualiForm.editingMode['restrictFiscalEntry'])}" -->
 
	<sys:documentOverview editingMode="${KualiForm.editingMode}"
		includePostingYear="true"
        fiscalYearReadOnly="${not KualiForm.editingMode['allowPostingYearEntry']}"
        postingYearAttributes="${DataDictionary.RequisitionDocument.attributes}" >

    	<div th:replace="~{fragments/purap/purapDocumentDetail :: purapDocumentDetail}" th:with="documentAttributes=${DataDictionary.RequisitionDocument.attributes},detailSectionLabel='Requisition Detail',editableFundingSource='true',editableAccountDistributionMethod=${KualiForm.readOnlyAccountDistributionMethod}"></div>
    </sys:documentOverview>

    <div th:replace="~{fragments/purap/delivery :: delivery}" th:with="documentAttributes=${DataDictionary.RequisitionDocument.attributes},showDefaultBuildingOption='true'"></div>

    <div th:replace="~{fragments/purap/vendor :: vendor}" th:with="documentAttributes=${DataDictionary.RequisitionDocument.attributes},displayRequisitionFields='true'"></div>
 
    <div th:replace="~{fragments/purap/puritems :: puritems}" th:with="itemAttributes=${DataDictionary.RequisitionItem.attributes},accountingLineAttributes=${DataDictionary.RequisitionAccount.attributes},displayRequisitionFields='true'"></div>
    	
 	<div th:replace="~{fragments/purap/purCams :: purCams}" th:with="documentAttributes=${DataDictionary.RequisitionDocument.attributes},itemAttributes=${DataDictionary.RequisitionItem.attributes},camsItemAttributes=${DataDictionary.RequisitionCapitalAssetItem.attributes},camsSystemAttributes=${DataDictionary.RequisitionCapitalAssetSystem.attributes},camsAssetAttributes=${DataDictionary.RequisitionItemCapitalAsset.attributes},camsLocationAttributes=${DataDictionary.RequisitionCapitalAssetLocation.attributes},isRequisition='true',fullEntryMode=${camsFullEntryMode}"></div>

    <div th:replace="~{fragments/purap/paymentinfo :: paymentinfo}" th:with="documentAttributes=${DataDictionary.RequisitionDocument.attributes}"></div>

    <div th:replace="~{fragments/purap/additional :: additional}" th:with="documentAttributes=${DataDictionary.RequisitionDocument.attributes},displayRequisitionFields='true'"></div>
         
    <div th:replace="~{fragments/purap/summaryaccounts :: summaryaccounts}" th:with="itemAttributes=${DataDictionary.RequisitionItem.attributes},documentAttributes=${DataDictionary.SourceAccountingLine.attributes}"></div>

    <div th:replace="~{fragments/purap/customRelatedDocuments :: customRelatedDocuments}" th:with="documentAttributes=${DataDictionary.RelatedDocuments.attributes}"></div>
    
    <div th:replace="~{fragments/purap/customPaymentHistory :: customPaymentHistory}" th:with="documentAttributes=${DataDictionary.RelatedDocuments.attributes}"></div>
	     
	<div th:replace="~{fragments/notes :: notes}"></div>         

	<div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>

	<div th:replace="~{fragments/routeLog :: routeLog}"></div>

	<div th:replace="~{fragments/superUserActions :: superUserActions}"></div>

	<div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
	
	<!-- th:with="extraButtons=${KualiForm.extraButtons}" -->  	

	<div th:replace="~{fragments/documentControls :: documentControls(${documentEntry.transactionalDocument}, ${KualiForm.extraButtons})}"></div>

</div>
</div>
</div>
</body>
</html>
