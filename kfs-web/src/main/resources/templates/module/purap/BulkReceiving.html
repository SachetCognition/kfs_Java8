<!-- Thymeleaf template converted from JSP: module/purap/BulkReceiving.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/purap/BulkReceiving</title>
</head>
<body>
<div class="kfs-document-page" data-document-type="BulkReceivingDocument">
  <form action="purapBulkReceiving.do" method="post" enctype="multipart/form-data">

    <div th:replace="~{fragments/sys/hiddenDocumentFields :: content}" data-is-financial-document="false"></div>
    		     		
    <!--/*/ <th:block th:with="fullEntryMode=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}"> /*/-->
    
	<th:block th:if="${KualiForm.editingMode['displayInitTab']}"> 
    	<div th:replace="~{fragments/purap/bulkReceivingInit :: content}" data-document-attributes="${DataDictionary.BulkReceivingDocument.attributes}"></div>
	</th:block>

    <th:block th:switch="${true}">
	    <th:block th:case="${not empty KualiForm.document.purchaseOrderIdentifier}">    
	    	<!--/*/ <th:block th:with="isPOAvailable=true"> /*/-->
	    </th:block>
	    <th:block th:case="*">
	    	<!--/*/ <th:block th:with="isPOAvailable=false"> /*/-->
	    </th:block>
    </th:block>
    
   <th:block th:if="${not KualiForm.editingMode['displayInitTab']}">
	    <div th:replace="~{fragments/sys/documentOverview :: content}" data-editing-mode="${KualiForm.editingMode}"></div>
	
		 <div th:replace="~{fragments/purap/bulkReceivingVendor :: content}" data-document-attributes="${DataDictionary.BulkReceivingDocument.attributes}"></div> 
	
	    <div th:replace="~{fragments/purap/bulkReceivingDelivery :: content}" data-document-attributes="${DataDictionary.BulkReceivingDocument.attributes}" data-delivery-read-only="true"></div> 
		          	
	    <div th:replace="~{fragments/purap/relatedDocuments :: content}" data-document-attributes="${DataDictionary.RelatedDocuments.attributes}"></div>
	            
		<div th:replace="~{fragments/kul/notes :: content}"></div>
	
		<div th:replace="~{fragments/kul/adHocRecipients :: content}"></div>
		
	    <div th:replace="~{fragments/kul/routeLog :: content}"></div>
	    
	    <div th:replace="~{fragments/kul/superUserActions :: content}"></div>
	</th:block>
	    		
    <div class="kfs-panel-footer"></div>
	
    <!--/*/ <th:block th:with="extraButtons=${KualiForm.extraButtons}"> /*/-->  
  	
    <div th:replace="~{fragments/sys/documentControls :: content}" data-transactional-document="true" data-extra-buttons="${extraButtons}" data-suppress-routing-controls="${KualiForm.editingMode['displayInitTab']}"></div>
      
  </form>
</div>
</body>
</html>
