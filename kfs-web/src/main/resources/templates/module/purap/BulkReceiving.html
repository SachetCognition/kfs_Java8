<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Bulk Receiving</title>
</head>
<body>
<div layout:fragment="content">
<div class="document-page" data-document-type="BulkReceivingDocument" data-form-action="purapBulkReceiving" data-show-document-info="true">
<form th:action="@{purapBulkReceiving}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">

    <sys:hiddenDocumentFields isFinancialDocument="false" />
    		     		
    <!-- th:with="fullEntryMode=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}" -->
    
	<th:block th:if="${KualiForm.editingMode['displayInitTab']}"> 
    	<div th:replace="~{fragments/purap/bulkReceivingInit :: bulkReceivingInit}" th:with="documentAttributes=${DataDictionary.BulkReceivingDocument.attributes}"></div>
	</th:block>

    <th:block th:switch="${true}">
	    <th:block th:case="${not empty KualiForm.document.purchaseOrderIdentifier}">    
	    	<c:set var="isPOAvailable" value="true" scope="request" />
	    </th:block>
	    <th:block th:case="*">
	    	<c:set var="isPOAvailable" value="false" scope="request" />
	    </th:block>
    </th:block>
    
   <th:block th:if="${not KualiForm.editingMode['displayInitTab']}">
	    <div th:replace="~{fragments/documentOverview :: documentOverview(${{KualiForm.editingMode}})}"></div>
	
		 <div th:replace="~{fragments/purap/bulkReceivingVendor :: bulkReceivingVendor}" th:with="documentAttributes=${DataDictionary.BulkReceivingDocument.attributes}"></div> 
	
	    <div th:replace="~{fragments/purap/bulkReceivingDelivery :: bulkReceivingDelivery}" th:with="documentAttributes=${DataDictionary.BulkReceivingDocument.attributes},deliveryReadOnly='true'"></div> 
		          	
	    <div th:replace="~{fragments/purap/relatedDocuments :: relatedDocuments}" th:with="documentAttributes=${DataDictionary.RelatedDocuments.attributes}"></div>
	            
		<div th:replace="~{fragments/notes :: notes}"></div>
	
		<div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>
		
	    <div th:replace="~{fragments/routeLog :: routeLog}"></div>
	    
	    <div th:replace="~{fragments/superUserActions :: superUserActions}"></div>
	</th:block>
	    		
    <div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
	
    <!-- th:with="extraButtons=${KualiForm.extraButtons}" -->  
  	
    <div th:replace="~{fragments/documentControls :: documentControls(${documentEntry.transactionalDocument}, ${KualiForm.extraButtons})}"></div>
      
</div>
</div>
</div>
</body>
</html>
