<!-- Thymeleaf template converted from JSP: module/purap/LineItemReceiving.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/purap/LineItemReceiving</title>
</head>
<body>
<div class="kfs-document-page" data-document-type="LineItemReceivingDocument">
  <form action="purapLineItemReceiving.do" method="post" enctype="multipart/form-data">
    		     		
    <!--/*/ <th:block th:with="fullEntryMode=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}"> /*/-->
    
	<th:block th:if="${KualiForm.editingMode['displayInitTab']}"> 
    	<div th:replace="~{fragments/purap/receivingLineInit :: content}" data-document-attributes="${DataDictionary.LineItemReceivingDocument.attributes}"></div>
	</th:block>
    
    <th:block th:if="${not KualiForm.editingMode['displayInitTab']}">
	
	    <div th:replace="~{fragments/sys/documentOverview :: content}" data-editing-mode="${KualiForm.editingMode}"></div>
	
		<div th:replace="~{fragments/purap/receivingVendor :: content}" data-document-attributes="${DataDictionary.LineItemReceivingDocument.attributes}"></div>
	
		<div th:replace="~{fragments/purap/receivingLineItems :: content}" data-item-attributes="${DataDictionary.LineItemReceivingItem.attributes}"></div>
		
	    <div th:replace="~{fragments/purap/delivery :: content}" data-document-attributes="${DataDictionary.LineItemReceivingDocument.attributes}" data-delivery-read-only="true"></div>
		          	
	    <div th:replace="~{fragments/purap/relatedDocuments :: content}" data-document-attributes="${DataDictionary.RelatedDocuments.attributes}"></div>

	    <div th:replace="~{fragments/kul/notes :: content}"></div>
	    
	    <div th:replace="~{fragments/kul/adHocRecipients :: content}"></div>
	
	    <div th:replace="~{fragments/kul/routeLog :: content}"></div>
	    
	    <div th:replace="~{fragments/kul/superUserActions :: content}"></div>
	</th:block>
	    		
    <div class="kfs-panel-footer"></div>
	
    <!--/*/ <th:block th:with="extraButtons=${KualiForm.extraButtons}"> /*/-->  	
  	
    <div th:replace="~{fragments/sys/documentControls :: content}" data-transactional-document="true" data-extra-buttons="${extraButtons}" data-suppress-routing-controls="${KualiForm.editingMode['displayInitTab']}"></div>
      
  </form>
</div>
</body>
</html>
