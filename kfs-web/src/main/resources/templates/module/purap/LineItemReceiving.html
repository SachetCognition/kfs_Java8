<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Line Item Receiving</title>
</head>
<body>
<div layout:fragment="content">
<div class="document-page" data-document-type="LineItemReceivingDocument" data-form-action="purapLineItemReceiving" data-show-document-info="true">
<form th:action="@{purapLineItemReceiving}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">
    		     		
    <!-- th:with="fullEntryMode=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}" -->
    
	<th:block th:if="${KualiForm.editingMode['displayInitTab']}"> 
    	<div th:replace="~{fragments/purap/receivingLineInit :: receivingLineInit}" th:with="documentAttributes=${DataDictionary.LineItemReceivingDocument.attributes}"></div>
	</th:block>
    
    <th:block th:if="${not KualiForm.editingMode['displayInitTab']}">
	
	    <div th:replace="~{fragments/documentOverview :: documentOverview(${{KualiForm.editingMode}})}"></div>
	
		<div th:replace="~{fragments/purap/receivingVendor :: receivingVendor}" th:with="documentAttributes=${DataDictionary.LineItemReceivingDocument.attributes}"></div>
	
		<div th:replace="~{fragments/purap/receivingLineItems :: receivingLineItems}" th:with="itemAttributes=${DataDictionary.LineItemReceivingItem.attributes}"></div>
		
	    <div th:replace="~{fragments/purap/delivery :: delivery}" th:with="documentAttributes=${DataDictionary.LineItemReceivingDocument.attributes},deliveryReadOnly='true'"></div>
		          	
	    <div th:replace="~{fragments/purap/relatedDocuments :: relatedDocuments}" th:with="documentAttributes=${DataDictionary.RelatedDocuments.attributes}"></div>

	    <div th:replace="~{fragments/notes :: notes}"></div>
	    
	    <div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>
	
	    <div th:replace="~{fragments/routeLog :: routeLog}"></div>
	    
	    <div th:replace="~{fragments/superUserActions :: superUserActions}"></div>
	</th:block>
	    		
    <div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
	
    <!-- th:with="extraButtons=${KualiForm.extraButtons}" -->  	
  	
    <div th:replace="~{fragments/documentControls :: documentControls(${documentEntry.transactionalDocument}, ${KualiForm.extraButtons})}"></div>
      
</div>
</div>
</div>
</body>
</html>
