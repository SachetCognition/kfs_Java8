<!-- Thymeleaf template converted from JSP: module/purap/VendorCreditMemo.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/purap/VendorCreditMemo</title>
</head>
<body>
<div class="kfs-document-page" data-document-type="VendorCreditMemoDocument">
  <form action="purapVendorCreditMemo.do" method="post" enctype="multipart/form-data">

    <!--/*/ <th:block th:with="fullEntryMode=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}"> /*/-->
 
    <!--/*/ <th:block th:with="displayInitTab=${KualiForm.editingMode['displayInitTab']}"> /*/-->
                     
    <th:block th:if="${displayInitTab}"> 
    	<div th:replace="~{fragments/purap/creditMemoInit :: content}" data-document-attributes="${DataDictionary.VendorCreditMemoDocument.attributes}"></div> 
    	
    	<div class="kfs-panel-footer"></div>
    
	    <div align="right"><br><span th:text="#{message.creditMemo.initMessage}"></span></div><br>
	</th:block>
	
	<th:block th:if="${not displayInitTab}">
		<!--  Display hold message if payment is on hold -->
	    <th:block th:if="${KualiForm.document.holdIndicator}">	
		  <h4>This Credit Memo has been Held by <span th:text="${KualiForm.document.lastActionPerformedByPersonName}"></span></h4>		
	    </th:block>
	    
		<div th:replace="~{fragments/sys/documentOverview :: content}" data-editing-mode="${KualiForm.editingMode}" data-include-posting-year="true" data-fiscal-year-read-only="true" data-posting-year-attributes="${DataDictionary.VendorCreditMemoDocument.attributes}"></div>
	        
		<div th:replace="~{fragments/purap/vendor :: content}" data-document-attributes="${DataDictionary.VendorCreditMemoDocument.attributes}" data-display-purchase-order-fields="false" data-display-credit-memo-fields="true"></div>
	
		<div th:replace="~{fragments/purap/creditMemoInfo :: content}" data-document-attributes="${DataDictionary.VendorCreditMemoDocument.attributes}"></div>        

	  	<div th:replace="~{fragments/purap/paymentRequestProcessItems :: content}" data-document-attributes="${DataDictionary.VendorCreditMemoDocument.attributes}" data-item-attributes="${DataDictionary.CreditMemoItem.attributes}" data-accounting-line-attributes="${DataDictionary.CreditMemoAccount.attributes}" data-is-credit-memo="true"></div>
	  
	    <div th:replace="~{fragments/purap/summaryaccounts :: content}" data-item-attributes="${DataDictionary.CreditMemoItem.attributes}" data-document-attributes="${DataDictionary.SourceAccountingLine.attributes}"></div>  
    	    	
		<div th:replace="~{fragments/purap/customRelatedDocuments :: content}" data-document-attributes="${DataDictionary.RelatedDocuments.attributes}"></div>
           	
	    <div th:replace="~{fragments/purap/customPaymentHistory :: content}" data-document-attributes="${DataDictionary.RelatedDocuments.attributes}"></div>
	
	    <div th:replace="~{fragments/gl/generalLedgerPendingEntries :: content}"></div>
	    
		<kul:notes attachmentTypesValuesFinderClass="${documentEntry.attachmentTypesValuesFinderClass}" />
	    
	    <div th:replace="~{fragments/kul/adHocRecipients :: content}"></div>
	    
	    <div th:replace="~{fragments/kul/routeLog :: content}"></div>
	
		<div th:replace="~{fragments/kul/superUserActions :: content}"></div>
	
        <div class="kfs-panel-footer"></div>
	</th:block>
	
	<!--/*/ <th:block th:with="extraButtons=${KualiForm.extraButtons}"> /*/-->
	
  	<div th:replace="~{fragments/sys/documentControls :: content}" data-transactional-document="true" data-extra-buttons="${extraButtons}" data-suppress-routing-controls="${displayInitTab}"></div>
   
  </form>
</div>
</body>
</html>
