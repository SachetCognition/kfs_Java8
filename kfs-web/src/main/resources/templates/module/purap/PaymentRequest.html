<!-- Thymeleaf template converted from JSP: module/purap/PaymentRequest.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/purap/PaymentRequest</title>
</head>
<body>
<div class="kfs-document-page" data-document-type="PaymentRequestDocument">
  <form action="purapPaymentRequest.do" method="post" enctype="multipart/form-data">

    <!--/*/ <th:block th:with="fullEntryMode=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT] && (empty KualiForm.editingMode['restrictFiscalEntry'])}"> /*/-->
    <!--/*/ <th:block th:with="displayInitTab=${KualiForm.editingMode['displayInitTab']}"> /*/-->    
    <!--/*/ <th:block th:with="taxInfoViewable=${KualiForm.editingMode['taxInfoViewable']}"> /*/-->
    <!--/*/ <th:block th:with="taxAreaEditable=${KualiForm.editingMode['taxAreaEditable']}"> /*/-->

	<!--  Display hold message if payment is on hold -->
	<th:block th:if="${KualiForm.paymentRequestDocument.holdIndicator}">	
		<h4>This Payment Request has been Held by <span th:text="${KualiForm.paymentRequestDocument.lastActionPerformedByPersonName}"></span></h4>		
	</th:block>
	
	<th:block th:if="${KualiForm.paymentRequestDocument.paymentRequestedCancelIndicator}">	
		<h4>This Payment Request has been Requested for Cancel by <span th:text="${KualiForm.paymentRequestDocument.lastActionPerformedByPersonName}"></span></h4>		
	</th:block>
	
	<th:block th:if="${not KualiForm.editingMode['displayInitTab']}">
	    <div th:replace="~{fragments/sys/documentOverview :: content}" data-editing-mode="${KualiForm.editingMode}" data-include-posting-year="true" data-fiscal-year-read-only="true" data-posting-year-attributes="${DataDictionary.PaymentRequestDocument.attributes}" data-document-attributes="${DataDictionary.PaymentRequestDocument.attributes}" data-detail-section-label="Payment Request Detail" data-editable-account-distribution-method="${KualiForm.readOnlyAccountDistributionMethod}" data-payment-request="true"></div>
	    </div><!-- /sys:documentOverview -->
	</th:block>
    
    <th:block th:if="${KualiForm.editingMode['displayInitTab']}"> 
    	<div th:replace="~{fragments/purap/paymentRequestInit :: content}" data-document-attributes="${DataDictionary.PaymentRequestDocument.attributes}" data-display-payment-request-init-fields="true"></div>
	</th:block>
	
	<th:block th:if="${not KualiForm.editingMode['displayInitTab']}">
		<div th:replace="~{fragments/purap/vendor :: content}" data-document-attributes="${DataDictionary.PaymentRequestDocument.attributes}" data-display-purchase-order-fields="false" data-display-payment-request-fields="true"></div>
	
		<div th:replace="~{fragments/purap/paymentRequestInvoiceInfo :: content}" data-document-attributes="${DataDictionary.PaymentRequestDocument.attributes}" data-display-payment-request-invoice-info-fields="true"></div>        

	  	<th:block th:if="${taxInfoViewable || taxAreaEditable}">
		<div th:replace="~{fragments/purap/paymentRequestTaxInfo :: content}" data-document-attributes="${DataDictionary.PaymentRequestDocument.attributes}"></div>  
	  	</th:block>      

		<div th:replace="~{fragments/purap/paymentRequestProcessItems :: content}" data-document-attributes="${DataDictionary.PaymentRequestDocument.attributes}" data-item-attributes="${DataDictionary.PaymentRequestItem.attributes}" data-accounting-line-attributes="${DataDictionary.PaymentRequestAccount.attributes}"></div>
		   
	    <div th:replace="~{fragments/purap/summaryaccounts :: content}" data-item-attributes="${DataDictionary.PaymentRequestItem.attributes}" data-document-attributes="${DataDictionary.SourceAccountingLine.attributes}"></div>  
	
		<div th:replace="~{fragments/purap/customRelatedDocuments :: content}" data-document-attributes="${DataDictionary.RelatedDocuments.attributes}"></div>

	    <div th:replace="~{fragments/purap/customPaymentHistory :: content}" data-document-attributes="${DataDictionary.RelatedDocuments.attributes}"></div>
    	
        <div th:replace="~{fragments/gl/generalLedgerPendingEntries :: content}"></div>

		<kul:notes attachmentTypesValuesFinderClass="${DataDictionary.PaymentRequestDocument.attachmentTypesValuesFinderClass}" />
        
	    <div th:replace="~{fragments/kul/adHocRecipients :: content}"></div>
	    
	    <div th:replace="~{fragments/kul/routeLog :: content}"></div>
	    
    	<div th:replace="~{fragments/kul/superUserActions :: content}"></div>
	</th:block>
	
    <div class="kfs-panel-footer"></div>
	<!--/*/ <th:block th:with="extraButtons=${KualiForm.extraButtons}"> /*/-->
  	<div th:replace="~{fragments/sys/documentControls :: content}" data-transactional-document="true" data-extra-buttons="${extraButtons}" data-suppress-routing-controls="${KualiForm.editingMode['displayInitTab']}"></div>
   
  </form>
</div>
</body>
</html>
