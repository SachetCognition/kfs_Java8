<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Payment Request</title>
</head>
<body>
<div layout:fragment="content">
<div class="document-page" data-document-type="PaymentRequestDocument" data-form-action="purapPaymentRequest" data-show-document-info="true">
<form th:action="@{purapPaymentRequest}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">

    <!-- th:with="fullEntryMode=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT] && (empty KualiForm.editingMode['restrictFiscalEntry'])}" -->
    <c:set var="displayInitTab" value="${KualiForm.editingMode['displayInitTab']}" scope="request" />    
    <c:set var="taxInfoViewable" value="${KualiForm.editingMode['taxInfoViewable']}" scope="request" />
    <c:set var="taxAreaEditable" value="${KualiForm.editingMode['taxAreaEditable']}" scope="request" />

	<!--  Display hold message if payment is on hold -->
	<th:block th:if="${KualiForm.paymentRequestDocument.holdIndicator}">	
		<h4>This Payment Request has been Held by <span th:text="${KualiForm.paymentRequestDocument.lastActionPerformedByPersonName}"></span></h4>		
	</th:block>
	
	<th:block th:if="${KualiForm.paymentRequestDocument.paymentRequestedCancelIndicator}">	
		<h4>This Payment Request has been Requested for Cancel by <span th:text="${KualiForm.paymentRequestDocument.lastActionPerformedByPersonName}"></span></h4>		
	</th:block>
	
	<th:block th:if="${not KualiForm.editingMode['displayInitTab']}">
	    <sys:documentOverview editingMode="${KualiForm.editingMode}"
	        includePostingYear="true"
	        fiscalYearReadOnly="true"
	        postingYearAttributes="${DataDictionary.PaymentRequestDocument.attributes}" >
	        
	    	<div th:replace="~{fragments/purap/purapDocumentDetail :: purapDocumentDetail}" th:with="documentAttributes=${DataDictionary.PaymentRequestDocument.attributes},detailSectionLabel='Payment Request Detail',editableAccountDistributionMethod=${KualiForm.readOnlyAccountDistributionMethod},paymentRequest='true'"></div>
	    </sys:documentOverview>
	</th:block>
    
    <th:block th:if="${KualiForm.editingMode['displayInitTab']}"> 
    	<div th:replace="~{fragments/purap/paymentRequestInit :: paymentRequestInit}" th:with="documentAttributes=${DataDictionary.PaymentRequestDocument.attributes},displayPaymentRequestInitFields='true'"></div>
	</th:block>
	
	<th:block th:if="${not KualiForm.editingMode['displayInitTab']}">
		<div th:replace="~{fragments/purap/vendor :: vendor}" th:with="documentAttributes=${DataDictionary.PaymentRequestDocument.attributes},displayPurchaseOrderFields='false',displayPaymentRequestFields='true'"></div>
	
		<div th:replace="~{fragments/purap/paymentRequestInvoiceInfo :: paymentRequestInvoiceInfo}" th:with="documentAttributes=${DataDictionary.PaymentRequestDocument.attributes},displayPaymentRequestInvoiceInfoFields='true'"></div>        

	  	<th:block th:if="${taxInfoViewable || taxAreaEditable}">
		<div th:replace="~{fragments/purap/paymentRequestTaxInfo :: paymentRequestTaxInfo}" th:with="documentAttributes=${DataDictionary.PaymentRequestDocument.attributes}"></div>  
	  	</th:block>      

		<div th:replace="~{fragments/purap/paymentRequestProcessItems :: paymentRequestProcessItems}" th:with="documentAttributes=${DataDictionary.PaymentRequestDocument.attributes},itemAttributes=${DataDictionary.PaymentRequestItem.attributes},accountingLineAttributes=${DataDictionary.PaymentRequestAccount.attributes}"></div>
		   
	    <div th:replace="~{fragments/purap/summaryaccounts :: summaryaccounts}" th:with="itemAttributes=${DataDictionary.PaymentRequestItem.attributes},documentAttributes=${DataDictionary.SourceAccountingLine.attributes}"></div>  
	
		<div th:replace="~{fragments/purap/customRelatedDocuments :: customRelatedDocuments}" th:with="documentAttributes=${DataDictionary.RelatedDocuments.attributes}"></div>

	    <div th:replace="~{fragments/purap/customPaymentHistory :: customPaymentHistory}" th:with="documentAttributes=${DataDictionary.RelatedDocuments.attributes}"></div>
    	
        <div th:replace="~{fragments/generalLedgerPendingEntries :: glpe}"></div>

		<kul:notes attachmentTypesValuesFinderClass="${DataDictionary.PaymentRequestDocument.attachmentTypesValuesFinderClass}" />
        
	    <div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>
	    
	    <div th:replace="~{fragments/routeLog :: routeLog}"></div>
	    
    	<div th:replace="~{fragments/superUserActions :: superUserActions}"></div>
	</th:block>
	
    <div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
	<!-- th:with="extraButtons=${KualiForm.extraButtons}" -->
  	<div th:replace="~{fragments/documentControls :: documentControls(${documentEntry.transactionalDocument}, ${KualiForm.extraButtons})}"></div>
   
</div>
</div>
</div>
</body>
</html>
