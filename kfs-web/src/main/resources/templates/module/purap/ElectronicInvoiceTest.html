<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/purap/ElectronicInvoiceTest</title>
</head>
<body>
<div class="kfs-page" data-header-title="Electronic Invoice Test File Generation" data-doc-title="">
  <form action="purapElectronicInvoiceTestFileGeneration.do" method="post">
	
	<strong><h2>	
	  Electronic Invoice Test File Generation
	</h2></strong>
	</br>
	
	<table width="100%" border="0"><tr><td>	
	  <div class="kfs-errors" data-key-match="*" th:if="${#fields.hasErrors('*')}"><h4>Errors Found In File:</h4></div>
	</td></tr></table>  
	</br>
		
	<section class="kfs-tab" data-tab-title="Manage Batch Files" data-default-open="true">
  <h3>Manage Batch Files</h3>
      <div class="tab-container" align="center">
          <h3>Generate Test File</h3>
          <table width="100%" summary="" cellpadding="0" cellspacing="0">
            <tr>
              <th width="300">&nbsp;</th>
              <th> <div align="left"><label for="poDocNumber">Purchase Order Document Number</label></div></th>
              <th width="150"> <div align="center">Actions</div></th>
            </tr>
            
            <tr>
              <th scope="row"><div align="center">Generate eInvoice test file for PO:</div></th>
              <td class="infoline"><input type="text" name="poDocNumber" size="10" />
				<span class="fineprint"></span> 
			  </td>
              <td class="infoline"><div align="center">
				<input type="image" src="${ConfigProperties.externalizable.images.url}tinybutton-generate.gif" styleClass="globalbuttons" property="methodToCall.generate" title="Generate Test File" alt="Generate Test File" />
              </td>
            </tr>
         </table>
      </div>
	</section>
	
	<div class="kfs-panel-footer"></div>		
  </form>
</div>
</body>
</html>
