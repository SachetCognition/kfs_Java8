<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Monthly Budget</title>
</head>
<body>
<div layout:fragment="content">
<!-- th:with="budgetConstructionMonthlyAttributes=${DataDictionary['BudgetConstructionMonthly'].attributes}" -->

<div class="kfs-page" data-header-title="" data-doc-title="BC Monthly">
<h1></h1>
<form th:action="@{budgetMonthlyBudget}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="page-body">

    <input type="hidden" th:field="*{mainWindow}" />

    <!-- th:with="readOnly=${KualiForm.monthlyReadOnly}" -->

    <div th:replace="~{fragments/bc/monthlyBudget :: monthlyBudget}" th:with="readOnly=${readOnly}"></div>
	<div th:replace="~{fragments/panelFooter :: panelFooter}"></div>

    <div id="globalbuttons" class="globalbuttons">
        <th:block th:if="${!readOnly}">
	        <input type="image" th:src="@{${ConfigProperties.kr.externalizable.images.url}buttonsmall_save.gif}" styleClass="globalbuttons" property="methodToCall.save" title="save" alt="save"/>
	    </th:block>
        <input type="image" th:src="@{${ConfigProperties.kr.externalizable.images.url}buttonsmall_close.gif}" styleClass="globalbuttons" property="methodToCall.close" title="close" alt="close"/>
    </div>

</div>
</div>
</div>
</body>
</html>
