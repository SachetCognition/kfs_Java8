<!-- Thymeleaf template converted from JSP: module/bc/OrganizationReportSelection.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/bc/OrganizationReportSelection</title>
</head>
<body>
<div class="kfs-page" data-header-title="" data-doc-title="${KualiForm.operatingModeTitle}">
  <form action="budgetOrganizationReportSelection.do" method="post">

	<html-el:hidden name="KualiForm" property="universityFiscalYear" />
	<html-el:hidden name="KualiForm" property="backLocation" />
	<html-el:hidden name="KualiForm" property="returnAnchor" />
	<html-el:hidden name="KualiForm" property="returnFormKey" />
	<html-el:hidden name="KualiForm" property="reportMode" />
	<html-el:hidden name="KualiForm" property="reportConsolidation" />
	<html-el:hidden name="KualiForm" property="operatingModeTitle" />
	<html-el:hidden name="KualiForm" property="budgetConstructionReportThresholdSettings.lockThreshold" />
	
    <div class="kfs-errors" data-key-match="${BCConstants.ErrorKey.ORGANIZATION_REPORTS_SELECTION_ERRORS}" th:if="${#fields.hasErrors('${BCConstants.ErrorKey.ORGANIZATION_REPORTS_SELECTION_ERRORS}')}"><h4>Errors found on Page:</h4></div>
    <div th:replace="~{fragments/kul/messages :: content}"></div>
    
    <html:hidden property="operatingModeTitle" value="${KualiForm.operatingModeTitle}" />
    
    <th:block th:if="${KualiForm.operatingModeTitle eq BCConstants.Report.SUB_FUND_SELECTION_TITLE}">
       <div th:replace="~{fragments/bc/subFundPick :: content}"></div>
    </th:block>
       
    <th:block th:if="${KualiForm.operatingModeTitle eq BCConstants.Report.OBJECT_CODE_SELECTION_TITLE}">
      <div th:replace="~{fragments/bc/objectCodePick :: content}"></div>
    </th:block>
       
    <th:block th:if="${KualiForm.operatingModeTitle eq BCConstants.Report.REASON_CODE_SELECTION_TITLE}">
      <div th:replace="~{fragments/bc/reasonCodePick :: content}"></div>
    </th:block>

  </form>
</div>
</body>
</html>
