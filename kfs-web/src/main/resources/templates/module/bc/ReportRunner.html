<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Report Runner</title>
</head>
<body>
<div layout:fragment="content">
<div class="kfs-page" data-header-title="" data-doc-title="Document Reports and Exports">
<h1></h1>
<form th:action="@{budgetReportRunner}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="page-body">
              <input type="hidden" th:field="*{returnAnchor}" />
              <input type="hidden" th:field="*{returnFormKey}" />
              <html-el:hidden name="KualiForm" property="backLocation" />
              <input type="hidden" th:field="*{documentNumber}" />
              <input type="hidden" th:field="*{universityFiscalYear}" />
              <input type="hidden" th:field="*{chartOfAccountsCode}" />
              <input type="hidden" th:field="*{accountNumber}" />
              <input type="hidden" th:field="*{subAccountNumber}" />
    <input type="hidden" th:field="*{mainWindow}" />
	
    <div th:replace="~{fragments/bc/budgetConstructionReportDumpLines :: budgetConstructionReportDumpLines}"></div>

	<div th:replace="~{fragments/panelFooter :: panelFooter}"></div>

    <div id="globalbuttons" class="globalbuttons">

        <input type="image" th:src="@{${ConfigProperties.kr.externalizable.images.url}buttonsmall_close.gif}" styleClass="globalbuttons" property="methodToCall.close" onclick="excludeSubmitRestriction=true" title="close" alt="close"/>
    </div>

</div>
</div>
</div>
</body>
</html>
