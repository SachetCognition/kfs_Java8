<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Asset Payments Lookup Link</title>
</head>
<body>
<div layout:fragment="content">
<!-- Make sure it isn't a fabrication -->
<th:block th:if="${T(org.kuali.rice.krad.util.KRADConstants).MAINTENANCE_NEW_ACTION != KualiForm.document.oldMaintainableObject.maintenanceAction}">
  <div th:replace="~{fragments/cams/assetPaymentsLookupLink :: assetPaymentsLookupLink}" th:with="capitalAssetNumber=${KualiForm.document.oldMaintainableObject.businessObject.capitalAssetNumber},isTransactionalDocument='false'"></div> 
</th:block>
</div>
</body>
</html>
