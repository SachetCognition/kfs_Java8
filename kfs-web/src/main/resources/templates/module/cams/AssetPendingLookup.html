<!-- Thymeleaf template converted from JSP: module/cams/AssetPendingLookup.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/cams/AssetPendingLookup</title>
</head>
<body>
<!--/*/ <th:block th:with="preqLockingList=${KualiForm.document.newMaintainableObject.preqLinks}"> /*/-->
<!--/*/ <th:block th:with="linkedDocumentNames=${KualiForm.document.newMaintainableObject.fpLinkedDocumentInfo}"> /*/-->
<!--/*/ <th:block th:with="fabricationOn=${KualiForm.document.newMaintainableObject.fabricationOn}"> /*/-->

<th:block th:if="${!fabricationOn }">
<section class="kfs-tab" data-tab-title="View Purchasing/Financial Asset Documents" data-default-open="false">
  <h3>View Purchasing/Financial Asset Documents</h3>
	<div class="tab-container" align=center>
		<table cellpadding="0" cellspacing="0" class="datatable" summary="view/edit pending entries">
    	<th:block th:if="${!empty linkedDocumentNames }">
			<tr th:each="fpLinkedDocumentInfo : ${KualiForm.document.newMaintainableObject.fpLinkedDocumentInfo}" indexId="ctr">
				<tr>
					<!--/*/ <th:block th:with="documentName=${fn:substringBefore(KualiForm.document.newMaintainableObject.fpLinkedDocumentInfo[ctr], '-')}"> /*/-->
					<!--/*/ <th:block th:with="documentNumber=${#strings.substringAfter(KualiForm.document.newMaintainableObject.fpLinkedDocumentInfo[ctr], '-')}"> /*/-->
					<td class="infoline" align="center">${documentName} - 
						<a href="${ConfigProperties.kew.url}/${KFSConstants.DOC_HANDLER_ACTION}?command=displayDocSearchView&docId=${documentNumber}"  target="_blank">
							${documentNumber}
						</a>&nbsp;
					</td>
				</tr>
			</tr>
		</th:block>
		</table>
		<br/>
		
		<table cellpadding="0" cellspacing="0" class="datatable" summary="view/edit pending entries">
		<th:block th:if="${!empty preqLockingList}">
			<tr th:each="preqLinks : ${KualiForm.document.newMaintainableObject.preqLinks}" indexId="ctr">
				<tr>
					<td class="infoline" align="center">Payment Request - 
						<a href="${ConfigProperties.kew.url}/${KFSConstants.DOC_HANDLER_ACTION}?command=displayDocSearchView&docId=${KualiForm.document.newMaintainableObject.preqLinks[ctr]}"  target="_blank">
							${KualiForm.document.newMaintainableObject.preqLinks[ctr]}
						</a>&nbsp;
					</td>
				</tr>
			</tr>
		</th:block>
		</table>
	</div>
</section>
</th:block>
</body>
</html>
