<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Card Application Question</title>
</head>
<body>
<div layout:fragment="content">
<div class="kfs-page" data-header-title="Card Application Question" data-doc-title="Card Application Question">
<h1>Card Application Question</h1>
<form th:action="@{tem*CardApplication}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="page-body">

	<input type="hidden" th:field="*{docTypeName}" />
<div>

	<br>
	<table width="100%" border=0 cellspacing=0 cellpadding=0>
		<html:messages id="msg" message="true">
			<tr>
				<td><bean:write filter="false" name="msg" /></td>
			</tr>
		</html:messages>
	</table>
	<br>
</div>
	<div id="globalbuttons" class="globalbuttons"><input type="image" th:src="@{${ConfigProperties.kr.externalizable.images.url}buttonsmall_Yes.gif}" styleClass="globalbuttons"
		property="methodToCall.openNew" alt="Create new Card Application" title="Create new Card Application" />
	&nbsp;&nbsp; <input type="image" th:src="@{${ConfigProperties.kr.externalizable.images.url}buttonsmall_No.gif}"
		styleClass="globalbuttons" property="methodToCall.returnToIndex"
		alt="Return to Index" title="Return to Index" /></div>

</div>
</div>
</div>
</body>
</html>
