<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>C T S Card Application Document</title>
</head>
<body>
<div layout:fragment="content">
<!-- th:with="documentAttributes=${DataDictionary.TemCTSCardApplicationDocument.attributes}" -->

<!-- th:with="documentTypeName=TemCTSCardApplicationDocument" -->
<c:set var="canEdit" value="${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}" scope="request" />

<c:set var="fullEntryMode" value="${KualiForm.editingMode['fullEntry']}" scope="request" />
<c:set var="documentTitle" value="" />
<div class="document-page" data-document-type="TemCTSCardApplicationDocument" data-form-action="temCTSCardApplication" data-show-document-info="true">
<form th:action="@{temCTSCardApplication}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">
    <div th:replace="~{fragments/documentOverview :: documentOverview(${{KualiForm.editingMode}})}"></div>
    <div th:replace="~{fragments/tem/profileTab :: profileTab}"></div>
    <div th:replace="~{fragments/tem/agreementTab :: agreementTab}" th:with="property='userAgreement',documentAttribute=${documentAttributes.userAgreement},text=${KualiForm.document.userAgreementText},title='User Agreement',enable=${KualiForm.initiator && canEdit},open=${KualiForm.initiator}"></div>
    <div class="tab-container" th:data-tab-title="Banking Information">
    <h3 th:text="Banking Information">Banking Information</h3>
    <div class="tab-container" align="center">
	    <table cellpadding=0 class="datatable" summary="Banking Information">
			<tr>
		    	<td colspan="2" class="tab-subhead">&nbsp;</td>
		    </tr>
		    <tr>
		    	<th scope=row class="bord-l-b">
		    		<div align="right">
		    			<label th:text="${documentAttributes.bankAppliedDate.label}"></label>
					</div>
				</th>
				<td class="datacell" width="50%">${KualiForm.document.bankAppliedDate }</td>
		    </tr>
		    <tr>
		    	<th scope=row class="bord-l-b">
		    		<div align="right">
		    			<label th:text="${documentAttributes.bankApprovedDate.label}"></label>
					</div>
				</th>
				<td class="datacell" width="50%">${KualiForm.document.bankApprovedDate }</td>
		    </tr>
	    </table>
    </div>
	
	</div>
    <div th:replace="~{fragments/notes :: notes}"></div>
	<div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>
	<div th:replace="~{fragments/routeLog :: routeLog}"></div>
	<div th:replace="~{fragments/superUserActions :: superUserActions}"></div>
	<div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
    <div th:replace="~{fragments/documentControls :: documentControls(${documentEntry.transactionalDocument}, ${KualiForm.extraButtons})}"></div>
</div>
</div>
</div>
</body>
</html>
