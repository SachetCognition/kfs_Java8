<!-- Thymeleaf template converted from JSP: module/tem/CTSCardApplicationDocument.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/tem/CTSCardApplicationDocument</title>
</head>
<body>
<!--/*/ <th:block th:with="documentAttributes=${DataDictionary.TemCTSCardApplicationDocument.attributes}"> /*/-->

<!--/*/ <th:block th:with="documentTypeName=TemCTSCardApplicationDocument"> /*/-->
<!--/*/ <th:block th:with="canEdit=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}"> /*/-->

<!--/*/ <th:block th:with="fullEntryMode=${KualiForm.editingMode['fullEntry']}"> /*/-->
<!--/*/ <th:block th:with="documentTitle="> /*/-->
<div class="kfs-document-page" data-document-type="TemCTSCardApplicationDocument">
  <form action="temCTSCardApplication.do" method="post" enctype="multipart/form-data">
    <div th:replace="~{fragments/sys/documentOverview :: content}" data-editing-mode="${KualiForm.editingMode}"></div>
    <div th:replace="~{fragments/tem/profileTab :: content}"></div>
    <div th:replace="~{fragments/tem/agreementTab :: content}" data-property="userAgreement" data-document-attribute="${documentAttributes.userAgreement}" data-text="${KualiForm.document.userAgreementText}" data-title="User Agreement" data-enable="${KualiForm.initiator && canEdit}" data-open="${KualiForm.initiator}"></div>
    <section class="kfs-tab" data-tab-title="Banking Information" data-default-open="true">
  <h3>Banking Information</h3>
    <div class="tab-container" align="center">
	    <table cellpadding=0 class="datatable" summary="Banking Information">
			<tr>
		    	<td colspan="2" class="tab-subhead">&nbsp;</td>
		    </tr>
		    <tr>
		    	<th scope=row class="bord-l-b">
		    		<div align="right">
		    			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${documentAttributes.bankAppliedDate}"></label>
					</div>
				</th>
				<td class="datacell" width="50%">${KualiForm.document.bankAppliedDate }</td>
		    </tr>
		    <tr>
		    	<th scope=row class="bord-l-b">
		    		<div align="right">
		    			<label class="kfs-label" data-attribute-entry-name="" data-attribute-entry="${documentAttributes.bankApprovedDate}"></label>
					</div>
				</th>
				<td class="datacell" width="50%">${KualiForm.document.bankApprovedDate }</td>
		    </tr>
	    </table>
    </div>
	
	</section>
    <div th:replace="~{fragments/kul/notes :: content}"></div>
	<div th:replace="~{fragments/kul/adHocRecipients :: content}"></div>
	<div th:replace="~{fragments/kul/routeLog :: content}"></div>
	<div th:replace="~{fragments/kul/superUserActions :: content}"></div>
	<div class="kfs-panel-footer"></div>
    <div th:replace="~{fragments/sys/documentControls :: content}" data-transactional-document="${documentEntry.transactionalDocument}" data-extra-buttons="${KualiForm.extraButtons}"></div>
  </form>
</div>
</body>
</html>
