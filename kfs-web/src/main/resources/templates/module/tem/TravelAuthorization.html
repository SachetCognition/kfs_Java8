<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Travel Authorization</title>
</head>
<body>
<div layout:fragment="content">
<c:set var="returnFromEmployeeLookup" value="${KualiForm.refreshCaller == 'travelerLookupable'}" scope="request" />
<c:set var="canEdit" value="${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}" scope="request" />
<c:set var="fullEntryMode" value="${KualiForm.editingMode['fullEntry']}" scope="request" />
<c:set var="advancePaymentMode" value="${KualiForm.editingMode['advancePaymentEntry']}" scope="request"/>
<c:set var="advancePolicyMode" value="${KualiForm.editingMode['advancePolicyEntry']}" scope="request"/>
<c:set var="expenseTaxableMode" value="${KualiForm.editingMode['expenseTaxableEntry']}" scope="request"/>
<c:set var="clearAdvanceMode" value="${KualiForm.editingMode['clearAdvanceMode']}" scope="request"/>
<c:set var="blanketTravelEntryMode" value="${KualiForm.editingMode['blanketTravelEntry']}" scope="request"/>
<c:set var="blanketTravelViewMode" value="${KualiForm.editingMode['blanketTravelView']}" scope="request"/>
<c:set var="conversionRateEntryMode" value="${KualiForm.editingMode['conversionRateEntry']}" scope="request"/>
<c:set var="frnEntryMode" value="${canEdit && KualiForm.editingMode['frnEntry']}" scope="request" />
<c:set var="wireEntryMode" value="${canEdit && KualiForm.editingMode['wireEntry']}" scope="request" />

<div class="document-page" data-document-type="${KualiForm.docTypeName}" data-form-action="temTravelAuthorization" data-show-document-info="true">
<form th:action="@{temTravelAuthorization}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">
    
<script language="javascript" src="dwr/interface/TravelDocumentService.js"></script> 
<script language="javascript" src="dwr/interface/TravelAuthorizationService.js"></script>     
<script language="javascript" src="dwr/interface/TravelExpenseService.js"></script> 
<script language="javascript" src="scripts/module/tem/common.js"></script>
<script language="javascript" src="scripts/module/tem/objectInfo.js"></script>

    <sys:documentOverview editingMode="${KualiForm.editingMode}" includeBankCode="true"
	  bankProperty="document.financialDocumentBankCode" 
	  bankObjectProperty="document.bank"
	  disbursementOnly="true" />
	  
	<script type="text/javascript">
		function clearSpecialHandlingTab() {
		var prefix = "document.travelPayment.";
		var ctrl;
		
		ctrl = kualiElements[prefix + "specialHandlingCityName"]
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingLine1Addr"];
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingStateCode"];
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingLine2Addr"];
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingZipCode"];
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingCountryCode"];
		ctrl.value = "";
	   }
	</script>
	<sys:paymentMessages />
 
    <div th:replace="~{fragments/tem_ta/tripOverview :: tripOverview}"></div>
	<th:block th:if="${KualiForm.docTypeName!=TemConstants.TravelDocTypes.TRAVEL_AUTHORIZATION_CLOSE_DOCUMENT}"> 
		<div class="tab-container" th:data-tab-title="Travel Advance">
    <h3 th:text="Travel Advance">Travel Advance</h3>
			<div class="tab-container" align="left">
				<h3>Travel Advance</h3>
				<div th:replace="~{fragments/tem_ta/travelAdvance :: travelAdvance}" th:with="travelAdvanceProperty='document.travelAdvance'"></div>
				<div class="tab-container" th:data-tab-title="Travel Advance Accounting Lines">
    <h3 th:text="Travel Advance Accounting Lines">Travel Advance Accounting Lines</h3>
					<sys-java:accountingLines>
						<sys-java:accountingLineGroup newLinePropertyName="newAdvanceAccountingLine" collectionPropertyName="document.advanceAccountingLines" collectionItemPropertyName="document.advanceAccountingLine" attributeGroupName="advance" />
					</sys-java:accountingLines>
				</div>
				<div th:replace="~{fragments/tem/travelPayment :: travelPayment}" th:with="isForAdvance='true'"></div>
			</div>
		</div>
	</th:block>
	<th:block th:if="${KualiForm.showTravelAdvancesForTrip}">
		<div th:replace="~{fragments/tem/travelAdvances :: travelAdvances}" th:with="tabTitle='All Advances'"></div>
	</th:block>
    <th:block th:if="${KualiForm.editingMode['displayEmergencyContactTab']}">
	    <div th:replace="~{fragments/tem_ta/emergencyContact :: emergencyContact}"></div>
    </th:block>
    <div th:replace="~{fragments/tem/specialCircumstances :: specialCircumstances}"></div>
    <div th:replace="~{fragments/tem/groupTravel :: groupTravel}"></div>
    <th:block th:if="${not empty KualiForm.document.primaryDestinationName}"> 
    	<div th:replace="~{fragments/tem/perDiemExpenses :: perDiemExpenses}"></div>
    </th:block>
    <div th:replace="~{fragments/tem_ta/expenses :: expenses}"></div>
    <div th:replace="~{fragments/tem_ta/estimateTotal :: estimateTotal}"></div> 
    <th:block th:if="${KualiForm.displayAccountingLines}">
    	<div th:replace="~{fragments/tem/accountingLines :: accountingLines}"></div>
    </th:block>
	<th:block th:if="${KualiForm.advancePdpStatusTabShown}">
		<div th:replace="~{fragments/tem/travelPaymentPDPStatus :: travelPaymentPDPStatus}" th:with="travelPaymentProperty='advanceTravelPayment',pdpPaymentDocumentType=${KualiForm.document.travelAdvancePaymentDocumentType}"></div>
	</th:block>
    <div th:replace="~{fragments/generalLedgerPendingEntries :: glpe}"></div>
	<div th:replace="~{fragments/tem/relatedDocuments :: relatedDocuments}"></div>
	<div th:replace="~{fragments/tem/agencyLinks :: agencyLinks}"></div>
	
    <kul:notes attachmentTypesValuesFinderClass="${DataDictionary.TravelEntertainmentDocument.attachmentTypesValuesFinderClass}" />
    <div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>

    <div th:replace="~{fragments/routeLog :: routeLog}"></div>
	<div th:replace="~{fragments/superUserActions :: superUserActions}"></div>
    <div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
    
    <div th:replace="~{fragments/documentControls :: documentControls(${documentEntry.transactionalDocument}, ${KualiForm.extraButtons})}"></div>

<script>
	$(document).ready(function() {
		getAllStates();
	});
</script>
      
</div>
</div>
</div>
</body>
</html>
