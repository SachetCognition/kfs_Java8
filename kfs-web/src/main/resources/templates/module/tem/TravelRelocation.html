  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/tem/TravelRelocation</title>
</head>
<body>

<div class="kfs-document-page" data-document-type="RELO">
  <form action="temTravelRelocation.do" method="post" enctype="multipart/form-data">
	
	<script language="javascript" src="dwr/interface/TravelExpenseService.js"></script>
	<script language="javascript" src="scripts/module/tem/common.js"></script>
	<script language="javascript" src="scripts/module/tem/objectInfo.js"></script>
       
    <div th:replace="~{fragments/sys/documentOverview :: content}" data-editing-mode="${KualiForm.editingMode}" data-include-bank-code="true" data-bank-property="document.financialDocumentBankCode" data-bank-object-property="document.bank" data-disbursement-only="true"></div>
    <th:block th:if="${showReports}">
    	<div th:replace="~{fragments/tem/relo/reports :: content}"></div>
   	</th:block>
	
	<script type="text/javascript">
		function clearSpecialHandlingTab() {
		var prefix = "document.travelPayment.";
		var ctrl;
		
		ctrl = kualiElements[prefix + "specialHandlingCityName"]
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingLine1Addr"];
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingStateCode"];
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingLine2Addr"];
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingZipCode"];
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingCountryCode"];
		ctrl.value = "";
	   }
	</script>
	<div th:replace="~{fragments/sys/paymentMessages :: content}"></div>
	
    <div th:replace="~{fragments/tem/relo/movAndReloOverview :: content}"></div>
    <div th:replace="~{fragments/tem/specialCircumstances :: content}"></div>
    <div th:replace="~{fragments/tem/expenses :: content}"></div>
    <!-- TODO: Need to add importexpenses tab-->
    <div th:replace="~{fragments/tem/relo/expenseTotals :: content}"></div>
    <div th:replace="~{fragments/tem/summaryByObjectCode :: content}"></div>
    <div th:replace="~{fragments/tem/assignAccounts :: content}"></div>
     <th:block th:if="${KualiForm.displayAccountingLines}">
    	<div th:replace="~{fragments/tem/accountingLines :: content}"></div>
    </th:block>
	<div th:replace="~{fragments/tem/travelPayment :: content}"></div>
	<div th:replace="~{fragments/tem/travelPaymentPDPStatus :: content}" data-travel-payment-property="travelPayment" data-pdp-payment-document-type="${KualiForm.document.achCheckDocumentType}" data-display-corporate-card-extraction="${KualiForm.document.corporateCardPayable}"></div>
    <div th:replace="~{fragments/gl/generalLedgerPendingEntries :: content}"></div>
    <div th:replace="~{fragments/tem/relatedDocuments :: content}"></div>
	<div th:replace="~{fragments/tem/agencyLinks :: content}"></div>
    
    <kul:notes attachmentTypesValuesFinderClass="${DataDictionary.TravelRelocationDocument.attachmentTypesValuesFinderClass}" />

	<div th:replace="~{fragments/kul/adHocRecipients :: content}"></div>

    <div th:replace="~{fragments/kul/routeLog :: content}"></div>
	<div th:replace="~{fragments/kul/superUserActions :: content}"></div>
	<div class="kfs-panel-footer"></div>
	
	<div th:replace="~{fragments/sys/documentControls :: content}" data-transactional-document="${documentEntry.transactionalDocument}" data-extra-buttons="${KualiForm.extraButtons}"></div>
 
  </form>
</div>
