<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Travel Entertainment</title>
</head>
<body>
<div layout:fragment="content">
<c:set var="canEdit" value="${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}" scope="request" />
<c:set var="fullEntryMode" value="${KualiForm.editingMode['fullEntry']}" scope="request" />
<c:set var="advancePaymentMode" value="${KualiForm.editingMode['advancePaymentEntry']}" scope="request"/>
<c:set var="expenseTaxableMode" value="${KualiForm.editingMode['expenseTaxableEntry']}" scope="request"/>
<c:set var="conversionRateEntryMode" value="${KualiForm.editingMode['conversionRateEntry']}" scope="request"/>
<c:set var="frnEntryMode" value="${canEdit && KualiForm.editingMode['frnEntry']}" scope="request" />
<c:set var="wireEntryMode" value="${canEdit && KualiForm.editingMode['wireEntry']}" scope="request" />
<c:set var="lookupRequesterMode" value="${canEdit && KualiForm.editingMode['requesterLooupMode']}" scope="request" />

<div class="document-page" data-document-type="ENT" data-form-action="temTravelEntertainment" data-show-document-info="true">
<form th:action="@{temTravelEntertainment}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">
	
	<script language="javascript" src="dwr/interface/TravelDocumentService.js"></script>
	<script language="javascript" src="dwr/interface/TravelExpenseService.js"></script>
	<script language="javascript" src="scripts/module/tem/common.js"></script>
	<script language="javascript" src="scripts/module/tem/objectInfo.js"></script>
     
    <sys:documentOverview editingMode="${KualiForm.editingMode}" includeBankCode="true"
	  bankProperty="document.financialDocumentBankCode" bankObjectProperty="document.bank" disbursementOnly="true" />
    <div th:replace="~{fragments/tem_ent/reports :: reports}"></div>
	
	<script type="text/javascript">
		function clearSpecialHandlingTab() {
		var prefix = "document.travelPayment.";
		var ctrl;
		
		ctrl = kualiElements[prefix + "specialHandlingCityName"]
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingLine1Addr"];
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingStateCode"];
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingLine2Addr"];
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingZipCode"];
		ctrl.value = "";
		
		ctrl = kualiElements[prefix + "specialHandlingCountryCode"];
		ctrl.value = "";
	   }
	</script>
	<sys:paymentMessages />
	
    <div th:replace="~{fragments/tem_ent/entertainmentOverview :: entertainmentOverview}"></div>
    <div th:replace="~{fragments/tem_ent/attendees :: attendees}" th:with="attendeeAttributes=${DataDictionary.Attendee.attributes},entertainmentAttributes=${DataDictionary.TravelEntertainmentDocument.attributes}"></div>
    <div th:replace="~{fragments/tem/expenses :: expenses}"></div>
    <div th:replace="~{fragments/tem_ent/expenseTotals :: expenseTotals}"></div>
    <div th:replace="~{fragments/tem/specialCircumstances :: specialCircumstances}"></div>
    <div th:replace="~{fragments/tem/summaryByObjectCode :: summaryByObjectCode}"></div>
    <div th:replace="~{fragments/tem/assignAccounts :: assignAccounts}"></div>
     <th:block th:if="${KualiForm.displayAccountingLines}">
    	<div th:replace="~{fragments/tem/accountingLines :: accountingLines}"></div>
    </th:block>
   
	<div th:replace="~{fragments/tem/travelPayment :: travelPayment}"></div>
	<div th:replace="~{fragments/tem/travelPaymentPDPStatus :: travelPaymentPDPStatus}" th:with="travelPaymentProperty='travelPayment',pdpPaymentDocumentType=${KualiForm.document.achCheckDocumentType},displayCorporateCardExtraction=${KualiForm.document.corporateCardPayable}"></div>
    <div th:replace="~{fragments/generalLedgerPendingEntries :: glpe}"></div>
    <div th:replace="~{fragments/tem/relatedDocuments :: relatedDocuments}"></div>
	<div th:replace="~{fragments/tem/agencyLinks :: agencyLinks}"></div>
    
	<kul:notes attachmentTypesValuesFinderClass="${DataDictionary.TravelEntertainmentDocument.attachmentTypesValuesFinderClass}" />
	
 	<div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>

    <div th:replace="~{fragments/routeLog :: routeLog}"></div>
	<div th:replace="~{fragments/superUserActions :: superUserActions}"></div>
    <div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
         
    <div th:replace="~{fragments/documentControls :: documentControls(${documentEntry.transactionalDocument}, ${KualiForm.extraButtons})}"></div> 
<script>
	$(document).ready(function() {
		getAllStates();
	});
</script>
</div>
</div>
</div>
</body>
</html>
