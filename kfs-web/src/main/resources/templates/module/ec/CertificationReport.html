<div class="kfs-document-page" data-document-type="${documentTypeName}">
  <form action="effortCertificationReport.do" method="post" enctype="multipart/form-data">
	
	<div th:replace="~{fragments/sys/documentOverview :: content}" data-editing-mode="${KualiForm.editingMode}"></div>	
	
	<div th:replace="~{fragments/ec/reportInformation :: content}"></div>
	
    <!--/*/ <th:block th:with="hiddenFieldNames=effortCertificationDocumentCode,totalOriginalPayrollAmount"> /*/-->
	<c:forTokens var="fieldName" items="${hiddenFieldNames}" delims=",">	
		<input type="hidden" name="document.${fieldName}" id="document.${fieldName}" value="${KualiForm.document[fieldName]}"/>		  
	</c:forTokens>

	<!--/*/ <th:block th:with="canEdit=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}"> /*/-->
	<!--/*/ <th:block th:with="isSummaryTabEntry=${KualiForm.editingMode[EffortConstants.EffortCertificationEditMode.SUMMARY_TAB_ENTRY]}"> /*/-->
	
 	< c:if test="${canEdit && isSummaryTabEntry}" >
		<div th:replace="~{fragments/ec/summaryTab :: content}" data-accounts-can-cross-charts="${accountsCanCrossCharts}"></div>	
	</c:if >
	
	<!--/*/ <th:block th:with="isDetailTabEntry=${KualiForm.editingMode[EffortConstants.EffortCertificationEditMode.DETAIL_TAB_ENTRY]}"> /*/-->
	<div th:replace="~{fragments/ec/detailTab :: content}" data-is-open="${!isSummaryTabEntry}" data-is-editable="${canEdit && isDetailTabEntry && !isSummaryTabEntry}" data-accounts-can-cross-charts="${accountsCanCrossCharts}"></div>
	
	<div th:replace="~{fragments/kul/notes :: content}"></div>
	
	<div th:replace="~{fragments/kul/adHocRecipients :: content}"></div>
	
	<div th:replace="~{fragments/kul/routeLog :: content}"></div>
	
	<div th:replace="~{fragments/kul/superUserActions :: content}"></div>
	
	<div class="kfs-panel-footer"></div>
	
	<div th:replace="~{fragments/sys/documentControls :: content}" data-transactional-document="${document.transactionalDocument}"></div>

  </form>
</div>
