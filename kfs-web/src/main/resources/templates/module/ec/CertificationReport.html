<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Certification Report</title>
</head>
<body>
<div layout:fragment="content">
<html:xhtml/>

<!-- th:with="documentAttributes=${DataDictionary.EffortCertificationDocument.attributes}" -->
<!-- th:with="detailAttributes=${DataDictionary.EffortCertificationDetail.attributes}" -->

<!-- th:with="detailLines=${KualiForm.detailLines}" -->
<!-- th:with="newDetailLine=${KualiForm.newDetailLine}" -->

<!-- th:with="documentTypeName=EffortCertificationDocument" -->
<!-- th:with="htmlFormAction=effortCertificationRecreate" -->
<c:set var="accountsCanCrossCharts" value="<span th:text="${SpringContext.getBean(AccountService.class).accountsCanCrossCharts()}"></span>" />    

<div class="document-page" data-document-type="${documentTypeName}" data-form-action="effortCertificationReport" data-show-document-info="true">
<form th:action="@{effortCertificationReport}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">
	
	<div th:replace="~{fragments/documentOverview :: documentOverview(${{KualiForm.editingMode}})}"></div>	
	
	<div th:replace="~{fragments/ec/reportInformation :: reportInformation}"></div>
	
    <!-- th:with="hiddenFieldNames=effortCertificationDocumentCode,totalOriginalPayrollAmount" -->
	<c:forTokens var="fieldName" items="${hiddenFieldNames}" delims=",">	
		<input type="hidden" name="document.${fieldName}" id="document.${fieldName}" value="${KualiForm.document[fieldName]}"/>		  
	</c:forTokens>

	<!-- th:with="canEdit=${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}" -->
	<!-- th:with="isSummaryTabEntry=${KualiForm.editingMode[EffortConstants.EffortCertificationEditMode.SUMMARY_TAB_ENTRY]}" -->
	
 	< c:if test="${canEdit && isSummaryTabEntry}" >
		<div th:replace="~{fragments/ec/summaryTab :: summaryTab}" th:with="accountsCanCrossCharts=${accountsCanCrossCharts}"></div>	
	</c:if >
	
	<!-- th:with="isDetailTabEntry=${KualiForm.editingMode[EffortConstants.EffortCertificationEditMode.DETAIL_TAB_ENTRY]}" -->
	<div th:replace="~{fragments/ec/detailTab :: detailTab}" th:with="isOpen=${!isSummaryTabEntry},isEditable=${canEdit && isDetailTabEntry && !isSummaryTabEntry},accountsCanCrossCharts=${accountsCanCrossCharts}"></div>
	
	<div th:replace="~{fragments/notes :: notes}"></div>
	
	<div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>
	
	<div th:replace="~{fragments/routeLog :: routeLog}"></div>
	
	<div th:replace="~{fragments/superUserActions :: superUserActions}"></div>
	
	<div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
	
	<div th:replace="~{fragments/documentControls :: documentControls(${documentEntry.transactionalDocument}, ${KualiForm.extraButtons})}"></div>

</div>
</div>
</div>
</body>
</html>
