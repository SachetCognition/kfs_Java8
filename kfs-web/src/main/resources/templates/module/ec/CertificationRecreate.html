<div class="kfs-document-page" data-document-type="${documentTypeName}">
  <form action="${htmlFormAction}.do" method="post" enctype="multipart/form-data">
    
    <div th:replace="~{fragments/sys/hiddenDocumentFields :: content}" data-is-financial-document="false"></div>
    
    <div th:replace="~{fragments/sys/documentOverview :: content}" data-editing-mode="${KualiForm.editingMode}"></div>
    
    <!--/*/ <th:block th:with="hiddenFieldNames=emplid,universityFiscalYear,effortCertificationReportNumber,effortCertificationDocumentCode,totalOriginalPayrollAmount"> /*/-->
	<c:forTokens var="fieldName" items="${hiddenFieldNames}" delims=",">	
		<input type="hidden" name="document.${fieldName}" id="document.${fieldName}" value="${KualiForm.document[fieldName]}"/>		  
	</c:forTokens>
    
	<section class="kfs-tab" data-tab-title="Effort Detail" data-default-open="true">
  <h3>Effort Detail</h3>
		
		<div class="tab-container" align=center>
			<h3>Retrieve Data</h3>
			<div th:replace="~{fragments/ec/detailLineImport :: content}" data-read-only="${readOnly}" data-attributes="${documentAttributes}"></div>				
		</div>
		
		<div class="tab-container-error"><div class="left-errmsg-tab"><div class="kfs-errors" data-key-match="${EffortConstants.EFFORT_CERTIFICATION_TAB_ERRORS}" th:if="${#fields.hasErrors('${EffortConstants.EFFORT_CERTIFICATION_TAB_ERRORS}')}"><h4></h4></div></div></div>
					
		<div class="tab-container" align=center>			
			<h3>Effort Detail Lines</h3>
			
			<div th:replace="~{fragments/ec/detailLines :: content}" data-detail-lines="${detailLines}" data-attributes="${detailAttributes}" data-detail-field-names="chartOfAccountsCode,accountNumber,subAccountNumber,financialObjectCode,sourceChartOfAccountsCode,sourceAccountNumber,positionNumber,effortCertificationCalculatedOverallPercent,effortCertificationOriginalPayrollAmount" data-detail-field-names-with-hidden-form-when-readonly="chartOfAccountsCode,accountNumber,subAccountNumber,financialObjectCode,sourceChartOfAccountsCode,sourceAccountNumber,positionNumber,effortCertificationOriginalPayrollAmount,effortCertificationCalculatedOverallPercent" data-hidden-field-names="universityFiscalYear,effortCertificationUpdatedOverallPercent,effortCertificationPayrollAmount,costShareSourceSubAccountNumber,versionNumber" data-inquirable-url="${KualiForm.detailLineFieldInquiryUrl}" data-field-info="${KualiForm.fieldInfo}"></div>
		</div>		
	</section>
	
    <div th:replace="~{fragments/kul/notes :: content}"></div>
    <div th:replace="~{fragments/kul/adHocRecipients :: content}"></div>
    <div th:replace="~{fragments/kul/routeLog :: content}"></div>
    <div th:replace="~{fragments/kul/superUserActions :: content}"></div>
    <div class="kfs-panel-footer"></div>
    <div th:replace="~{fragments/sys/documentControls :: content}" data-transactional-document="false"></div>
