<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/ar/CashControlDocument</title>
</head>
<body>
<!--/*/ <th:block th:with="readOnly=${!KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}"> /*/-->
<!--/*/ <th:block th:with="editDetails=${!empty KualiForm.editingMode['editDetails']}"> /*/-->
<!--/*/ <th:block th:with="showGenerateButton=${!empty KualiForm.editingMode['showGenerateButton']}"> /*/-->
<!--/*/ <th:block th:with="editPaymentMedium=${!empty KualiForm.editingMode['editPaymentMedium']}"> /*/-->
<!--/*/ <th:block th:with="editRefDocNbr=${!empty KualiForm.editingMode['editRefDocNbr']}"> /*/-->
<!--/*/ <th:block th:with="editPaymentAppDoc=${!empty KualiForm.editingMode['editPaymentAppDoc']}"> /*/-->
<!--/*/ <th:block th:with="editBankCode=${!empty KualiForm.editingMode['editBankCode']}"> /*/-->
<!--/*/ <th:block th:with="showBankCode=${!empty KualiForm.editingMode['showBankCode']}"> /*/-->

<div class="kfs-document-page" data-document-type="CashControlDocument">
  <form action="arCashControlDocument.do" method="post" enctype="multipart/form-data">

	<th:block th:if="${KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}">
		<!--/*/ <th:block th:with="fullEntryMode=true"> /*/-->
	</th:block>

	<div th:replace="~{fragments/sys/documentOverview :: content}" data-editing-mode="${KualiForm.editingMode}"></div>

	<div th:replace="~{fragments/sys/hiddenDocumentFields :: content}" data-is-financial-document="false"></div>

	<div th:replace="~{fragments/ar/cashControl :: content}" data-document-attributes="${DataDictionary.CashControlDocument.attributes}" data-read-only="${readOnly}" data-show-generate-button="${showGenerateButton}" data-edit-payment-medium="${editPaymentMedium}" data-edit-bank-code="${editBankCode}" data-show-bank-code="${showBankCode}" data-edit-ref-doc-nbr="${editRefDocNbr}"></div>

	<div th:replace="~{fragments/ar/cashControlDetails :: content}" data-document-attributes="${DataDictionary.CashControlDocument.attributes}" data-cash-control-detail-attributes="${DataDictionary.CashControlDetail.attributes}" data-read-only="${readOnly}" data-edit-details="${editDetails}" data-edit-payment-app-doc="${editPaymentAppDoc}"></div>

	<div th:replace="~{fragments/gl/generalLedgerPendingEntries :: content}"></div>

	<div th:replace="~{fragments/kul/notes :: content}"></div>

	<div th:replace="~{fragments/kul/routeLog :: content}"></div>
	
	<div th:replace="~{fragments/kul/superUserActions :: content}"></div>
	
	<div class="kfs-panel-footer"></div>

	<div th:replace="~{fragments/sys/documentControls :: content}" data-transactional-document="true" data-extra-buttons="${KualiForm.extraButtons}"></div>

  </form>
</div>
</body>
</html>
