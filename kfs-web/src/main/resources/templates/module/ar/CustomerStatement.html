<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Customer Statement</title>
</head>
<body>
<div layout:fragment="content">
<!-- th:with="orgAttributes=${DataDictionary.Organization.attributes}" -->
	<!-- th:with="arDocHeaderAttributes=${DataDictionary.AccountsReceivableDocumentHeader.attributes}" -->
	<!-- th:with="invoiceAttributes=${DataDictionary.CustomerInvoiceDocument.attributes}" -->
	<!-- th:with="accountAttributes=${DataDictionary.Account.attributes}" -->
	<!-- th:with="customerBillingStatementAttributes=${DataDictionary.CustomerBillingStatement.attributes}" -->
	
<div class="kfs-page" data-header-title="Billing Statement Generation" data-doc-title="Billing Statement Generation">
<h1>Billing Statement Generation</h1>
<form th:action="@{arCustomerStatement}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="page-body">

	 <table cellpadding="0" cellspacing="0" class="datatable-80" summary="Billing Statement">
			<tr>		
                <th align=right valign=middle class="grid" style="width: 25%;">
                    <div align="right"><label th:text="${orgAttributes.chartOfAccountsCode.label}"></label></div>
                </th>
                <td align=left valign=middle class="grid" style="width: 25%;">
					<kul:htmlControlAttribute attributeEntry="${orgAttributes.chartOfAccountsCode}" property="chartCode"  />	
                    <kul:lookup boClassName="org.kuali.kfs.coa.businessobject.Chart"  fieldConversions="chartOfAccountsCode:chartCode"  />
                </td>
				                       
            </tr>
            <tr>
				<th align=right valign=middle class="grid">
                    <div align="right"><label th:text="${orgAttributes.organizationCode.label}"></label></div>
                </th>
                <td align=left valign=middle class="grid">
                    <kul:htmlControlAttribute attributeEntry="${orgAttributes.organizationCode}" property="orgCode"  />
                    <kul:lookup boClassName="org.kuali.kfs.coa.businessobject.Organization"  fieldConversions="organizationCode:orgCode" lookupParameters="orgCode:organizationCode,chartCode:chartOfAccountsCode"/>
                </td>                
				            
            </tr>
             <tr>
				<th align=right valign=middle class="grid">
                    <div align="right"><label th:text="${arDocHeaderAttributes.customerNumber.label}"></label></div>
                </th>
                <td align=left valign=middle class="grid">
                	<kul:htmlControlAttribute attributeEntry="${arDocHeaderAttributes.customerNumber}" property="customerNumber"  />
                	<kul:lookup boClassName="org.kuali.kfs.module.ar.businessobject.Customer" fieldConversions="customerNumber:customerNumber" lookupParameters="customerNumber:customerNumber" />
                </td>                
				            
            </tr>
              <tr>
				<th align=right valign=middle class="grid">
                    <div align="right"><label th:text="${accountAttributes.accountNumber.label}"></label></div>
                </th>
                <td align=left valign=middle class="grid">
                	<kul:htmlControlAttribute attributeEntry="${accountAttributes.accountNumber}" property="accountNumber"  />
                	<kul:lookup boClassName="org.kuali.kfs.coa.businessobject.Account" fieldConversions="accountNbr:accountNumber" lookupParameters="accountNumber:accountNbr" />
                </td>                
				            
            </tr>
            <tr>		
                <th align=right valign=middle class="grid"">
                    <div align="right"><label th:text="${customerBillingStatementAttributes.statementFormat.label}"></label></div>
                </th>
                <td align=left valign=middle class="grid">                	
                	
	                <input type="radio" name="statementFormat" value="Summary" checked />Summary&nbsp;&nbsp;
					<input type="radio" name="statementFormat" value="Detail" />Detail&nbsp;&nbsp;
                </td>				                      
            </tr>            
            <tr>		
                <th align=right valign=middle class="grid">
                    <div align="right"><label th:text="${customerBillingStatementAttributes.includeZeroBalanceCustomers.label}"></label></div>
                </th>
                <td align=left valign=middle class="grid">
	                <input type="radio" name="includeZeroBalanceCustomers" value="Yes" />Yes&nbsp;&nbsp;
					<input type="radio" name="includeZeroBalanceCustomers" value="No" checked />No&nbsp;&nbsp;
                </td>				                      
            </tr>  
       
        </tr>
        </table>
    
     <!-- th:with="extraButtons=${KualiForm.extraButtons}" -->  	
  	
	
     <div id="globalbuttons" class="globalbuttons">
	        	
	        	<th:block th:if="${!empty extraButtons}">
		        	<th:block th:each="extraButton : ${extraButtons}">
		        		<input type="image" th:src="@{${extraButton.extraButtonSource}}" styleClass="globalbuttons" property="${extraButton.extraButtonProperty}" title="${extraButton.extraButtonAltText}" alt="${extraButton.extraButtonAltText}"/>
		        	</th:block>
	        	</th:block>
	</div>
	
	<div>
	  <th:block th:if="${!empty KualiForm.message }">
            	 ${KualiForm.message }
            </th:block>
   </div>
	

</div>
</div>
</div>
</body>
</html>
