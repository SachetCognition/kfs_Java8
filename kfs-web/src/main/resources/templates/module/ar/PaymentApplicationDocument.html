function toggle(id) {
  var v=document.getElementById(id); 
  if('none' != v.style.display) {
    v.style.display='none';
  } else {
    v.style.display='';
  }
}
</script>

<div class="kfs-document-page" data-document-type="PaymentApplicationDocument">
  <form action="arPaymentApplicationDocument.do" method="post" enctype="multipart/form-data">

	<div th:replace="~{fragments/sys/hiddenDocumentFields :: content}" data-is-financial-document="false"></div>

	<div th:replace="~{fragments/sys/documentOverview :: content}" data-editing-mode="${KualiForm.editingMode}"></div>

	<div th:replace="~{fragments/ar/paymentApplicationControlInformation :: content}" data-is-customer-selected="${isCustomerSelected}" data-has-related-cash-control-document="${hasRelatedCashControlDocument}" data-customer-attributes="${customerAttributes}" data-customer-invoice-detail-attributes="${customerInvoiceDetailAttributes}" data-invoice-attributes="${invoiceAttributes}" data-read-only="${readOnly}"></div>

	<div th:replace="~{fragments/ar/paymentApplicationSummaryOfAppliedFunds :: content}" data-is-customer-selected="${isCustomerSelected}" data-has-related-cash-control-document="${hasRelatedCashControlDocument}" data-read-only="${readOnly}"></div>

	<div th:replace="~{fragments/ar/paymentApplicationQuickApplyToInvoice :: content}" data-is-customer-selected="${isCustomerSelected}" data-has-related-cash-control-document="${hasRelatedCashControlDocument}" data-read-only="${readOnly}" data-customer-invoice-detail-attributes="${customerInvoiceDetailAttributes}" data-invoice-attributes="${invoiceAttributes}"></div>

	<div th:replace="~{fragments/ar/paymentApplicationApplyToInvoiceDetail :: content}" data-customer-attributes="${customerAttributes}" data-customer-invoice-detail-attributes="${customerInvoiceDetailAttributes}" data-invoice-attributes="${invoiceAttributes}" data-read-only="${readOnly}"></div>

	<div th:replace="~{fragments/ar/paymentApplicationNonAr :: content}" data-customer-attributes="${customerAttributes}" data-is-customer-selected="${isCustomerSelected}" data-has-related-cash-control-document="${hasRelatedCashControlDocument}" data-read-only="${readOnly}" data-accounts-can-cross-charts="${accountsCanCrossCharts}"></div>
	<div th:replace="~{fragments/ar/paymentApplicationUnappliedTab :: content}" data-is-customer-selected="${isCustomerSelected}" data-read-only="${readOnly}" data-has-related-cash-control-document="${hasRelatedCashControlDocument}"></div>

	<div th:replace="~{fragments/gl/generalLedgerPendingEntries :: content}"></div>

	<div th:replace="~{fragments/kul/notes :: content}"></div>

	<div th:replace="~{fragments/kul/adHocRecipients :: content}"></div>

	<div th:replace="~{fragments/kul/routeLog :: content}"></div>

	<div th:replace="~{fragments/kul/superUserActions :: content}"></div>
	
	<div class="kfs-panel-footer"></div>

	<div th:replace="~{fragments/sys/documentControls :: content}" data-transactional-document="true" data-extra-buttons="${KualiForm.extraButtons}"></div>
