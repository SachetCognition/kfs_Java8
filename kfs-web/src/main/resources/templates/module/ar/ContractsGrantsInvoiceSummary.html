<!-- Thymeleaf template converted from JSP: module/ar/ContractsGrantsInvoiceSummary.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/ar/ContractsGrantsInvoiceSummary</title>
</head>
<body>
<div class="kfs-page" data-header-title="Contracts & Grants Invoice Summary" data-doc-title="Contracts & Grants Invoice Summary">
  <form action="arContractsGrantsInvoiceSummary.do" method="post">

	<div id="globalbuttons" class="globalbuttons">
		<th:block th:if="${KualiForm.awardInvoiced}">
			<input type="image" src="${ConfigProperties.externalizable.images.url}buttonsmall_return.gif"
				styleClass="globalbuttons" property="methodToCall.cancel"
				title="return" alt="return" />
		</th:block>

		<th:block th:if="${!KualiForm.awardInvoiced}">

			<div th:replace="~{fragments/ar/documentSummaryResults :: content}" data-lookup-results-property="contractsGrantsInvoiceLookupResults" data-lookup-result-title-properties="agencyNumber;agencyFullName"></div>
			</div><!-- /ar:documentSummaryResults -->
			<div class="kfs-panel-footer"></div>
			<input type="image" src="${ConfigProperties.externalizable.images.url}buttonsmall_create.gif"
				styleClass="globalbuttons"
				property="methodToCall.createInvoices.number${KualiForm.lookupResultsSequenceNumber}"
				title="create Invoices" alt="create Invoices" />
			<input type="image" src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_cancel.gif"
				styleClass="globalbuttons" property="methodToCall.cancel"
				title="cancel" alt="cancel" />
		</th:block>
	</div>
  </form>
</div>
</body>
</html>
