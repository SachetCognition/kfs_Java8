<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Contracts Grants Invoice Summary</title>
</head>
<body>
<div layout:fragment="content">
<div class="kfs-page" data-header-title="Contracts & Grants Invoice Summary" data-doc-title="Contracts & Grants Invoice Summary">
<h1>Contracts & Grants Invoice Summary</h1>
<form th:action="@{arContractsGrantsInvoiceSummary}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="page-body">

	<div id="globalbuttons" class="globalbuttons">
		<th:block th:if="${KualiForm.awardInvoiced}">
			<input type="image" th:src="@{${ConfigProperties.externalizable.images.url}buttonsmall_return.gif}"
				styleClass="globalbuttons" property="methodToCall.cancel"
				title="return" alt="return" />
		</th:block>

		<th:block th:if="${!KualiForm.awardInvoiced}">

			<div th:include="~{fragments/ar/documentSummaryResults :: documentSummaryResults}" th:with="lookupResultsProperty='contractsGrantsInvoiceLookupResults',lookupResultTitleProperties='agencyNumber;agencyFullName'">
				<div th:replace="~{fragments/ar/contractsGrantsInvoiceSummaryResultContent :: contractsGrantsInvoiceSummaryResultContent}"></div>
			</div><!-- end ar:documentSummaryResults -->
			<div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
			<input type="image" th:src="@{${ConfigProperties.externalizable.images.url}buttonsmall_create.gif}"
				styleClass="globalbuttons"
				property="methodToCall.createInvoices.number${KualiForm.lookupResultsSequenceNumber}"
				title="create Invoices" alt="create Invoices" />
			<input type="image" th:src="@{${ConfigProperties.kr.externalizable.images.url}buttonsmall_cancel.gif}"
				styleClass="globalbuttons" property="methodToCall.cancel"
				title="cancel" alt="cancel" />
		</th:block>
	</div>
</div>
</div>
</div>
</body>
</html>
