<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/ar/CustomerInvoiceDocument</title>
</head>
<body>
<th:block th:if="${!accountingLineScriptsLoaded}">
       <script type='text/javascript' src="dwr/interface/ChartService.js"></script>
       <script type='text/javascript' src="dwr/interface/AccountService.js"></script>
       <script type='text/javascript' src="dwr/interface/SubAccountService.js"></script>
       <script type='text/javascript' src="dwr/interface/ObjectCodeService.js"></script>
       <script type='text/javascript' src="dwr/interface/ObjectTypeService.js"></script>
       <script type='text/javascript' src="dwr/interface/SubObjectCodeService.js"></script>
       <script type='text/javascript' src="dwr/interface/ProjectCodeService.js"></script>
       <script type='text/javascript' src="dwr/interface/OriginationCodeService.js"></script>
       <script language="JavaScript" type="text/javascript" src="scripts/sys/objectInfo.js"></script>
       <!--/*/ <th:block th:with="accountingLineScriptsLoaded=true"> /*/-->
</th:block>     
       
<!--/*/ <th:block th:with="accountsCanCrossCharts=[[${__EXPR__}]]"> /*/-->       
<!--/*/ <th:block th:with="readOnly=${!KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}"> /*/-->

<div class="kfs-document-page" data-document-type="CustomerInvoiceDocument">
  <form action="arCustomerInvoiceDocument.do" method="post" enctype="multipart/form-data">

	<div th:replace="~{fragments/sys/hiddenDocumentFields :: content}"></div>

	<div th:replace="~{fragments/sys/documentOverview :: content}" data-editing-mode="${KualiForm.editingMode}"></div>
	
    <div th:replace="~{fragments/ar/customerInvoiceOrganization :: content}" data-document-attributes="${DataDictionary.CustomerInvoiceDocument.attributes}" data-read-only="${readOnly}"></div>	
	
    <div th:replace="~{fragments/ar/customerInvoiceRecurrenceDetails :: content}" data-document-attributes="${DataDictionary.CustomerInvoiceDocument.attributes}" data-read-only="${readOnly}"></div>
        
    <div th:replace="~{fragments/ar/customerInvoiceGeneral :: content}" data-document-attributes="${DataDictionary.CustomerInvoiceDocument.attributes}" data-read-only="${readOnly}"></div>
        
    <div th:replace="~{fragments/ar/customerInvoiceAddresses :: content}" data-document-attributes="${DataDictionary.CustomerInvoiceDocument.attributes}" data-read-only="${readOnly}"></div>
     
	<section class="kfs-tab" data-tab-title="Accounting Lines" data-default-open="true">
  <h3>Accounting Lines</h3>
		<div class="kfs-sys-java-accountingLines" th:include="~{fragments/sys/java/accountingLines :: content}">
			<div th:replace="~{fragments/sys/java/accountingLineGroup :: content}" data-new-line-property-name="newSourceLine" data-collection-property-name="document.sourceAccountingLines" data-collection-item-property-name="document.sourceAccountingLine" data-attribute-group-name="source"></div>
		</div><!-- /kfs-sys-java-accountingLines -->
	</section>
	    
	<div th:replace="~{fragments/gl/generalLedgerPendingEntries :: content}"></div>
		            
	<div th:replace="~{fragments/kul/notes :: content}"></div> 

	<div th:replace="~{fragments/kul/adHocRecipients :: content}"></div>

	<div th:replace="~{fragments/kul/routeLog :: content}"></div>

	<div th:replace="~{fragments/kul/superUserActions :: content}"></div>

	<div class="kfs-panel-footer"></div>

	<!--/*/ <th:block th:with="extraButtons=${KualiForm.extraButtons}"> /*/-->
	
	<div th:replace="~{fragments/sys/documentControls :: content}" data-transactional-document="true" data-extra-buttons="${extraButtons}"></div>

  </form>
</div>
</body>
</html>
