<!-- Thymeleaf template converted from JSP: module/ar/CustomerOpenItemReportLookup.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/ar/CustomerOpenItemReportLookup</title>
</head>
<body>
<div class="kfs-page" data-header-title="Lookup" data-doc-title="">
  <form action="arCustomerOpenItemReportLookup.do" method="post">

	<div class="headerarea-small" id="headerarea-small">
	<h1><span th:text="${param.reportName}"></span>
	<span class="kfs-help" th:replace="~{fragments/kul/help :: content}"></span></h1>
	</div>
	
	<h3>
		<table width="100%" cellspacing="0" cellpadding="0">
			<tr>
				<td width="1%"><img src="${ConfigProperties.kr.externalizable.images.url}pixel_clear.gif" alt="" width="20" height="20" /></td>
				<td>Customer Number: &nbsp; <span th:text="${param.customerNumber}"></span>&nbsp;&nbsp;<span th:text="${param.customerName}"></span></td>
			</tr>
		</table>
	</h3>

	<kul:enterKey methodToCall="search" />

	<html-el:hidden name="KualiForm" property="backLocation" />
	<html-el:hidden name="KualiForm" property="formKey" />
	<html-el:hidden name="KualiForm" property="lookupableImplServiceName" />
	<html-el:hidden name="KualiForm" property="businessObjectClassName" />
	<html-el:hidden name="KualiForm" property="conversionFields" />
	<html-el:hidden name="KualiForm" property="hideReturnLink" />

	<div class="kfs-errors" data-key-match="*" th:if="${#fields.hasErrors('*')}"><h4>Errors found in Search Criteria:</h4></div>

	<table width="100%" cellspacing="0" cellpadding="0">
		<tr>
			<td width="1%"><img src="${ConfigProperties.kr.externalizable.images.url}pixel_clear.gif" alt="" width="20" height="20" /></td>
			<td>
				<th:block th:if="${empty reqSearchResultsSize}">
					There were no results found.
				</th:block>
				<th:block th:if="${!empty reqSearchResultsSize}">
					<th:block th:if="${param.reportName == KFSConstants.CustomerOpenItemReport.OPEN_ITEM_REPORT_NAME}">
						<table width="25%" cellspacing="0" cellpadding="0">
							<tr><td>Report Option:</td><td><span th:text="${param.reportOption}"></span></td>
							 <th:block th:switch="${true}">
								<th:block th:case="${param.reportOption == KFSConstants.CustomerOpenItemReport.REPORT_OPTION_ACCT}">
									<tr><td>Account Number:</td><td><span th:text="${param.accountNumber}"></span></td>
								</th:block>
								<th:block th:case="*">
									<tr><td>Chart Code:</td><td><span th:text="${param.chartCode}"></span></td>
									<tr><td>Organization Code:</td><td><span th:text="${param.orgCode}"></span></td>
								</th:block>
							 </th:block>
							<tr><td>Report Run Date:</td><td><span th:text="${param.reportRunDate}"></span></td>
							<tr><td>Report Age:</td><td><span th:text="${param.columnTitle}"></span></td>
						</table> <br><br>
					</th:block>
					<div th:replace="~{fragments/ar/openInvoiceReportResults :: content}" data-report-lookup-action-name="arCustomerOpenItemReportLookup.do"></div>
			    </th:block>
			</td>
			<td width="1%"><img src="${ConfigProperties.kr.externalizable.images.url}pixel_clear.gif" alt="" height="20" width="20">
			</td>
		</tr>
	</table>
  </form>
</div>
</body>
</html>
