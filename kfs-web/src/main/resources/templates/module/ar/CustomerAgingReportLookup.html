<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Customer Aging Report Lookup</title>
</head>
<body>
<div layout:fragment="content">
<!-- th:with="orgAttributes=${DataDictionary.Organization.attributes}" -->

<div class="kfs-page" data-header-title="Lookup" data-doc-title="">
<h1>Lookup</h1>
<form th:action="@{arCustomerAgingReportLookup}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="page-body">

    <div class="headerarea-small" id="headerarea-small">
        <h1><span th:text="${KualiForm.lookupable.title}"></span> <kul:help
                resourceKey="lookupHelpText" altText="lookup help"/></h1>
    </div>

    <kul:enterKey methodToCall="search"/>

    <html-el:hidden name="KualiForm" property="backLocation"/>
    <html-el:hidden name="KualiForm" property="formKey"/>
    <html-el:hidden name="KualiForm" property="lookupableImplServiceName"/>
    <html-el:hidden name="KualiForm" property="businessObjectClassName"/>
    <html-el:hidden name="KualiForm" property="conversionFields"/>
    <html-el:hidden name="KualiForm" property="hideReturnLink"/>

    <kul:errors errorTitle="Errors found in Search Criteria:"/>

    <table width="100%" cellspacing="0" cellpadding="0">
        <tr>
            <td width="1%"><img src="${ConfigProperties.kr.externalizable.images.url}pixel_clear.gif" alt="" width="20"
                                height="20"/></td>
            <td>
                <div id="lookup" align="center"><br/>
                    <br/>
                    <table class="datatable-100" align="center" cellpadding="0"
                           cellspacing="0">
                        <c:set var="FormName" value="KualiForm" scope="request"/>
                        <c:set var="FieldRows" value="${KualiForm.lookupable.rows}"
                               scope="request"/>
                        <c:set var="ActionName" value="glModifiedInquiry.do" scope="request"/>
                        <c:set var="IsLookupDisplay" value="true" scope="request"/>

                        <kul:rowDisplay rows="${KualiForm.lookupable.rows}"/> `

                        <tr align=center>
                            <td height="30" colspan=2 class="infoline">
                                <html:image property="methodToCall.search" value="search"
                                            src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_search.gif"
                                            styleClass="tinybutton" alt="search" title="search" border="0"/>
                                <html:image property="methodToCall.clearValues" value="clearValues"
                                            src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_clear.gif"
                                            styleClass="tinybutton" alt="clear" title="clear" border="0"/>

                                <html:image property="methodToCall.cancel" value="cancel"
                                            src="${ConfigProperties.kr.externalizable.images.url}buttonsmall_cancel.gif"
                                            styleClass="tinybutton" alt="cancel" title="cancel" border="0"/>

                                <!-- Optional extra button -->
                                <th:block th:if="${not empty KualiForm.lookupable.extraButtonSource}">
                                    <a
                                            href='<c:out value="${KualiForm.backLocation}?methodToCall=refresh&refreshCaller=org.kuali.rice.kns.lookup.KualiLookupableImpl&docFormKey=${KualiForm.formKey}" /><span th:text="${KualiForm.lookupable.extraButtonParams}"></span>'
                                            title="cancel">
                                        <img src='<span th:text="${KualiForm.lookupable.extraButtonSource}"></span>'
                                             class="tinybutton" border="0" alt="cancel"/></a>
                                </th:block></td>
                        </tr>
                    </table>
                </div>

                <th:block th:if="${!empty reqSearchResultsSize }">
                    <!-- th:with="offset=0" -->
                    <display:table class="datatable-100" cellspacing="0" cellpadding="0" name="${reqSearchResults}"
                                   id="row" export="true" pagesize="100" offset="${offset}"
                                   requestURI="arCustomerAgingReportLookup.do?methodToCall=viewResults&reqSearchResultsSize=${reqSearchResultsSize}&searchResultKey=${searchResultKey}">
                        <th:block th:each="column,status : ${row.columns}">
                            <display:column
                                    class="${ fn:startsWith(column.columnTitle, 'Customer') ? 'infocell' : 'numbercell' }"
                                    title="${column.columnTitle}" comparator="${column.comparator}"
                                    sortable="${('dummyBusinessObject.linkButtonOption' ne column.propertyName) && column.sortable}">
                                <th:block th:switch="${true}">
                                    <th:block th:case="${column.propertyURL != \"\" && param['d-16544-e'] == null}">
                                        <a href="<span th:text="${column.propertyURL}"></span>" title="${column.propertyValue}"
                                        target="blank"><span th:text="${column.propertyValue}"></span></a>
                                    </th:block>
                                    <th:block th:case="*">
                                        <span th:text="${column.propertyValue}"></span>
                                    </th:block>
                                </th:block>
                            </display:column>
                        </th:block>

                        <display:footer>
                            <th><span class="grid">TOTALS:</span></th>
                            <th:block th:if="${reqSearchResultsSize == '1'}">
                                <td class="numbercell">&nbsp; <span th:text="${reqSearchResultsSize}"></span> customer</td>
                            </th:block>
                            <th:block th:if="${reqSearchResultsSize != '1'}">
                                <td class="numbercell">&nbsp; <span th:text="${reqSearchResultsSize}"></span> customers</td>
                            </th:block>
                            <td class="numbercell">&nbsp; $<span th:text="${KualiForm.total0to30}"></span></td>
                            <td class="numbercell">&nbsp; $<span th:text="${KualiForm.total31to60}"></span></td>
                            <td class="numbercell">&nbsp; $<span th:text="${KualiForm.total61to90}"></span></td>
                            <td class="numbercell">&nbsp; $<span th:text="${KualiForm.total91toSYSPR}"></span></td>
                            <td class="numbercell">&nbsp; $<span th:text="${KualiForm.totalSYSPRplus1orMore}"></span></td>
                            <td class="numbercell">&nbsp; $<span th:text="${KualiForm.totalOpenInvoices}"></span></td>
                            <td class="numbercell">&nbsp; $<span th:text="${KualiForm.totalWriteOffs}"></span></td>
                        </display:footer>

                    </display:table>

            </td>
            </th:block>
            <td width="1%"><img src="${ConfigProperties.kr.externalizable.images.url}pixel_clear.gif" alt="" height="20"
                                width="20"></td>
        </tr>
    </table>
    <br/>
    <br/>
</div>
</div>
</div>
</body>
</html>
