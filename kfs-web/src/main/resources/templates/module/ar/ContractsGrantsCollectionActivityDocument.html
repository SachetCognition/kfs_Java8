<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Contracts Grants Collection Activity Document</title>
</head>
<body>
<div layout:fragment="content">
<!-- th:with="readOnly=${!KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT]}" -->

<div class="document-page" data-document-type="ContractsGrantsCollectionActivityDocument" data-form-action="arContractsGrantsCollectionActivityDocument" data-show-document-info="true">
<form th:action="@{arContractsGrantsCollectionActivityDocument}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">
	
	<sys:hiddenDocumentFields isFinancialDocument="false" />

	<div th:replace="~{fragments/documentOverview :: documentOverview(${{KualiForm.editingMode}})}"></div>
	
	<div th:replace="~{fragments/ar/contractsGrantsCollectionActivityAwardInformation :: contractsGrantsCollectionActivityAwardInformation}" th:with="readOnly=${readOnly}"></div>
	<div th:replace="~{fragments/ar/contractsGrantsCollectionActivityGlobalCollectionEvent :: contractsGrantsCollectionActivityGlobalCollectionEvent}" th:with="readOnly=${readOnly}"></div>
	<div th:replace="~{fragments/ar/contractsGrantsCollectionActivityInvoiceList :: contractsGrantsCollectionActivityInvoiceList}" th:with="readOnly=${readOnly}"></div>
		
	<div th:replace="~{fragments/notes :: notes}"></div>

	<div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>

	<div th:replace="~{fragments/routeLog :: routeLog}"></div>
	
	<div th:replace="~{fragments/superUserActions :: superUserActions}"></div>

	<div th:replace="~{fragments/panelFooter :: panelFooter}"></div>

	<div th:replace="~{fragments/documentControls :: documentControls(${documentEntry.transactionalDocument}, ${KualiForm.extraButtons})}"></div>
		
</div>
</div>
</div>
</body>
</html>
