<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Final Billed Indicator Document</title>
</head>
<body>
<div layout:fragment="content">
<div class="document-page" data-document-type="FBI" data-form-action="arFinalBilledIndicatorDocument" data-show-document-info="true">
<form th:action="@{arFinalBilledIndicatorDocument}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="document-body">

	<kul:documentOverview editingMode="${KualiForm.editingMode}" />

	<div th:replace="~{fragments/ar/finalBilledIndicatorEntries :: finalBilledIndicatorEntries}" th:with="editingMode=${KualiForm.editingMode}"></div>

	<div th:replace="~{fragments/notes :: notes}"></div>

	<div th:replace="~{fragments/adHocRecipients :: adHocRecipients}"></div>

	<div th:replace="~{fragments/routeLog :: routeLog}"></div>

	<div th:replace="~{fragments/superUserActions :: superUserActions}"></div>

	<div th:replace="~{fragments/panelFooter :: panelFooter}"></div>

	<kul:documentControls transactionalDocument="true" />

</div>
</div>
</div>
</body>
</html>
