<!-- Thymeleaf template converted from JSP: module/ar/ContractsGrantsInvoiceDocument.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">module/ar/ContractsGrantsInvoiceDocument</title>
</head>
<body>
<!--/*/ <th:block th:with="readOnlyForCorrectionDocument=${KualiForm.document.correctionDocument}"> /*/-->
	<!--/*/ <th:block th:with="readOnly=${!KualiForm.documentActions[Constants.KUALI_ACTION_CAN_EDIT] || readOnlyForCorrectionDocument}"> /*/-->
	
	
		
<div class="kfs-document-page" data-document-type="CINV">
  <form action="arContractsGrantsInvoiceDocument.do" method="post" enctype="multipart/form-data">

	<div th:replace="~{fragments/sys/hiddenDocumentFields :: content}"></div>

	<div th:replace="~{fragments/sys/documentOverview :: content}" data-editing-mode="${KualiForm.editingMode}"></div>
	
	<div th:replace="~{fragments/ar/contractsGrantsInvoiceOrganization :: content}" data-document-attributes="${DataDictionary.ContractsGrantsInvoiceDocument.attributes}" data-read-only="${readOnly}"></div>
	
	<div th:replace="~{fragments/ar/invoiceGeneral :: content}" data-read-only="${readOnly}"></div>
		
	<th:block th:switch="${true}">
		<th:block th:case="${KualiForm.document.invoiceGeneralDetail.billingFrequencyCode == ArConstants.MILESTONE_BILLING_SCHEDULE_CODE}">
			<div th:replace="~{fragments/ar/invoiceMilestones :: content}"></div>
		</th:block>
		<th:block th:case="${KualiForm.document.invoiceGeneralDetail.billingFrequencyCode == ArConstants.PREDETERMINED_BILLING_SCHEDULE_CODE}">
			<div th:replace="~{fragments/ar/invoiceBills :: content}"></div>
		</th:block>
		<th:block th:case="*">
			<div th:replace="~{fragments/ar/invoiceDetails :: content}" data-read-only="${readOnly}"></div>
			<div th:replace="~{fragments/ar/invoiceAccountDetails :: content}"></div>
		</th:block>
	</th:block>

	<th:block th:if="${!KualiForm.document.correctionDocument}">
		<div th:replace="~{fragments/ar/invoiceSuspensionCategories :: content}"></div>
	</th:block>

	<th:block th:if="${!KualiForm.document.correctionDocument && KualiForm.document.invoiceGeneralDetail.billingFrequencyCode != ArConstants.LOC_BILLING_SCHEDULE_CODE}">
		<div th:replace="~{fragments/ar/invoiceTransmissionDetails :: content}" data-read-only="${readOnly}"></div>
	</th:block>

	<div th:replace="~{fragments/gl/generalLedgerPendingEntries :: content}"></div>

	<div th:replace="~{fragments/kul/notes :: content}"></div>

	<div th:replace="~{fragments/kul/adHocRecipients :: content}"></div>

	<div th:replace="~{fragments/kul/routeLog :: content}"></div>
	
	<div th:replace="~{fragments/kul/superUserActions :: content}"></div>

	<div class="kfs-panel-footer"></div>

	<div th:replace="~{fragments/sys/documentControls :: content}" data-transactional-document="true" data-extra-buttons="${KualiForm.extraButtons}"></div>

  </form>
</div>
</body>
</html>
