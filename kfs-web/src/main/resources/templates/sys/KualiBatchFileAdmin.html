<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Kuali Batch File Admin</title>
</head>
<body>
<div layout:fragment="content">
<div class="kfs-page" data-header-title="Batch File Delete" data-doc-title="Batch File Delete">
<h1>Batch File Delete</h1>
<form th:action="@{batchFileAdmin}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="page-body">
	<span th:text="${status}"></span>
	<br/>
	<br/>
	<li><div th:replace="~{fragments/portal/portalLink :: portalLink}" th:with="displayTitle='true',title='Click here to return to the Batch File lookup',url='kr/lookup.do?methodToCall=start&businessObjectClassName=org.kuali.kfs.sys.batch.BatchFile&docFormKey=88888888&returnLocation=${ConfigProperties.application.url}/portal.do&hideReturnLink=true'"></div></li>
</div>
</div>
</div>
</body>
</html>
