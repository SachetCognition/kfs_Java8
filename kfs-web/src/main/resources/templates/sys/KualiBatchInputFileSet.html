<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Kuali Batch Input File Set</title>
</head>
<body>
<div layout:fragment="content">
<div class="kfs-page" data-header-title="Batch File Set Upload" data-doc-title="">
<h1>Batch File Set Upload</h1>
<form th:action="@{batchUploadFileSet}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="page-body">
	<input type="hidden" th:field="*{batchUpload.batchInputTypeName}" />
	
    <!-- th:with="batchUploadAttributes=${DataDictionary.BatchUpload.attributes}" -->

	<strong><h2>	
	  <span th:text="#{${KualiForm.titleKey}}"></span> <a href="${ConfigProperties.externalizable.help.url}default.htm?turl=WordDocuments%2Fbatch.htm" tabindex="${KualiForm.nextArbitrarilyHighIndex}" target="helpWindow"  title="[Help]Upload">
	                                        <img src="${ConfigProperties.kr.externalizable.images.url}my_cp_inf.gif" title="[Help] Upload" alt="[Help] Upload" hspace=5 border=0  align="middle"></a>
	  </h2></strong>
	</br>
	
	<table width="100%" border="0"><tr><td>	
	  <kul:errors keyMatch="*" errorTitle="Errors Found On Page:"/>
	</td></tr></table>  
	</br>
		
	<kul:tabTop tabTitle="Manage Batch Files" defaultOpen="true" tabErrorKey="">
      <div class="tab-container" align="center">
          <h3>Add Batch File Set</h3>
          <table width="100%" summary="" cellpadding="0" cellspacing="0">
            <tr>
              <th width="120">&nbsp;</th>
              <th> <div align="left">Browse File</div></th>
              <th> <div align="left"><label for="batchUpload.fileUserIdentifer">File Set Identifier</label></div></th>
              <th width="150"> <div align="center">Actions</div></th>
            </tr>
            
            <th:block th:each="fileType,loopStatus : ${KualiForm.batchInputFileSetType.fileTypes}">
              <tr>
                <th scope="row"><div align="right">add <span th:text="${KualiForm.batchInputFileSetType.fileTypeDescription[fileType]}"></span>:</div></th>
                <td class="infoline"><html:file title="Browse File" property="uploadedFiles(${fileType})"/>
                  <span class="fineprint"></span>
                </td>
                <td class="infoline">
                  <th:block th:if="${loopStatus.first}">
                    <div align="left">
                      <kul:htmlControlAttribute attributeEntry="${batchUploadAttributes.fileUserIdentifer}" property="batchUpload.fileUserIdentifer"/>
                    </div>
                  </th:block>
                  <span class="fineprint">&nbsp;</span>
                </td>
                <td class="infoline"><div align="center">
                  <th:block th:if="${loopStatus.first}">
                    <input type="image" th:src="@{${ConfigProperties.kr.externalizable.images.url}tinybutton-add1.gif}" styleClass="globalbuttons" property="methodToCall.save" title="Upload Batch File" alt="Upload Batch File" />
                  </th:block>
                  &nbsp;
                </td>
              </tr>
            </th:block>
         </table>
      </div>
	</kul:tabTop>
	
	<div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
	
</div>
</div>
</div>
</body>
</html>
