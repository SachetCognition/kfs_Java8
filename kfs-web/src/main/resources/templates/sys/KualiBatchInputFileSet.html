<!-- Thymeleaf template converted from JSP: sys/KualiBatchInputFileSet.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">sys/KualiBatchInputFileSet</title>
</head>
<body>
<div class="kfs-page" data-header-title="Batch File Set Upload" data-doc-title="">
  <form action="batchUploadFileSet.do" method="post">
	<input type="hidden" th:field="*{batchUpload.batchInputTypeName}" />
	
    <!--/*/ <th:block th:with="batchUploadAttributes=${DataDictionary.BatchUpload.attributes}"> /*/-->

	<strong><h2>	
	  <span th:text="#{${__MSG_KEY__}}"></span> <a href="${ConfigProperties.externalizable.help.url}default.htm?turl=WordDocuments%2Fbatch.htm" tabindex="${KualiForm.nextArbitrarilyHighIndex}" target="helpWindow"  title="[Help]Upload">
	                                        <img src="${ConfigProperties.kr.externalizable.images.url}my_cp_inf.gif" title="[Help] Upload" alt="[Help] Upload" hspace=5 border=0  align="middle"></a>
	  </h2></strong>
	</br>
	
	<table width="100%" border="0"><tr><td>	
	  <div class="kfs-errors" data-key-match="*" th:if="${#fields.hasErrors('*')}"><h4>Errors Found On Page:</h4></div>
	</td></tr></table>  
	</br>
		
	<section class="kfs-tab" data-tab-title="Manage Batch Files" data-default-open="true">
  <h3>Manage Batch Files</h3>
      <div class="tab-container" align="center">
          <h3>Add Batch File Set</h3>
          <table width="100%" summary="" cellpadding="0" cellspacing="0">
            <tr>
              <th width="120">&nbsp;</th>
              <th> <div align="left">Browse File</div></th>
              <th> <div align="left"><label for="batchUpload.fileUserIdentifer">File Set Identifier</label></div></th>
              <th width="150"> <div align="center">Actions</div></th>
            </tr>
            
            <c:forEach items="${KualiForm.batchInputFileSetType.fileTypes}" var="fileType" varStatus="loopStatus">
              <tr>
                <th scope="row"><div align="right">add <span th:text="${KualiForm.batchInputFileSetType.fileTypeDescription[fileType]}"></span>:</div></th>
                <td class="infoline"><html:file title="Browse File" property="uploadedFiles(${fileType})"/>
                  <span class="fineprint"></span>
                </td>
                <td class="infoline">
                  <th:block th:if="${loopStatus.first}">
                    <div align="left">
                      <input type="text" name="batchUpload.fileUserIdentifer" th:field="*{batchUpload.fileUserIdentifer}" data-attribute-entry="${batchUploadAttributes.fileUserIdentifer}" />
                    </div>
                  </th:block>
                  <span class="fineprint">&nbsp;</span>
                </td>
                <td class="infoline"><div align="center">
                  <th:block th:if="${loopStatus.first}">
                    <input type="image" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-add1.gif" styleClass="globalbuttons" property="methodToCall.save" title="Upload Batch File" alt="Upload Batch File" />
                  </th:block>
                  &nbsp;
                </td>
              </tr>
            </tr>
         </table>
      </div>
	</section>
	
	<div class="kfs-panel-footer"></div>
	
  </form>
</div>
</body>
</html>
