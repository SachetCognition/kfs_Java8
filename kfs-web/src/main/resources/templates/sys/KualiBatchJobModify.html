<!-- Thymeleaf template converted from JSP: sys/KualiBatchJobModify.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">sys/KualiBatchJobModify</title>
</head>
<body>
<style type="text/css">
	TABLE.positioningTable {
		border: 0!important;
 		margin : 0!important;
		padding : 0!important;
		empty-cells : show;
		border-collapse : collapse;
 	}
	TABLE.positioningTable TD {
		border: 0!important;
 		margin : 0!important;
		padding : 0!important;
 	}
</style>
<!--[if IE]>
<style>
	#workarea div.tab-container {
		width:100%;
	}
</style>
<![endif]-->
<div class="kfs-page" data-header-title="Modify Batch Job" data-doc-title="Modify Batch Job">
  <form action="batchModify.do" method="post">
	<div style="text-align: right;">
		<a href="kr/lookup.do?methodToCall=start&businessObjectClassName=org.kuali.kfs.sys.batch.BatchJobStatus&docFormKey=88888888&returnLocation=${ConfigProperties.application.url}/portal.do&hideReturnLink=true&conversionFields=name:name,group:group">Return to Lookup</a>
	</div>
	<input type="hidden" th:field="*{refreshCaller}" />
	<input type="hidden" name="name" value="${job.name}" />
	<input type="hidden" name="group" value="${job.group}" />
	<section class="kfs-tab" data-tab-title="Job Info" data-default-open="true">
  <h3>Job Info</h3>
		<div class="tab-container" align="center">
	      <table width="100%" cellpadding=0 cellspacing=0 class="datatable">
			<tr>
				<td colspan="4" class="tab-subhead">Job Info</td>
				<th:block th:if="${canRunJob}">
					<td colspan="1" class="tab-subhead">Running</td>
				</th:block>
				<th:block th:if="${canSchedule || canUnschedule || canStopJob}">
					<td colspan="1" class="tab-subhead">Other Commands</td>
				</th:block>
			</tr>
	      	<tr>
				<td><label class="kfs-label" data-attribute-entry-name="DataDictionary.BatchJobStatus.attributes.name" data-attribute-entry=""></label></td>
				<td>${job.name}&nbsp;</td>
				<td><label class="kfs-label" data-attribute-entry-name="DataDictionary.BatchJobStatus.attributes.group" data-attribute-entry=""></label></td>
				<td>${job.group}&nbsp;</td>
				<th:block th:if="${canRunJob}">
					<td rowspan="2">
						<th:block th:if="${job.group == 'unscheduled' && !job.running}">
							<table class="positioningTable">
								<tr>
									<td><label for="startStep">Start Step</label>: </td>
									<td><input type="text" id="startStep" name="startStep" value="1" size="3" /></td>
								</tr>
								<tr>
									<td><label for="endStep">End Step</label>: </td>
									<td><input type="text" id="endStep" name="endStep" value="${job.numSteps}" size="3" /></td>
								</tr>
								<tr>
									<td><label for="startTime">Start Date/Time</label>: </td>
									<td>
										<input type="text" id="startTime" name="startTime" id="startTime" value="" maxlength="20" size="20" onchange="" onblur="" style="" class="">
										<img src="${ConfigProperties.kr.externalizable.images.url}cal.gif" id="startTime_datepicker" style="cursor: pointer;" title="Date selector" alt="Date selector" onmouseover="this.style.backgroundColor='red';" onmouseout="this.style.backgroundColor='transparent';"	/>
						                <script type="text/javascript">
						                  Calendar.setup(
						                          {
						                            inputField : "startTime", // ID of the input field
						                            ifFormat : "%m/%d/%Y %I:%M %p", // the date format
						                            button : "startTime_datepicker", // ID of the button
						                            showsTime: true,
						                            timeFormat: "12"
						                          }
						                  );
						               </script>			
									</td>
								</tr>
								<tr>
									<td><label for="emailAddress">Results Email Address</label>: </td>
									<td>
										<input type="text" id="emailAddress" name="emailAddress" id="emailAddress" value="" />
										<img src="${ConfigProperties.externalizable.images.url}tinybutton-mailtome.gif" onclick="document.getElementById('emailAddress').value = '${userEmailAddress}';" styleClass="globalbuttons" title="Mail To Me" alt="Mail To Me" />
									</td>
								</tr>
								<tr>
									<td></td>
									<td><input type="image" src="${ConfigProperties.externalizable.images.url}tinybutton-run.gif" styleClass="globalbuttons" property="methodToCall.runJob" title="Run Job" alt="Run Job" /></td>
								</tr>
							</table>
						</th:block>	
						&nbsp;				
					</td>
				</th:block>
				<th:block th:if="${canSchedule || canUnschedule || canStopJob}">
					<td rowspan="2">
						<th:block th:if="${canSchedule && !job.scheduled}">
							<input type="image" src="${ConfigProperties.externalizable.images.url}tinybutton-schedule.gif" styleClass="globalbuttons" property="methodToCall.schedule" title="Add to Standard Schedule" alt="Add to Standard Schedule" />
							<br />
						</th:block>				
						<th:block th:if="${canUnschedule && job.scheduled}">
							<input type="image" src="${ConfigProperties.externalizable.images.url}tinybutton-unschedule.gif" styleClass="globalbuttons" property="methodToCall.unschedule" title="Remove From Standard Schedule" alt="Remove From Standard Schedule" />
							<br />
						</th:block>
						<th:block th:if="${canStopJob && job.running}">
							<input type="image" src="${ConfigProperties.externalizable.images.url}tinybutton-stop.gif" styleClass="globalbuttons" property="methodToCall.stopJob" title="Stop Running Job" alt="Stop Running Job" />
							<br />
						</th:block>
						&nbsp;
					</td>
				</th:block>
			</tr>
			<tr>
				<td><label class="kfs-label" data-attribute-entry-name="DataDictionary.BatchJobStatus.attributes.status" data-attribute-entry=""></label></td>
				<td>${job.status}&nbsp;</td>
				<td colspan="2"><div th:replace="~{fragments/portal/portalLink :: content}" data-display-title="true" data-title="Batch File lookup (to retrieve logs and reports)" data-url="${ConfigProperties.application.url}/kr/lookup.do?methodToCall=start&businessObjectClassName=org.kuali.kfs.sys.batch.BatchFile&docFormKey=88888888&returnLocation=${ConfigProperties.application.url}/portal.do&hideReturnLink=true"></div></td>
			</tr>
		</table>
	  </div>		
	</section>
	<section class="kfs-tab" data-tab-title="Steps" data-default-open="true">
  <h3>Steps</h3>
		<div class="tab-container" align="center">
	      <table width="100%" cellpadding=0 cellspacing=0 class="datatable">
			<tr>
				<th class="tab-subhead">#</th>
				<td class="tab-subhead">Name</td>
			</tr>
	      	<c:forEach items="${job.steps}" var="step" varStatus="status">
		      	<tr>
		      		<th>${status.count}</th>
					<td>${step.name}&nbsp;</td>
				</tr>
			</tr>
		</table>
	  </div>		
	</section>
	<section class="kfs-tab" data-tab-title="Dependencies" data-default-open="true">
  <h3>Dependencies</h3>
		<div class="tab-container" align="center">
	      <table width="100%" cellpadding=0 cellspacing=0 class="datatable">
	      	<c:forEach items="${job.dependencies}" var="dep">
		      	<tr>
					<td>${dep.key} (${dep.value})&nbsp;</td>
				</tr>
			</tr>
		</table>
	  </div>		
	</section>
	<div class="kfs-panel-footer"></div>
  </form>
</div>
</body>
</html>
