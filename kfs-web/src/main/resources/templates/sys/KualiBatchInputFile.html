<!-- Thymeleaf template converted from JSP: sys/KualiBatchInputFile.jsp -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:kfs="http://www.thymeleaf.org/kfs">
<head>
  <meta charset="UTF-8" />
  <title th:text="${documentTitle}">sys/KualiBatchInputFile</title>
</head>
<body>
<div class="kfs-page" data-header-title="Batch File Upload" data-doc-title="">
  <form action="batchUpload.do" method="post">
	<input type="hidden" th:field="*{batchUpload.batchInputTypeName}" />
	
    <!--/*/ <th:block th:with="batchUploadAttributes=${DataDictionary.BatchUpload.attributes}"> /*/-->

	<strong><h2>	
	  <span th:text="#{${__MSG_KEY__}}"></span> <a href="${ConfigProperties.externalizable.help.url}${KualiForm.url}" tabindex="${KualiForm.nextArbitrarilyHighIndex}" target="helpWindow"  title="[Help]Upload">
	                                        <img src="${ConfigProperties.kr.externalizable.images.url}my_cp_inf.gif" alt="[Help]Upload" hspace=5 border=0  align="middle"></a>
	  </h2></strong>
	</br>
	
	<table width="100%" border="0"><tr><td>	
	  <div class="kfs-errors" data-key-match="*" th:if="${#fields.hasErrors('*')}"><h4>Errors Found In File:</h4></div>
	</td></tr></table>  
	</br>
		
	<section class="kfs-tab" data-tab-title="Manage Batch Files" data-default-open="true">
  <h3>Manage Batch Files</h3>
      <div class="tab-container" align="center">
          <h3>Add Batch Files</h3>
          <table width="100%" summary="" cellpadding="0" cellspacing="0">
            <tr>
              <th width="120">&nbsp;</th>
              <th> <div align="left"><label for="uploadFile"><font color="">${KFSConstants.REQUIRED_FIELD_SYMBOL}&nbsp;</font>Browse File</label></div></th>
              <th> <div align="left"><label for="batchUpload.fileUserIdentifer"><font color="">${KFSConstants.REQUIRED_FIELD_SYMBOL}&nbsp;</font>File Identifier</label></div></th>
              <th width="150"> <div align="center">Actions</div></th>
            </tr>
            
            <tr>
              <th scope="row"><div align="center">add:</div></th>
              <td class="infoline"><html:file styleId="uploadFile" property="uploadFile"/>
                <span class="fineprint"></span> </td>
              <td class="infoline"><div align="left">
                  <input type="text" name="batchUpload.fileUserIdentifer" th:field="*{batchUpload.fileUserIdentifer}" data-attribute-entry="${batchUploadAttributes.fileUserIdentifer}" />
              </div>
                <span class="fineprint"></span> </td>
              <td class="infoline"><div align="center">
              		<input type="image" src="${ConfigProperties.kr.externalizable.images.url}tinybutton-add1.gif" styleClass="globalbuttons" property="methodToCall.save" title="Upload Batch File" alt="Upload Batch File" />
              </td>
            </tr>
         </table>
      </div>
	</section>
	
	<div class="kfs-panel-footer"></div>
	
  </form>
</div>
</body>
</html>
