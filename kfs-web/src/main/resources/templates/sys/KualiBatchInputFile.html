<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Kuali Batch Input File</title>
</head>
<body>
<div layout:fragment="content">
<div class="kfs-page" data-header-title="Batch File Upload" data-doc-title="">
<h1>Batch File Upload</h1>
<form th:action="@{batchUpload}" method="post" enctype="multipart/form-data" id="kualiForm" name="KualiForm">
<div class="page-body">
	<input type="hidden" th:field="*{batchUpload.batchInputTypeName}" />
	
    <!-- th:with="batchUploadAttributes=${DataDictionary.BatchUpload.attributes}" -->

	<strong><h2>	
	  <span th:text="#{${KualiForm.titleKey}}"></span> <a href="${ConfigProperties.externalizable.help.url}${KualiForm.url}" tabindex="${KualiForm.nextArbitrarilyHighIndex}" target="helpWindow"  title="[Help]Upload">
	                                        <img src="${ConfigProperties.kr.externalizable.images.url}my_cp_inf.gif" alt="[Help]Upload" hspace=5 border=0  align="middle"></a>
	  </h2></strong>
	</br>
	
	<table width="100%" border="0"><tr><td>	
	  <kul:errors keyMatch="*" errorTitle="Errors Found In File:" warningTitle="Warnings Found In File:"/>
	</td></tr></table>  
	</br>
		
	<kul:tabTop tabTitle="Manage Batch Files" defaultOpen="true" tabErrorKey="">
      <div class="tab-container" align="center">
          <h3>Add Batch Files</h3>
          <table width="100%" summary="" cellpadding="0" cellspacing="0">
            <tr>
              <th width="120">&nbsp;</th>
              <th> <div align="left"><label for="uploadFile"><font color="">${T(org.kuali.kfs.sys.KFSConstants).REQUIRED_FIELD_SYMBOL}&nbsp;</font>Browse File</label></div></th>
              <th> <div align="left"><label for="batchUpload.fileUserIdentifer"><font color="">${T(org.kuali.kfs.sys.KFSConstants).REQUIRED_FIELD_SYMBOL}&nbsp;</font>File Identifier</label></div></th>
              <th width="150"> <div align="center">Actions</div></th>
            </tr>
            
            <tr>
              <th scope="row"><div align="center">add:</div></th>
              <td class="infoline"><html:file styleId="uploadFile" property="uploadFile"/>
                <span class="fineprint"></span> </td>
              <td class="infoline"><div align="left">
                  <kul:htmlControlAttribute attributeEntry="${batchUploadAttributes.fileUserIdentifer}" property="batchUpload.fileUserIdentifer"/>
              </div>
                <span class="fineprint"></span> </td>
              <td class="infoline"><div align="center">
              		<input type="image" th:src="@{${ConfigProperties.kr.externalizable.images.url}tinybutton-add1.gif}" styleClass="globalbuttons" property="methodToCall.save" title="Upload Batch File" alt="Upload Batch File" />
              </td>
            </tr>
         </table>
      </div>
	</kul:tabTop>
	
	<div th:replace="~{fragments/panelFooter :: panelFooter}"></div>
	
</div>
</div>
</div>
</body>
</html>
